    holding:  { art: "hold",  btn: "tense", icon: "fist", main: "",      sub: "",        label: "เกร็งไว้... 3 2 1" },
    ready:    { art: "hold",  btn: "tense", icon: "hand", main: "ปล่อยได้", sub: "",      label: "ครบ 3 วินาทีแล้ว ปล่อยเพื่อคลาย" },
    released: { art: "relax", btn: "relax", icon: "hand", main: "ปล่อย", sub: "เพื่อคลาย", label: null },

    const tapHint = { idle: "แตะเพื่อเริ่มเกร็ง", holding: "เกร็งไว้... 3 2 1 (แตะอีกครั้งเพื่อหยุด)", ready: "ครบ 3 วินาทีแล้ว แตะเพื่อปล่อยและคลาย" };

  return () => { if (raf) cancelAnimationFrame(raf); clearTimeout(nextTimer); stopLoop(); fitRO && fitRO.disconnect(); };   // cleanup on leave
}

/* TwoFrameRabbitAnimation — frame-by-frame swap (no crossfade), both frames preloaded and stacked in one box
   so the anchor never moves. Returns { el, play(), stop() }. Reduced motion → frame 1 as a still. */
function TwoFrameRabbitAnimation({ activityId, frame1, frame2, frameDuration, frameDurations, sway = false, isPlaying = true, w, h, alt }) {
  // frame2 optional (single frame); frameDurations = [ms frame1, ms frame2] for uneven holds; sway = CSS side-to-side loop
  const el = h_(`<div class="tf-anim${sway ? " tf-sway" : ""}" data-activity="${activityId}" role="img" aria-label="${esc(alt)}" style="aspect-ratio:${w}/${h}">
      <img class="tf-frame" src="${frame1}" width="${w}" height="${h}" alt="" decoding="sync">
      ${frame2 ? `<img class="tf-frame" src="${frame2}" width="${w}" height="${h}" alt="" decoding="sync" hidden>` : ""}
    </div>`);
  const [f1, f2] = el.querySelectorAll("img");
  const dur = frameDurations || [frameDuration, frameDuration];
  let timer = 0, on = 0, stopped = false;
  const stop = () => { stopped = true; clearTimeout(timer); timer = 0; el.classList.remove("is-playing"); };
  const tick = () => { on ^= 1; f1.hidden = !!on; f2.hidden = !on; timer = setTimeout(tick, dur[on]); };
  const play = () => {
    clearTimeout(timer); timer = 0; stopped = false; on = 0; f1.hidden = false; if (f2) f2.hidden = true;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;      // first frame as a still
    el.classList.add("is-playing");
    if (f2) timer = setTimeout(tick, dur[0]); else timer = -1;
  };
  if (isPlaying) Promise.all([f1, f2].filter(Boolean).map(i => i.decode ? i.decode().catch(() => {}) : 0)).then(() => { if (!stopped) play(); });
  return { el, play, stop, get playing() { return !!timer; } };
}
const h_ = (html) => h(html);

const bbSquarePoint = (i, p) => {   // corners: BL(85,135) TL(85,35) TR(185,35) BR(185,135), clockwise from BL
  const C = [[85, 135], [85, 35], [185, 35], [185, 135]];
  const a = C[i], b = C[(i + 1) % 4];
  return [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p];

/* ---------- BreathingTube + DraggableKnob (shared by the tutorial and the real gameplay) ----------
   T = { knobPosition, targetPosition, knobVelocity, isDragging, kbDir, dragOffset, releaseFloor } */
const bbTubeHTML = (extra = "") => `
  <div class="bb-tube ${extra}" data-zone="">
    <span class="bb-zone bb-zone-top"></span><span class="bb-zone bb-zone-bottom"></span>

    </button>
  </div>`;
const bbClamp01 = (v) => Math.max(0, Math.min(1, v));
// physics (spring–damper toward the finger + felt gravity; clamped velocity & position). mode = phase id.
function bbPhysicsStep(T, dt, mode, lowFx) {
  const P = BB.phys;
  if (T.kbDir) T.targetPosition = bbClamp01(T.targetPosition + T.kbDir * P.kbSpeed * dt * 1.3);
  if (lowFx) {             // reduced effects: follow directly at the phase speed limit
    const vmax = (mode === "INHALE" || mode === "EXHALE") ? P.vmaxPhase : P.vmaxFree;
    const d = T.targetPosition - T.knobPosition; T.knobVelocity = Math.sign(d) * Math.min(Math.abs(d) / dt, vmax);
  } else {
    const K = T.isDragging ? P.K : P.Krel, Cc = T.isDragging ? P.C : P.Crel;
    let g = 0; if (T.isDragging) g = mode === "INHALE" ? P.gUp * (T.targetPosition > T.knobPosition ? 1 : 0) : mode === "EXHALE" ? P.gDown : 0;
    T.knobVelocity += (K * (T.targetPosition - T.knobPosition) - Cc * T.knobVelocity + g) * dt;
    const up = mode === "INHALE" ? P.vmaxPhase : P.vmaxFree, down = mode === "EXHALE" ? P.vmaxPhase : P.vmaxFree;
    T.knobVelocity = Math.max(-down, Math.min(up, T.knobVelocity));
    if (!T.isDragging && T.knobPosition <= T.releaseFloor + 0.002 && T.knobVelocity < 0) T.knobVelocity = 0;   // stop softly at the release floor
  }
  T.knobPosition += T.knobVelocity * dt;
  if (T.knobPosition < 0) { T.knobPosition = 0; T.knobVelocity = Math.max(0, T.knobVelocity); }
  if (T.knobPosition > 1) { T.knobPosition = 1; T.knobVelocity = Math.min(0, T.knobVelocity); }
}
// release: a small, limited slide — never a fall
function bbRelease(T, mode, lowFx) {
  const P = BB.phys, drip = lowFx ? 0 : mode === "INHALE" ? P.dripUp : mode === "EXHALE" ? P.dripDown : P.dripHold;
  T.releaseFloor = bbClamp01(T.knobPosition - drip); T.targetPosition = T.releaseFloor;
}
// pointer + keyboard binding; pointer handling lives on the tube (touch-action:none) so a near-miss still grabs
function bbBindTube(tube, knob, T, { locked = () => false, onDrop = () => {} } = {}) {
  const ctl = { travel: 1 };
  ctl.measure = () => { ctl.travel = Math.max(1, tube.clientHeight - knob.offsetHeight - 12); };
  ctl.paint = () => {
    const y = T.knobPosition;
    knob.style.transform = `translateY(${(-y * ctl.travel).toFixed(1)}px)`;
    knob.setAttribute("aria-valuenow", Math.round(y * 100));
    tube.querySelector(".bb-fill").style.height = `${(6 + knob.offsetHeight / 2 + y * ctl.travel).toFixed(1)}px`;
  };
  const yFromClient = (clientY) => { const r = tube.getBoundingClientRect(); return (r.bottom - 6 - knob.offsetHeight / 2 - clientY) / ctl.travel; };
  tube.addEventListener("pointerdown", (e) => {
    if (locked() || e.button > 0) return;
    const y = yFromClient(e.clientY);
    if (!e.target.closest(".bb-knob") && Math.abs(y - T.knobPosition) * ctl.travel > knob.offsetHeight * 0.9) return;
    e.preventDefault();
    try { tube.setPointerCapture(e.pointerId); } catch (_) {}
    T.dragOffset = y - T.knobPosition;                              // no jump when grabbing off-centre
    T.targetPosition = T.knobPosition; T.isDragging = true; knob.classList.add("is-grabbed");
    if (document.activeElement !== knob) knob.focus({ preventScroll: true });
  });
  tube.addEventListener("pointermove", (e) => { if (T.isDragging && !T.kbDir) T.targetPosition = bbClamp01(yFromClient(e.clientY) - T.dragOffset); });
  const drop = () => { if (!T.isDragging) return; T.isDragging = false; knob.classList.remove("is-grabbed"); onDrop(); };
  tube.addEventListener("pointerup", drop); tube.addEventListener("pointercancel", drop); tube.addEventListener("lostpointercapture", drop);
  knob.addEventListener("contextmenu", (e) => e.preventDefault());
  // keyboard: hold ↑/↓ to move, hold Space/Enter to keep the knob held
  knob.addEventListener("keydown", (e) => {
    if (locked()) return;
    const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
    if (dir || e.key === " " || e.key === "Enter") { e.preventDefault(); if (e.repeat) return; T.kbDir = dir || 0; T.isDragging = true; T.targetPosition = T.knobPosition; knob.classList.add("is-grabbed"); }
  });
  knob.addEventListener("keyup", (e) => { if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter"].includes(e.key)) { e.preventDefault(); T.kbDir = 0; drop(); } });
  knob.addEventListener("blur", () => { if (T.kbDir) { T.kbDir = 0; drop(); } });
  ctl.drop = drop;
  return ctl;
}

      <div class="bb-col bb-done">

        ${img("paint", "bb-rabbit bb-rabbit-paint", "กระต่ายใส่หมวกเบเร่ต์ ถือพู่กันและจานสียิ้มอย่างมีความสุข")}
        <div class="bb-card"><b>เยี่ยมมาก!</b>จังหวะการหายใจดีมากเลย<br>พร้อมลองรอบถัดไปไหม?</div>

        ${img("paint2", "bb-rabbit bb-rabbit-paint2", "กระต่ายใส่หมวกเบเร่ต์ หลับตายิ้ม ถือพู่กันและจานสี")}
        <div class="bb-card is-green">ตอนนี้เราลองใช้<br>Box Breathing ครบ 2 รอบแล้ว<br>เมื่อรู้สึกโกรธหรือตึงเครียด<br>ลองใช้การหายใจแบบนี้<br>ช่วยให้ใจสงบลงได้นะ!</div>

  /* ---------- Screens 4–7: gameplay ---------- */
  const playHTML = () => shell(`

        <button class="bb-pause" data-bb="pause" aria-label="หยุดพัก">${BB_ICON.pauseBtn}</button>
      </div>
      <h1 class="bb-phase"><span class="bb-phase-ico"></span><span class="bb-phase-title"></span></h1>
      <p class="bb-instr"></p>
      <p class="bb-fb" aria-live="polite"></p>
      ${bbSquareSVG()}
      <div class="bb-arena">
        ${img("sit4", "bb-rabbit bb-rabbit-sit", "")}
        ${bbTubeHTML()}
        <span class="bb-dir" aria-hidden="true"></span>
        <div class="bb-count" aria-hidden="true"><b>4</b><span>วินาที</span></div>
      </div>
      <p class="bb-safe bb-safe-play">${BB.SAFE}</p>
      <p class="sr-only" id="bb-kbhelp">ใช้ลูกศรขึ้นหรือลงค้างไว้เพื่อเลื่อนหมุด กด Space ค้างไว้เพื่อค้างหมุด</p>
      <div class="bb-menu" hidden role="dialog" aria-modal="true" aria-labelledby="bb-menu-t">
        <div class="bb-menu-card">
          <h2 id="bb-menu-t">หยุดพักอยู่</h2>
          <p>${BB.SAFE}<br>ถ้ารู้สึกไม่สบาย ออกจากกิจกรรมได้เลย</p>
          <button class="bb-btn" data-bb="resume">เล่นต่อ ${ICON.chevron}</button>
          <button class="bb-btn bb-ghost" data-bb="restart">${BB_ICON.retry} เริ่มรอบนี้ใหม่</button>
          <label class="bb-check"><input type="checkbox" id="bb-lowfx" ${S.lowFx ? "checked" : ""}> ลดเอฟเฟกต์การเคลื่อนไหวของหมุด</label>
          <button class="bb-link" data-bb="skip">ข้ามกิจกรรม กลับสู่แผนที่</button>
        </div>
      </div>
    </div>`, { label: "ย้อนกลับไปหน้าวิธีเล่น" });

  const $q = (s) => root.querySelector(s);
  const render = (screen) => {
    stopLoop();
    S.screen = screen;
    root.innerHTML = screen === "play" ? playHTML() : screens[screen]();
    root.scrollTop = 0;
    if (screen === "play") setupPlay();
    if (screen === "tutorial") setupTutorial();
    const f = root.querySelector(screen === "play" ? ".bb-knob" : ".bb-btn"); f && f.focus({ preventScroll: true });
  };

  /* ---------- BreathingTube + DraggableKnob ---------- */
  const resetRound = () => {
    Object.assign(S, { phaseIndex: 0, phaseProgress: 0, holdElapsedTime: 0, knobPosition: 0, targetPosition: 0, knobVelocity: 0, isDragging: false, kbDir: 0, isPaused: false });
    lastFeedback = ""; lastCount = -1;
  };
  let tubeCtl = null;
  const setupPlay = () => {
    const tube = $q(".bb-tube"), knob = $q(".bb-knob");
    tubeCtl = bbBindTube(tube, knob, S, { locked: () => S.isPaused, onDrop: () => bbRelease(S, BB.phases[S.phaseIndex].id, S.lowFx) });
    tubeRO = new ResizeObserver(() => { tubeCtl.measure(); paint(); }); tubeRO.observe(tube); tubeCtl.measure();
    enterPhase(S.phaseIndex); paint(); startLoop();
  };
  const clamp01 = bbClamp01;

  /* ---------- Screen 3: free practice with the real tube (counts for nothing) ---------- */
  const setupTutorial = () => {
    const T = { knobPosition: 0, targetPosition: 0, knobVelocity: 0, isDragging: false, kbDir: 0, dragOffset: 0, releaseFloor: 0 };
    const tube = $q(".bb-tube"), knob = $q(".bb-knob"), fb = $q(".bb-tut-fb"), items = root.querySelectorAll(".bb-legend li");
    let mode = "IDLE", held = 0, said = "";
    const ctl = bbBindTube(tube, knob, T, { onDrop: () => bbRelease(T, mode === "HOLD_TOP" ? "HOLD_TOP" : mode === "EXHALE" ? "EXHALE" : "INHALE", S.lowFx) });
    tubeRO = new ResizeObserver(() => { ctl.measure(); ctl.paint(); }); tubeRO.observe(tube); ctl.measure(); ctl.paint();
    const say = (t) => { if (t !== said) { said = t; fb.textContent = t; } };
    const loopT = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const P = BB.phys, y = T.knobPosition, d = T.targetPosition - y;
      // which of the 4 actions is the player doing right now? (same physics mode as the real game)
      let next = "IDLE";   // zones first: a held knob near the end counts as holding even if the finger is past the end
      if (T.isDragging && y >= P.zoneTop && T.targetPosition >= P.zoneTop) next = "HOLD_TOP";
      else if (T.isDragging && y <= P.zoneBottom && T.targetPosition <= P.zoneBottom) next = "HOLD_BOTTOM";
      else if (T.isDragging && d > 0.012) next = "INHALE";
      else if (T.isDragging && d < -0.012) next = "EXHALE";
      else if (T.isDragging) next = mode === "INHALE" || mode === "EXHALE" ? mode : "IDLE";
      if (next !== mode) { if (!next.startsWith("HOLD")) held = 0; if (next.startsWith("HOLD") && mode !== next) held = 0; mode = next; }
      bbPhysicsStep(T, dt, mode === "IDLE" ? "FREE" : mode, S.lowFx);
      if (mode.startsWith("HOLD")) held = Math.min(BB.PHASE_S, held + dt);
      const i = { INHALE: 0, HOLD_TOP: 1, EXHALE: 2, HOLD_BOTTOM: 3 }[mode];
      items.forEach(li => li.classList.toggle("is-now", +li.dataset.i === i));
      tube.dataset.zone = mode === "HOLD_TOP" ? "top" : mode === "HOLD_BOTTOM" ? "bottom" : "";
      tube.style.setProperty("--hold", (held / BB.PHASE_S).toFixed(3));
      const left = Math.ceil(BB.PHASE_S - held - 1e-6);
      if (mode === "INHALE") say("เลื่อนขึ้น = หายใจเข้า");
      else if (mode === "EXHALE") say("เลื่อนลง = หายใจออก");
      else if (mode === "HOLD_TOP") say(left > 0 ? `ค้างไว้ด้านบน = กลั้นหายใจ… ${left}` : "ครบ 4 วินาทีแล้ว! ลองเลื่อนลงต่อได้เลย");
      else if (mode === "HOLD_BOTTOM") say(left > 0 ? `ค้างไว้ด้านล่าง = กลั้นหายใจ… ${left}` : "ครบแล้ว! ลองซ้ำได้ตามใจ หรือกดเริ่มฝึกได้เลย");
      else if (!T.isDragging && said === "") say("ลองแตะหมุดหน้ากระต่าย แล้วเลื่อนขึ้นดูนะ");
      ctl.paint();
      if (S.screen === "tutorial") raf = requestAnimationFrame(loopT);
    };
    last = performance.now(); raf = requestAnimationFrame(loopT);
  };

  /* ---------- state machine ---------- */
  const enterPhase = (i) => {
    S.phaseIndex = i; S.phaseProgress = 0; S.holdElapsedTime = 0; lastCount = -1;
    const ph = BB.phases[i], scr = $q(".bb-play"); if (!scr) return;
    scr.dataset.phase = ph.id;
    $q(".bb-phase-ico").innerHTML = BB_ICON[ph.icon];
    $q(".bb-phase-title").textContent = ph.title;
    $q(".bb-instr").innerHTML = esc(ph.text).replace(/\n/g, "<br>");
    $q(".bb-dir").innerHTML = ph.icon === "pause" ? "" : BB_ICON[ph.icon];
    root.querySelectorAll(".bb-sq-side, .bb-sq-lbl").forEach(el => el.classList.toggle("is-now", el.dataset.side === ph.side));
    $q(".bb-tube").dataset.zone = ph.id === "HOLD_TOP" ? "top" : ph.id === "HOLD_BOTTOM" ? "bottom" : "";
    feedback(i === 0 && S.currentRound === 1 ? "กดหมุดค้างไว้ แล้วค่อย ๆ เลื่อนขึ้น" : ph.ok);
  };
  const feedback = (t) => { if (t !== lastFeedback) { lastFeedback = t; const f = $q(".bb-fb"); if (f) f.textContent = t; } };
  const glow = () => { const k = $q(".bb-knob"); if (!k) return; k.classList.remove("is-done"); void k.offsetWidth; k.classList.add("is-done"); };

  const step = (dt) => {
    const P = BB.phys, ph = BB.phases[S.phaseIndex];
    bbPhysicsStep(S, dt, ph.id, S.lowFx);
    // --- phase logic ---
    const ahead = S.targetPosition - S.knobPosition;
    if (ph.id === "INHALE") {
      S.phaseProgress = S.knobPosition;
      if (S.isDragging) feedback(ahead > 0.16 ? ph.fast : ph.ok);
      if (S.knobPosition >= 0.985) { S.knobPosition = 1; glow(); enterPhase(1); }
    } else if (ph.id === "EXHALE") {
      S.phaseProgress = 1 - S.knobPosition;
      if (S.isDragging) feedback(ahead < -0.16 ? ph.fast : ph.ok);
      if (S.knobPosition <= 0.015) { S.knobPosition = 0; glow(); enterPhase(3); }
    } else {
      const inZone = ph.id === "HOLD_TOP" ? S.knobPosition >= P.zoneTop : S.knobPosition <= P.zoneBottom;
      if (S.isDragging && inZone) { S.holdElapsedTime += dt; feedback(ph.ok); }
      else feedback(ph.away);                       // countdown pauses; nothing is reset
      S.phaseProgress = Math.min(1, S.holdElapsedTime / BB.PHASE_S);
      if (S.holdElapsedTime >= BB.PHASE_S) {
        glow();
        if (ph.id === "HOLD_TOP") enterPhase(2);
        else return roundDone();
      }
    }
  };
  const roundDone = () => {
    stopLoop(); S.isDragging = false;
    if (S.currentRound < BB.ROUNDS) { feedback("เยี่ยมเลย ครบหนึ่งรอบแล้ว"); setTimeout(() => S.screen === "play" && render("round"), 500); }
    else { S.isCompleted = true; setTimeout(() => S.screen === "play" && render("final"), 500); }
  };

  /* ---------- presentation (reads state only) ---------- */
  const paint = () => {
    const knob = $q(".bb-knob"); if (!knob) return;
    const y = S.knobPosition;
    tubeCtl.paint();
    knob.setAttribute("aria-valuetext", `${BB.phases[S.phaseIndex].title} ${Math.round(S.phaseProgress * 100)}%`);
    // square dot ← same phase index + progress
    const [cx, cy] = bbSquarePoint(S.phaseIndex, S.phaseProgress);
    root.querySelectorAll(".bb-sq-dot, .bb-sq-dot-glow").forEach(c => { c.setAttribute("cx", cx.toFixed(1)); c.setAttribute("cy", cy.toFixed(1)); });
    // countdown: drag phases from remaining distance, hold phases from remaining time
    const n = Math.max(0, Math.ceil(BB.PHASE_S * (1 - S.phaseProgress) - 1e-6));
    if (n !== lastCount) { lastCount = n; $q(".bb-count b").textContent = n; }
    const ph = BB.phases[S.phaseIndex].id;
    $q(".bb-count").classList.toggle("is-running", (ph === "HOLD_TOP" || ph === "HOLD_BOTTOM") && S.isDragging);
    $q(".bb-tube").style.setProperty("--hold", S.phaseProgress.toFixed(3));
    // rabbit: chest rises with the knob, stays still while holding, settles on the way down
    $q(".bb-rabbit-sit").style.transform = S.lowFx ? "" : `scale(${(1 + 0.035 * y).toFixed(4)}, ${(1 + 0.05 * y).toFixed(4)})`;
  };
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!S.isPaused) step(dt);
    if (S.screen !== "play") return;
    paint();
    raf = requestAnimationFrame(loop);
  };
  const startLoop = () => { if (raf) return; last = performance.now(); raf = requestAnimationFrame(loop); };
  const stopLoop = () => { if (raf) cancelAnimationFrame(raf); raf = 0; tubeRO && tubeRO.disconnect(); tubeRO = null; };

  const setPaused = (p) => {
    S.isPaused = p; S.isDragging = false; S.kbDir = 0; S.knobVelocity = 0; S.targetPosition = S.knobPosition;
    const m = $q(".bb-menu"); if (!m) return;
    m.hidden = !p; $q(".bb-play").classList.toggle("is-paused", p);
    if (p) $q("[data-bb=resume]").focus({ preventScroll: true }); else $q(".bb-knob").focus({ preventScroll: true });
  };
  const onVis = () => { if (document.hidden && S.screen === "play" && !S.isPaused) setPaused(true); };
  document.addEventListener("visibilitychange", onVis);

  root.addEventListener("change", (e) => { if (e.target.id === "bb-lowfx") S.lowFx = e.target.checked; });
  root.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.screen === "play") { e.preventDefault(); setPaused(!S.isPaused); } });
  root.addEventListener("click", (e) => {
    const b = e.target.closest("[data-bb]"); if (!b) return;
    const a = b.dataset.bb;
    if (a === "back") {
      const prev = { intro: null, explain: "intro", tutorial: "explain", play: "tutorial", round: null, final: null }[S.screen];
      return prev ? render(prev) : api.exit();
    }
    if (a === "toExplain") render("explain");
    if (a === "toTutorial") render("tutorial");
    if (a === "toPlay") { S.currentRound = 1; resetRound(); render("play"); }
    if (a === "pause") setPaused(true);
    if (a === "resume") setPaused(false);
    if (a === "restart") { resetRound(); render("play"); }
    if (a === "skip") api.exit();                                  // leaving never completes the activity
    if (a === "nextRound") { S.currentRound = 2; resetRound(); render("play"); }
    if (a === "retryRound") { resetRound(); render("play"); }      // redo the current (first) round
    if (a === "finish") api.complete();                            // only after 2 rounds → completed + sticker II + tarot II
  });

  render("intro");
  return () => { stopLoop(); document.removeEventListener("visibilitychange", onVis); };
}

/* ---------- DragDropController — one pointer at a time; tap/keyboard handled by the click event ---------- */
function CrDragDrop(scope, { onDrop, scroller }) {
  let drag = null, raf = 0, suppressClick = false;
  // Hit test on the WHOLE visible category box (+ a small tolerance), read fresh from getBoundingClientRect each time,
  // so it stays right after scrolling / resizing and child elements never block it. Nearest box wins → no overlaps.
  const TOL = 24, OVERLAP = 0.3;
  // Target box for a drop: (1) the box the pointer is in (+ tolerance; the whole box counts — title, border, cards
  // already inside; 24 px tolerance), else (2) the box the dragged card clearly overlaps (≥ 30 % of the card's area), so a release just
  // past an edge still lands. `card` is the card's real rect at that moment (target position, not the eased ghost).
  const zoneAt = (x, y, card) => {
    let best = null, bestD = Infinity, ov = null, ovA = 0;
    scope.querySelectorAll(".cr-zone[data-zone]").forEach(z => {
      const r = z.getBoundingClientRect();
      const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom), d = Math.hypot(dx, dy);
      if (d <= TOL && d < bestD) { best = z; bestD = d; }
      if (card) {
        const w = Math.min(r.right, card.left + card.width) - Math.max(r.left, card.left), hh = Math.min(r.bottom, card.top + card.height) - Math.max(r.top, card.top);
        const a = w > 0 && hh > 0 ? (w * hh) / (card.width * card.height) : 0;
        if (a > ovA) { ovA = a; ov = z; }
      }
    });
    return best || (ovA >= OVERLAP ? ov : null);
  };
  const cardRect = () => drag && drag.home ? { left: drag.tx, top: drag.ty, width: drag.home.width, height: drag.home.height } : null;
  const frame = () => {
    if (!drag || !drag.ghost) return;
    const k = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0.38;   // soft follow, never laggy
    drag.gx += (drag.tx - drag.gx) * k; drag.gy += (drag.ty - drag.gy) * k;
    drag.ghost.style.transform = `translate(${drag.gx}px, ${drag.gy}px) rotate(-2deg) scale(1.05)`;
    // gentle auto-scroll near the edges so far-away zones stay reachable while dragging
    const r = scroller.getBoundingClientRect(), edge = 44;   // only very close to the screen edge, so dropping near a box's top never drifts
    if (drag.py < r.top + edge) scroller.scrollTop -= Math.ceil((r.top + edge - drag.py) / 6);
    else if (drag.py > r.bottom - edge) scroller.scrollTop += Math.ceil((drag.py - (r.bottom - edge)) / 6);
    const z = zoneAt(drag.px, drag.py, cardRect());
    if (z !== drag.over) { drag.over && drag.over.classList.remove("is-over"); z && z.classList.add("is-over"); drag.over = z; }
    raf = requestAnimationFrame(frame);
  };
  const start = () => {
    const r = drag.el.getBoundingClientRect();
    const g = drag.el.cloneNode(true);
    g.removeAttribute("id"); g.classList.add("cr-ghost"); g.setAttribute("aria-hidden", "true");
    Object.assign(g.style, { width: r.width + "px", height: r.height + "px", left: "0px", top: "0px" });
    document.body.appendChild(g);
    drag.ghost = g; drag.ox = drag.x0 - r.left; drag.oy = drag.y0 - r.top;
    drag.gx = r.left; drag.gy = r.top; drag.tx = r.left; drag.ty = r.top; drag.home = r;
    drag.el.classList.add("is-lifted"); scope.classList.add("is-dragging");
    raf = requestAnimationFrame(frame);
  };
  const finish = (dropped) => {
    cancelAnimationFrame(raf); raf = 0;
    // the drop target is decided from the REAL release position (pointer + card rect now), not the last animation frame
    const target = dropped && drag && drag.ghost ? zoneAt(drag.px, drag.py, cardRect()) : null;
    const d = drag; drag = null; scope.classList.remove("is-dragging");
    if (!d) return;
    d.over && d.over.classList.remove("is-over");
    if (!d.ghost) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    if (target && onDrop(d.id, target.dataset.zone) !== false) { d.ghost.remove(); return; }   // accepted
    // released outside both boxes, cancelled, or rejected (wrong box): glide back home
    // released outside a zone (or cancelled): glide back home
    const g = d.ghost, src = d.el;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { g.remove(); src.classList.remove("is-lifted"); return; }
    g.style.transition = "transform .24s cubic-bezier(.3,.7,.4,1)";
    g.style.transform = `translate(${d.home.left}px, ${d.home.top}px) rotate(0) scale(1)`;
    setTimeout(() => { g.remove(); src.classList.remove("is-lifted"); }, 250);
  };
  const down = (e) => {
    const el = e.target.closest("[data-card]");
    if (!el || !scope.contains(el) || drag || (e.pointerType === "mouse" && e.button !== 0)) return;   // one card at a time
    e.preventDefault(); el.focus({ preventScroll: true });
    drag = { id: el.dataset.card, el, pid: e.pointerId, x0: e.clientX, y0: e.clientY, px: e.clientX, py: e.clientY, ghost: null, over: null };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const move = (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    drag.px = e.clientX; drag.py = e.clientY;
    if (!drag.ghost && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 7) start();
    if (drag.ghost) { drag.tx = e.clientX - drag.ox; drag.ty = e.clientY - drag.oy; }
  };
  const up = (e) => { if (drag && e.pointerId === drag.pid) { drag.px = e.clientX; drag.py = e.clientY; if (drag.ghost) { drag.tx = e.clientX - drag.ox; drag.ty = e.clientY - drag.oy; } finish(true); } };
  const cancel = (e) => { if (drag && e.pointerId === drag.pid) finish(false); };
  scope.addEventListener("pointerdown", down);
  scope.addEventListener("pointermove", move);
  scope.addEventListener("pointerup", up);
  scope.addEventListener("pointercancel", cancel);
  scope.addEventListener("lostpointercapture", cancel);
  scope.addEventListener("click", (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  return { destroy() { if (drag) { drag.ghost && drag.ghost.remove(); drag = null; } cancelAnimationFrame(raf); } };
}

      return z === c.category ? t : `${esc(C.step1.reconsider[c.category])}<br><small>${t}</small>`;
    }
    const D = C.step2;
    if (z === c.category) return `“${esc(c.text)}” — ${esc(c.feedback)}`;

    if (!c || !z) return false;
    if (D.checkOnDrop && z !== c.category) {                    // wrong box: nothing stored, counter unchanged, card goes back
      selected = null; closeSheet();
      root.querySelectorAll(".cr-panel [data-card]").forEach(b => b.setAttribute("aria-pressed", "false"));
      $(".cr-panel", root) && $(".cr-panel", root).classList.remove("has-selection");
      const f = $(".cr-feedback", root); if (f) f.innerHTML = `<b>${esc(D.wrongDrop)}</b>`;
      const el = root.querySelector(`[data-card="${id}"]`);

      return false;

    if (!st.reviewedCards.includes(id)) st.reviewedCards.push(id);
    selected = null; closeSheet();
    const done = stepDone(step);
    const allIn = D.cards.every(x => st.placements[x.id]);

          <button class="cr-x" data-cr="close" aria-label="ปิด">${ICON.x}</button>
          <img src="${c.image}" alt="" class="cr-sheet-img">
          <p class="cr-sheet-text">${esc(c.text)}</p>
          ${cur ? `<p class="cr-sheet-note">${feedbackFor(2, c, cur)}</p>` : `<p class="cr-sheet-note">${esc("ข้อมูลนี้บอกอะไรเราได้บ้าง? เลือกช่องที่คิดว่าเหมาะสม")}</p>`}
          <div class="cr-sheet-opts">${D.categories.map(k => `<button class="cr-opt" data-tone="${k.tone}" data-place="${k.id}" aria-pressed="${cur === k.id}">
              <img src="${k.icon}" alt="">${esc(k.title)}</button>`).join("")}</div>
        </div></div>`);
    root.appendChild(sh);
    $(".cr-opt", sh).focus({ preventScroll: true });
  };
  const closeSheet = () => { const s = $(".cr-sheet", root); if (s) { s.remove(); lastFocus && lastFocus.isConnected && lastFocus.focus({ preventScroll: true }); } };

  const openSettings = () => {

        <div class="cr-sheet-card">
          <button class="cr-x" data-cr="close" aria-label="${esc(T.close)}">${ICON.x}</button>
          <h2 class="cr-set-h">${esc(T.title)}</h2>

          <button class="cr-set-btn is-danger" data-cr="restartYes" hidden>${esc(T.restartConfirm)}</button>
          <p class="cr-set-note">${esc(T.restartNote)}</p>
          <button class="cr-set-btn" data-cr="map">${esc(T.map)}</button>
        </div></div>`);
    root.appendChild(sh); $(".cr-set-btn", sh).focus({ preventScroll: true });
  };

  /* ---------- events (bound once on the activity root; screens re-render inside it) ---------- */
  const onClick = (e) => {
    const t = e.target;
    if (t.classList && t.classList.contains("cr-sheet")) return closeSheet();             // tap on the backdrop
    const b = t.closest("button");
    if ((!b || b.classList.contains("cr-zone-hit")) && selected && (S.screen === "factThought" || S.screen === "evidence")) {   // tap-to-place: whole box
      const zb = t.closest(".cr-zone[data-zone]"); if (zb) return place(S.screen === "factThought" ? 1 : 2, selected, zb.dataset.zone);
    }
    if (!b || b.disabled) return;
    const a = b.dataset.cr;

    if (a === "settings") return openSettings();
    if (a === "restart") { b.hidden = true; const y = $("[data-cr=restartYes]", root); y.hidden = false; y.focus(); return; }

    if (a === "map") { closeSheet(); return api.exit(); }
    if (a === "back") return S.screen === "introduction" ? api.exit() : go("introduction");
    if (a === "start") return go("factThought");
    if (a === "next") { if (S.screen === "factThought" && stepDone(1)) return go("evidence"); return; }
    if (a === "finish") {                                                                   // completion fires once
      if (completing || !stepDone(1)) return;   // all 8 sorted correctly → straight to the completion page
      completing = true; S.completed = true; b.disabled = true; return api.complete();
    }
    if (b.dataset.place) return place(2, selected, b.dataset.place);
    if (b.dataset.card) return tapCard(S.screen === "factThought" ? 1 : 2, b.dataset.card);
    if (b.dataset.zone) {                                                                   // tap-to-place
      if (selected) return place(S.screen === "factThought" ? 1 : 2, selected, b.dataset.zone);

    const sheet = $(".cr-sheet", root);
    if (sheet && e.key === "Tab") {                       // keep keyboard focus inside the open sheet
      const f = [...sheet.querySelectorAll("button:not([hidden]):not([disabled])")];
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }

  };
  root.addEventListener("click", onClick);
  root.addEventListener("keydown", onKey);
  render();
  return () => { stopAll(); root.removeEventListener("click", onClick); root.removeEventListener("keydown", onKey); document.querySelectorAll(".cr-ghost").forEach(g => g.remove()); };

    hand = h(`<div class="jw-hand" aria-hidden="true">
        <img class="jw-pencil" src="${Hd.pencil.src}" alt="" draggable="false" style="width:calc(${Hd.pencil.w * Hd.pencil.scale}px * var(--hk));left:calc(${-Hd.pencil.tip[0] * Hd.pencil.scale}px * var(--hk));top:calc(${-Hd.pencil.tip[1] * Hd.pencil.scale}px * var(--hk))">
        <img class="jw-paw" src="${Hd.paw.src}" alt="" draggable="false" style="width:calc(${Hd.paw.w * Hd.paw.scale}px * var(--hk));left:calc(${Hd.paw.at[0]}px * var(--hk));top:calc(${Hd.paw.at[1]}px * var(--hk))">
      </div>`);
    map.appendChild(hand);
  }
  let lastW = 0, lastH = 0;
  const ro = new ResizeObserver(() => { const w = desk.clientWidth, hh = desk.clientHeight; if (Math.abs(w - lastW) > 1 || Math.abs(hh - lastH) > 1) { lastW = w; lastH = hh; relayout(); } });
  ro.observe(desk);
  const ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(() => { if (!desk.isConnected) return; relayout(); if (mode === "write" && state.isAnimationPlaying) kick(); });
  return {
    get total() { return total; }, get spreads() { return spreads.length; },
    play() { if (state.animationProgress >= total) state.animationProgress = 0; state.isAnimationPlaying = true; state.isAnimationCompleted = false; kick(); },
    pause() { state.isAnimationPlaying = false; },
    skip() { state.isAnimationPlaying = false; state.animationProgress = total; frame(total); state.isAnimationCompleted = true; onDone && onDone(); },
    replay() { state.animationProgress = 0; state.isAnimationCompleted = false; frame(0); state.isAnimationPlaying = true; kick(); },
    goSpread(i) { if (i < 0 || i >= spreads.length) return; state.readerSpread = i; showSpread(i); },
    destroy() { ro.disconnect(); cancelAnimationFrame(raf); raf = 0; },
  };
}

/* ---------- the activity ---------- */
function JournalActivity(root, api, { replay } = {}) {
  const C = JOURNAL_CONFIG;
  if (!JOURNAL_STATE) JOURNAL_STATE = journalInitialState();
  const S = JOURNAL_STATE;
  if (replay || S.completed) { S.currentScreen = "intro"; S.completed = false; }
  if (!C.screens.includes(S.currentScreen)) S.currentScreen = "reader";   // a session saved on a removed page (connections / completion) resumes at the notebook
  let parts = [], completing = false, canvas = null, desk = null;
  root.classList.add("jr", "jw");

  // Journaling header (all screens): no "ANGER GAME" forest header / gear — back button + the PMR progress bar (n / 6)
  const progHead = () => {
    const i = C.screens.indexOf(S.currentScreen), n = C.screens.length;
    const dots = C.screens.map((_, k) => `<span class="pp-dot ${k < i ? "is-done" : k === i ? "is-now" : ""}"></span>`).join("");
    return `<div class="jw-plainbar">
        <button class="jw-icon" data-jr="back" aria-label="${i ? "ย้อนกลับ" : "ออกจากกิจกรรม กลับสู่แผนที่"}">${ICON.back}</button>
        <div class="pmr-progress jw-progress" role="progressbar" aria-label="ความคืบหน้ากิจกรรม Journaling" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${i + 1}" aria-valuetext="ขั้นที่ ${i + 1} จาก ${n}">
          <span class="pp-track"><span class="pp-fill" style="width:${i / (n - 1) * 100}%"></span>${dots}</span>
          <span class="pp-num">${i + 1} / ${n}</span>
        </div></div>`;
  };
  const plainHead = progHead, head = progHead;
  const badge = (title) => `<h1 class="jr-badge jw-badge" tabindex="-1">${esc(title)}</h1>`;
  const stop = () => { parts.forEach(p => p && p.destroy && p.destroy()); parts = []; canvas = null; desk = null; };
  const go = (screen) => { S.currentScreen = screen; render(); root.scrollTop = 0; };

  const render = () => {
    stop();
    const sc = S.currentScreen, isDesk = sc === "writing" || sc === "reader";
    root.innerHTML = isDesk ? deskScreen(sc) : `<div class="jr-screen" data-screen="${sc}">${head()}<div class="jr-body">${screens[sc]()}</div></div>`;
    after[sc] && after[sc]();
    const f = $(".jr-badge, .jw-intro-h", root); f && f.focus({ preventScroll: true });
  };

  const screens = {
    intro() { const I = C.intro; return `
      <h1 class="jw-intro-h" tabindex="-1"><span class="jw-sign">${esc(I.heading)}</span><span class="jw-sub">${esc(I.sub)}</span></h1>
      <img class="jw-scene" src="${C.assets.introScene}" width="560" height="640" alt="${esc(I.sceneAlt)}">
      <p class="jw-say jw-intro-lead">${esc(I.lead)}</p>
      <p class="jr-inst">${esc(I.instruction)}</p>
      <div class="jr-actions"><button class="jr-btn" data-jr="start">${esc(I.start)} ${ICON.chevron}</button>
        <button class="jr-btn2" data-jr="skipActivity">${esc(I.skip)}</button></div>`; },
    braindump() { const B = C.brainDump; return `
      ${badge(B.title)}<p class="jr-inst">${esc(B.instruction)}</p>
      <div class="jr-canvas-wrap jw-paper"></div>
      <div class="jr-tools" role="toolbar" aria-label="เครื่องมือวาด">
        <button class="jr-tool" data-tool="pen" aria-pressed="${S.drawingTool === "pen"}">${JR_ICON.pen}<span>ปากกา</span></button>
        <button class="jr-tool" data-tool="eraser" aria-pressed="${S.drawingTool === "eraser"}">${JR_ICON.eraser}<span>ยางลบ</span></button>
        <button class="jr-tool" data-jr="undo">${JR_ICON.undo}<span>ย้อนกลับ</span></button>
        <button class="jr-tool" data-jr="clear">${JR_ICON.trash}<span>ล้างทั้งหมด</span></button>
      </div>
      <div class="jr-colors" role="radiogroup" aria-label="สีปากกา">${B.colors.map(c => `<button class="jr-color" role="radio" data-color="${c.id}" style="--c:${c.hex}" aria-checked="${S.selectedColor === c.id}" aria-label="${esc(c.name)}"></button>`).join("")}</div>
      <div class="jr-sizes" role="radiogroup" aria-label="ขนาดเส้น"><span>ขนาดเส้น</span>${B.sizes.map(z => `<button class="jr-size" role="radio" data-size="${z.id}" aria-checked="${S.brushSize === z.id}" aria-label="${esc(z.name)}"><i style="--d:${Math.round(6 + z.px * .45)}px"></i></button>`).join("")}</div>
      <p class="jr-privacy">🔒 ${esc(B.privacy)}</p>
      <div class="jr-actions jr-row"><button class="jr-btn2" data-jr="toWriting">${esc(B.skip)}</button>
        <button class="jr-btn" data-jr="toWriting">${esc(B.done)} ${ICON.chevron}</button></div>`; },
    connections() { const K = C.connections, n = K.elements.length; return `
      ${badge(K.title)}<p class="jr-inst">${esc(K.instruction)}</p>
      <div class="jw-net" role="group" aria-label="แผนภาพความเชื่อมโยง">
        <svg class="jw-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${K.links.map(([a, b]) => {
          const pa = netPos(K.elements.findIndex(e => e.id === a), n), pb = netPos(K.elements.findIndex(e => e.id === b), n);
          return `<line data-a="${a}" data-b="${b}" x1="${pa[0]}" y1="${pa[1]}" x2="${pb[0]}" y2="${pb[1]}"/>`; }).join("")}</svg>
        <img class="jw-net-rabbit" src="${C.assets.reflectRabbit}" alt="กระต่ายหน้าบึ้ง อยู่ตรงกลางแผนภาพ">
        ${K.elements.map((e, i) => { const p = netPos(i, n); return `<button class="jw-node" data-node="${e.id}" style="left:${p[0]}%;top:${p[1]}%" aria-pressed="${S.selectedConnection === e.id}">
          ${JR_ICON[e.icon]}<b>${esc(e.label)}</b><small>${esc(e.short)}</small></button>`; }).join("")}
      </div>
      <p class="jw-seen" aria-live="polite"></p>
      <section class="jw-detail" aria-live="polite"></section>
      <div class="jw-tipbox"><span aria-hidden="true">💡</span><p>${esc(K.spirit)}</p><img src="${C.assets.spirit}" alt="ภูตกระต่าย" class="jw-spirit-sm"></div>
      <div class="jr-actions jr-row"><button class="jr-btn2" data-jr="toReader">${JR_ICON.book}${esc(K.back)}</button>
        <button class="jr-btn" data-jr="toCompletion">${esc(K.next)} ${ICON.chevron}</button></div>`; },
  };
  const netPos = (i, n) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [50 + 37 * Math.cos(a), 50 + 39 * Math.sin(a)].map(v => +v.toFixed(2)); };

  // screens 3 & 4: full-height desk with the notebook picture behind the bars
  const deskScreen = (sc) => {
    const W = C.writing, R = C.reader, D = C.desk;
    const bottom = sc === "writing" ? `
        <div class="jw-ctrl" role="toolbar" aria-label="ควบคุมแอนิเมชัน">
          <button class="jw-cbtn" data-jr="playPause"></button>
          <button class="jw-cbtn" data-jr="skipAnim">${JR_ICON.skip}<span>${esc(W.skipAnim)}</span></button>
          <button class="jw-cbtn" data-jr="replayAnim">${JR_ICON.replay}<span>${esc(W.replay)}</span></button>
        </div>
        <div class="jw-next-slot"><p class="jw-status" aria-live="polite"></p><button class="jr-btn" data-jr="toReader" hidden>${JR_ICON.book}${esc(W.read)} ${ICON.chevron}</button></div>`
      : `
        <div class="jw-spread-nav" hidden><button class="jr-arrow" data-spread="-1" aria-label="หน้าก่อนหน้า">${ICON.back}</button><span class="jw-spread-no"></span><button class="jr-arrow" data-spread="1" aria-label="หน้าถัดไป">${ICON.chevron}</button></div>
        <div class="jw-reader-talk"><img src="${C.assets.readerRabbit}" alt="กระต่ายนั่งหลับตายิ้ม เอียงหน้าอย่างผ่อนคลาย"><p class="jw-say jw-say-left"><b class="cr-sr">กระต่าย:</b>${esc(R.rabbit)}</p></div>
        <div class="jr-actions jr-row"><button class="jr-btn2" data-jr="replayWriting">${JR_ICON.replay}${esc(R.replay)}</button>
          <button class="jr-btn" data-jr="finish">${esc(R.next)} ${JR_ICON.check}</button></div>`;
    return `<div class="jr-screen jw-desk-screen" data-screen="${sc}">
      <div class="jw-desk">
        <img class="jw-bg" src="${D.image}" alt="สมุดบันทึกเปิดสองหน้าวางบนโต๊ะไม้ ข้างแก้วชาและแจกันดอกไม้">
        <div class="jw-map" role="document" aria-label="สมุดบันทึกของกระต่าย"></div>
        <div class="jw-top">${plainHead()}${badge(sc === "writing" ? W.title : R.title)}${sc === "writing" ? `<p class="jw-lead">${esc(W.lead)}</p>` : ""}</div>
        <div class="jw-bottom">${bottom}</div>
      </div></div>`;
  };

  const syncWriting = () => {
    const W = C.writing, pp = $('[data-jr="playPause"]', root); if (!pp) return;
    const done = S.isAnimationCompleted;
    pp.innerHTML = S.isAnimationPlaying ? `${JR_ICON.pause}<span>${esc(W.pause)}</span>` : `${JR_ICON.play}<span>${esc(W.resume)}</span>`;
    pp.disabled = done; pp.setAttribute("aria-pressed", String(!S.isAnimationPlaying && !done));
    $('[data-jr="skipAnim"]', root).disabled = done;
    $(".jw-status", root).textContent = done ? "" : S.isAnimationPlaying ? W.writingNow : W.paused;
    $(".jw-status", root).hidden = done;
    $('.jw-next-slot [data-jr="toReader"]', root).hidden = !done;
  };
  const syncSpread = (i, n) => {
    const nav = $(".jw-spread-nav", root); if (!nav) return;
    nav.hidden = n < 2; $(".jw-spread-no", root).textContent = `${i + 1} / ${n}`;
    $('[data-spread="-1"]', root).disabled = i === 0; $('[data-spread="1"]', root).disabled = i >= n - 1;
  };
  const after = {
    braindump() { canvas = BrainDumpCanvas($(".jr-canvas-wrap", root), S, () => syncDraw()); parts.push(canvas); syncDraw(); },
    writing() {
      const reduceNow = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!S.isAnimationCompleted && S.animationProgress === 0) {
        if (reduceNow) { S.animationProgress = 1e9; S.isAnimationCompleted = true; S.isAnimationPlaying = false; }   // reduced motion: show the finished journal; "เล่นซ้ำ" still plays it
        else S.isAnimationPlaying = true;
      }
      desk = RabbitJournalDesk($(".jw-desk", root), S, { mode: "write", onDone: () => { syncWriting(); $('.jw-next-slot [data-jr="toReader"]', root)?.focus({ preventScroll: true }); } });
      parts.push(desk); syncWriting();
    },
    reader() { desk = RabbitJournalDesk($(".jw-desk", root), S, { mode: "read", onSpread: syncSpread }); parts.push(desk); swipe(); },
    connections() { syncNet(); },
  };
  const swipe = () => {
    const m = $(".jw-map", root); let sx = null, sy = 0;
    m.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
    m.addEventListener("pointerup", (e) => { if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && desk) desk.goSpread(S.readerSpread + (dx < 0 ? 1 : -1)); });
    m.addEventListener("pointercancel", () => { sx = null; });
  };
  const syncDraw = () => {
    const u = $('[data-jr="undo"]', root), c = $('[data-jr="clear"]', root);
    if (u) u.disabled = !S.brainDumpStrokes.length;
    if (c) c.disabled = !jrVisible(S.brainDumpStrokes).length;
  };
  const syncNet = () => {
    const K = C.connections, sel = S.selectedConnection, rel = new Set();
    K.links.forEach(([a, b]) => { if (a === sel) rel.add(b); if (b === sel) rel.add(a); });
    $$(".jw-node", root).forEach(n => { const id = n.dataset.node; n.setAttribute("aria-pressed", String(id === sel)); n.classList.toggle("is-rel", rel.has(id)); n.classList.toggle("is-dim", !!sel && id !== sel && !rel.has(id)); n.classList.toggle("is-seen", S.visitedConnections.includes(id)); });
    $$(".jw-lines line", root).forEach(l => { const on = sel && (l.dataset.a === sel || l.dataset.b === sel); l.classList.toggle("is-on", !!on); l.classList.toggle("is-dim", !!sel && !on); });
    $(".jw-seen", root).textContent = K.seen(S.visitedConnections.length, K.elements.length);
    const box = $(".jw-detail", root), e = K.elements.find(x => x.id === sel);
    if (!e) { box.innerHTML = `<p class="jw-detail-hint">${esc(K.tapHint)}</p>`; return; }
    const entry = C.journal.entries.find(x => x.id === e.quote);
    box.innerHTML = `<h2 class="jw-detail-h">${JR_ICON[e.icon]}${esc(e.label)}</h2>
      ${entry ? `<blockquote class="jw-quote">“${esc(entry.text)}”</blockquote>` : ""}
      <p class="jw-explain">${esc(e.explain)}</p>
      <p class="jw-rel">${esc(K.related)}: ${[...rel].map(id => `<button class="jw-chip" data-node="${id}">${esc(K.elements.find(x => x.id === id).label)}</button>`).join("")}</p>`;
  };

  const sheet = (inner, label) => {
    closeSheet();
    const s = h(`<div class="cr-sheet jr-sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="cr-sheet-card">
        <button class="cr-x" data-jr="closeSheet" aria-label="ปิด">${ICON.x}</button>${inner}</div></div>`);
    root.appendChild(s); const f = s.querySelector(".cr-set-btn"); f && f.focus({ preventScroll: true });
  };
  const closeSheet = () => { const s = $(".jr-sheet", root); s && s.remove(); };

  const onClick = (e) => {
    if (e.target.classList && e.target.classList.contains("jr-sheet")) return closeSheet();
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    const a = b.dataset.jr, T = C.settings;
    if (b.dataset.tool) { S.drawingTool = b.dataset.tool; $$("[data-tool]", root).forEach(x => x.setAttribute("aria-pressed", String(x === b))); return; }
    if (b.dataset.color) { S.selectedColor = b.dataset.color; S.drawingTool = "pen"; $$("[data-color]", root).forEach(x => x.setAttribute("aria-checked", String(x === b))); $$("[data-tool]", root).forEach(x => x.setAttribute("aria-pressed", String(x.dataset.tool === "pen"))); return; }
    if (b.dataset.size) { S.brushSize = b.dataset.size; $$("[data-size]", root).forEach(x => x.setAttribute("aria-checked", String(x === b))); return; }
    if (b.dataset.spread) return desk && desk.goSpread(S.readerSpread + +b.dataset.spread);
    if (b.dataset.node) {                                   // explore in any order; nothing is right or wrong
      S.selectedConnection = b.dataset.node;
      if (!S.visitedConnections.includes(b.dataset.node)) S.visitedConnections.push(b.dataset.node);
      syncNet(); return;
    }
    switch (a) {
      case "back": { const i = C.screens.indexOf(S.currentScreen); if (S.currentScreen === "writing") S.isAnimationPlaying = false; return i ? go(C.screens[i - 1]) : api.exit(); }
      case "settings": if (desk && S.currentScreen === "writing") { desk.pause(); syncWriting(); }
        return sheet(`<h2 class="cr-set-h">${esc(T.title)}</h2>
          <button class="cr-set-btn" data-jr="restart">${esc(T.restart)}</button>
          <button class="cr-set-btn is-danger" data-jr="restartYes" hidden>${esc(T.restartConfirm)}</button>
          <p class="cr-set-note">${esc(T.note)}</p>
          <button class="cr-set-btn" data-jr="map">${esc(T.map)}</button>`, T.title);
      case "restart": b.hidden = true; { const y = $('[data-jr="restartYes"]', root); y.hidden = false; y.focus(); } return;
      case "restartYes": closeSheet(); JOURNAL_STATE = journalInitialState(); Object.assign(S, JOURNAL_STATE); JOURNAL_STATE = S; completing = false; return go("intro");
      case "map": case "skipActivity": closeSheet(); S.isAnimationPlaying = false; return api.exit();   // safe exit, not completed
      case "closeSheet": return closeSheet();
      case "start": return go("braindump");
      case "toWriting": return go("writing");
      case "undo": return canvas && canvas.undo();
      case "clear": return sheet(`<h2 class="cr-set-h">${esc(C.brainDump.clearConfirm)}</h2>
          <button class="cr-set-btn is-danger" data-jr="clearYes">ล้างภาพทั้งหมด</button><button class="cr-set-btn" data-jr="closeSheet">ยกเลิก</button>`, "ยืนยันล้างภาพ");
      case "clearYes": closeSheet(); return canvas && canvas.clear();
      case "playPause": if (!desk) return; S.isAnimationPlaying ? desk.pause() : desk.play(); return syncWriting();
      case "skipAnim": if (desk) { desk.skip(); syncWriting(); } return;
      case "replayAnim": if (desk) { desk.replay(); syncWriting(); } return;
      case "toReader": S.isAnimationPlaying = false; return go("reader");
      case "replayWriting": S.animationProgress = 0; S.isAnimationCompleted = false; S.isAnimationPlaying = true; return go("writing");
      case "finish":                                          // the only place Journaling becomes completed — once
        if (completing) return; completing = true; S.completed = true; b.disabled = true; return api.complete();
    }
  };
  const onKey = (e) => {
    const s = $(".jr-sheet", root);
    if (s && e.key === "Escape") { e.preventDefault(); return closeSheet(); }
    if (s && e.key === "Tab") {
      const f = [...s.querySelectorAll("button:not([hidden]):not([disabled])")], i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } else if (i < 0) { e.preventDefault(); f[0].focus(); }
    }
  };
  root.addEventListener("click", onClick); root.addEventListener("keydown", onKey);
  render();
  return () => { S.isAnimationPlaying = false; stop(); root.removeEventListener("click", onClick); root.removeEventListener("keydown", onKey); };
}
ActivityModules.journaling = { render: JournalActivity, fullscreen: true };

// Thai is the page language: enables Thai dictionary line-breaking and correct font selection.
if (!document.documentElement.lang) document.documentElement.lang = "th";
boot();
})();
