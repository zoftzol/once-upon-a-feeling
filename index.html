@media (prefers-reduced-motion: reduce){.sm-card.is-in,.sm-rabbit,.sm-again{animation:none!important}.sm-hold{transition:none}}
/* taste step */
.gr-taste .sm-spacer{height:96px}
/* lick1 stays solid underneath; lick2 fades in on top, so the body never turns see-through mid-way */
.tt-rabbit[data-state="idle"] img[data-f="lick2"]{opacity:var(--lick,0)}
.tt-rabbit[data-state="idle"] img[data-f="think"],.tt-rabbit[data-state="idle"] img[data-f="found"],
.tt-rabbit[data-state="thinking"] img:not([data-f="think"]),.tt-rabbit[data-state="discovery"] img:not([data-f="found"]){opacity:0}
.tt-controls{flex:none;height:132px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tt-controls [hidden]{display:none!important}
.tt-track{--p:0;--th:56px;position:relative;width:min(100%, 360px);height:var(--th);flex:none;border-radius:999px;background:#F3EAD2;cursor:grab;
  box-shadow:inset 0 0 0 2px #D8C79E, inset 0 3px 6px rgba(120,90,40,.18);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.tt-track.is-dragging{cursor:grabbing}
.tt-fill{position:absolute;left:4px;top:4px;bottom:4px;width:calc(var(--p) * (100% - var(--th) - 8px) + var(--th) - 8px);border-radius:999px;background:linear-gradient(90deg,#CFE3B3,#A9CC86)}
.tt-goal{position:absolute;right:10px;top:50%;width:34px;height:34px;transform:translateY(-50%);opacity:.75}
.tt-goal svg{width:100%;height:100%}
.tt-thumb{position:absolute;top:4px;left:calc(4px + var(--p) * (100% - var(--th)));width:calc(var(--th) - 8px);height:calc(var(--th) - 8px);border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,#FFF3D6);border:3px solid #6A9A3E;box-shadow:0 3px 0 #4D7A2A, 0 6px 10px -4px rgba(60,50,20,.45)}
.tt-thumb::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;border-right:3.5px solid #6A9A3E;border-top:3.5px solid #6A9A3E;transform:translateX(-3px) rotate(45deg);border-radius:2px}
.tt-track.is-dragging .tt-thumb{transform:scale(1.06)}
.tt-track.is-locked{cursor:default}
.tt-track.is-locked .tt-thumb{background:#F4D27A;border-color:#C9A04A;box-shadow:0 3px 0 #A8822F}
.tt-track.is-locked .tt-thumb::after{border-color:#8A6420}
.tt-track:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.tt-guide{margin:2px 0 0;font-size:.85rem;color:#6A5644;text-align:center}
.tt-step{min-height:34px;font-size:.82rem}
.gr-taste .tt-finish{margin-top:6px}
/* touch step */
.gr-scene-touch{overflow:hidden}
/* Touch 2.png is a transparent PNG: it sits straight on the activity background (no blurred scene backdrop / card shadow) */
.gr-step-touch::before{display:none}
.gr-scene-touch{box-shadow:none}
.gr-scene-touch .gr-spot.is-picked{z-index:2}
.gr-scene-touch .gr-spot.is-picked::after{content:"";position:absolute;inset:8%;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 0 0 6px rgba(244,201,96,.7);opacity:.85}
.gr-scene-touch .gr-lens,.gr-scene-touch .gr-tag{display:none}
.gr-hands{position:absolute;inset:0;z-index:6;pointer-events:none}
.gr-hand{position:absolute;transform-origin:50% 100%;transform:rotate(var(--rot))}
.gr-hand img{display:block;width:100%;height:100%;object-fit:contain;transform-origin:50% 100%;filter:drop-shadow(0 4px 4px rgba(90,60,30,.25))}
.gr-hands.is-enter .gr-hand{animation:gr-hand-in .38s cubic-bezier(.3,1.3,.5,1) both}
@keyframes gr-hand-in{from{opacity:0;transform:rotate(var(--rot)) translateY(-28px)}to{opacity:1;transform:rotate(var(--rot))}}
.gr-hands.is-rub .gr-hand img{animation:gr-rub 1.1s ease-in-out infinite;animation-delay:var(--d)}
.gr-hands.is-pat .gr-hand img{animation:gr-pat .75s ease-in-out infinite;animation-delay:var(--d)}
.gr-hands.is-press .gr-hand img{animation:gr-press 1s ease-in-out infinite;animation-delay:var(--d)}
.gr-hands.is-hold .gr-hand img{animation:gr-hold 1.6s ease-in-out infinite}
@keyframes gr-rub{0%,100%{transform:translateX(-14%) rotate(-4deg)}50%{transform:translateX(14%) rotate(4deg)}}
@keyframes gr-pat{0%,100%{transform:translateY(0)}45%{transform:translateY(-16%) rotate(-3deg)}60%{transform:translateY(0)}}
@keyframes gr-press{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(6%) scaleY(.94)}}
@keyframes gr-hold{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg) translateY(-3%)}}
.gr-feel{position:absolute;z-index:8;transform:translate(-50%,-100%);width:max-content;max-width:min(240px, 78%);display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 14px;border-radius:16px;background:#FFF8E6;color:var(--gr-ink);box-shadow:inset 0 0 0 2px #F0CF78, 0 6px 14px -6px rgba(80,60,20,.4);text-align:center;
  font-family:var(--font-display);font-weight:600;font-size:clamp(.88rem, 4cqw, 1rem);line-height:1.35;pointer-events:none}
.gr-feel b{font-size:.78rem;font-weight:700;color:#8A6A3C}
.gr-feel::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);background:#FFF8E6;box-shadow:2px 2px 0 0 #F0CF78}
.gr-feel.is-in{animation:gr-feel-in .32s cubic-bezier(.3,1.3,.5,1)}
@keyframes gr-feel-in{from{opacity:0;transform:translate(-50%,-100%) translateY(8px) scale(.9)}}
@media (prefers-reduced-motion: reduce){.gr-hand img,.gr-hands.is-enter .gr-hand,.gr-feel.is-in{animation:none!important}}
@media (prefers-reduced-motion: reduce){.gr-lens,.gr-tag{transition:none}.gr-spot.is-picked .gr-lens{transform:scale(1.12)}}

/* ---------- Activity placeholder ---------- */
.activity{background:linear-gradient(#FBEFDF, var(--cream) 40%)}
.activity-inner{display:flex;flex-direction:column;gap:18px;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px, env(safe-area-inset-right,0px)) 32px max(18px, env(safe-area-inset-left,0px))}
.activity-bar{display:flex;align-items:center;gap:12px}
.activity-bar h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1.3;color:var(--ink);text-wrap:balance}
.status-chip{align-self:flex-start;padding:2px 12px;border-radius:999px;font-size:.82rem;font-weight:600;background:#FFF;box-shadow:inset 0 0 0 1.5px #E8CBA6;color:var(--ink)}
.status-chip[data-s="completed"]{background:#E4EFCB;box-shadow:none;color:#4F6B25}
.status-chip[data-s="in_progress"]{background:#FCE3DD;box-shadow:none;color:var(--coral-deep)}
.activity-stage{display:grid;place-items:center;gap:10px;min-height:260px;padding:24px;border-radius:24px;border:2px dashed #E3C8A4;background:#FFFBF2;text-align:center}
.activity-stage img{width:96px;height:auto;opacity:.9}
.activity-stage strong{font-family:var(--font-display);font-size:1.08rem;color:var(--ink)}
.activity-stage p{margin:0;max-width:30ch;font-size:.92rem}
.dev-panel{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:#F3EEF7;border:1.5px dashed #BFAFD3;font-size:.85rem;color:#5E4C73}
.dev-panel b{font-family:var(--font-display)}
.dev-panel .chip-btn{flex:none;min-height:46px}

/* ---------- Credits ---------- */
.credits{background:linear-gradient(180deg, #D4E3C4 0%, #E9F0DF 45%, #FFF7E8 100%)}   /* sage green → light green → cream; no pink / purple */
.credits-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px))}
.credits-branch{position:absolute;top:0;left:0;width:64px;height:auto;pointer-events:none}
.cloud{position:absolute;border-radius:999px;background:#FFF7F3;opacity:.8;filter:blur(1px);pointer-events:none}
.credits-head{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 22px 14px;border-radius:40px;background:radial-gradient(ellipse at 50% 55%, rgba(255,248,236,.95) 55%, rgba(255,248,236,0) 72%)}
.book-badge{width:56px;height:auto}
.credits-head h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:2.4rem;line-height:1.1;color:var(--ink);letter-spacing:.01em}
.ribbon{position:relative;margin-top:2px;padding:3px 26px 5px;background:#F2A9A0;color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:.92rem;border-radius:4px}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:6px;width:16px;height:100%;background:#E8928A;z-index:-1}
.ribbon::before{left:-10px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.ribbon::after{right:-10px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.credits-logo{margin:12px 0 2px;width:min(88%, 300px)}
.credits-logo img{display:block;width:100%;height:auto;object-fit:contain}
.credits-title{margin:14px 0 0;font-family:var(--font-display);font-weight:700;font-size:1.65rem;line-height:1.2;color:var(--ink)}
.credits-sub{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;color:var(--ink)}
.credits-sub::before,.credits-sub::after{content:"";width:12px;height:12px;background:
  linear-gradient(var(--sun),var(--sun)) 0 0/10px 2.5px no-repeat,linear-gradient(var(--sun),var(--sun)) 0 50%/12px 2.5px no-repeat,linear-gradient(var(--sun),var(--sun)) 0 100%/10px 2.5px no-repeat}
.credits-sub::before{transform:scaleX(-1)}
.credits-lede{margin:6px 0 0;max-width:32ch;font-size:.93rem;line-height:1.6;color:var(--ink);text-wrap:balance}
.divider-heart{display:flex;align-items:center;gap:8px;width:70%;color:var(--sun)}
.divider-heart::before,.divider-heart::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--sun))}
.divider-heart::after{transform:scaleX(-1)}
.divider-heart svg{width:16px;height:16px}
.cards{display:flex;flex-direction:column;gap:14px;width:100%}
.c-card{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 14px 16px 10px;border-radius:22px;background:var(--card);
  box-shadow:inset 0 0 0 1.5px rgba(232,203,166,.6), 0 4px 10px -6px rgba(110,59,36,.25);outline:1.5px dashed rgba(220,180,140,.7);outline-offset:-7px}
.c-icon{display:grid;place-items:center;border-right:1.5px solid rgba(220,180,140,.55);padding-right:6px}
.c-icon img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(75,55,35,.18))}   /* bulb / pin / smile share one box so they balance */
.c-body{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.c-label{display:flex;align-items:center;gap:6px;padding:1px 14px;border-radius:999px;background:#F9D98A;font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--ink)}
.leaf{width:18px;height:18px;color:var(--leaf);flex:none}
.c-cap{font-size:.76rem;color:var(--ink-soft)}
.c-name{margin:2px 0;padding:2px 14px;border-radius:999px;background:var(--pink);font-family:var(--font-display);font-weight:700;font-size:1rem;color:var(--ink)}
.c-text{margin:0;font-size:.86rem;line-height:1.6;color:var(--ink)}
.pending{color:#9A6B5A;font-style:italic}
.credits-flowers{width:calc(100% + 32px);max-width:none;height:auto;aspect-ratio:284/44;margin:6px -16px 0}

/* ---------- Bottom nav ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:20;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:10px max(18px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(18px, env(safe-area-inset-left,0px));
  background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -6px 16px -10px rgba(110,59,36,.35);display:flex;justify-content:space-around;align-items:flex-start;transition:transform .3s var(--ease)}
.nav[hidden]{display:flex!important;transform:translateY(110%);pointer-events:none}
.nav-btn{position:relative;display:grid;place-items:center;width:84px;height:64px;border-radius:999px;transition:background .2s var(--ease), transform .12s}
.nav-btn img{width:56px;height:auto}
.nav-btn[aria-current="page"]{background:radial-gradient(circle, #F9CFD0 0, #F7D5D3 55%, rgba(247,213,211,.0) 72%)}
.nav-btn:active{transform:scale(.93)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .runner{animation:none!important}   /* no hopping; the runners still travel because that IS the progress */
}

/* ===== Cognitive Restructuring ===== (1 --u = 1px of the 941px-wide wireframe) */
.cr{background:#CDE596;--cr-ink:#4A2E1E;--cr-cream:#FDF2DA;--cr-line:#EBD3A2}
.cr-screen{container-type:inline-size;position:relative;min-height:100%;display:flex;flex-direction:column;background:linear-gradient(#D9EBA8,#C4DF8A 60%,#BFDB7F)}
.cr-screen{--u:calc(100cqw / 941)}
.cr-art{position:relative;flex:none}
.cr-art > img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.cr-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cr-hit{position:absolute;border-radius:24px;-webkit-tap-highlight-color:transparent;transition:transform .12s var(--ease), background .12s}
.cr-round{border-radius:50%}
.cr-hit:hover{background:rgba(255,255,255,.18)}
.cr-hit:active{transform:scale(.94);background:rgba(90,60,20,.12)}
.cr :focus-visible{outline:3px solid var(--coral);outline-offset:3px}
/* text laid into the cleared speech bubbles */
.cr-say{position:absolute;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;text-wrap:balance;
  font-family:var(--font-display);font-weight:600;font-size:max(10.5px, calc(31 * var(--u)));line-height:1.38;color:var(--cr-ink)}
/* red-orange storybook button, placed exactly over the painted one */
.cr-btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:calc(26 * var(--u));border-radius:999px;
  background:linear-gradient(#F67A6B,#E8564B 55%,#D9443B);border:calc(7 * var(--u)) solid #FFF3E2;
  box-shadow:0 calc(7 * var(--u)) 0 #B93A32, 0 calc(14 * var(--u)) calc(22 * var(--u)) rgba(120,40,20,.35), inset 0 calc(4 * var(--u)) 0 rgba(255,255,255,.35);
  color:#FFF8EE;font-family:var(--font-display);font-weight:700;font-size:max(18px, calc(66 * var(--u)));line-height:1;text-shadow:0 2px 0 rgba(150,40,30,.35);
  -webkit-tap-highlight-color:transparent;transition:transform .12s var(--ease), filter .2s}
.cr-btn svg{width:calc(58 * var(--u));height:calc(58 * var(--u));min-width:16px;min-height:16px;color:#FFF3E2;filter:drop-shadow(0 2px 0 rgba(150,40,30,.3))}
.cr-btn:active{transform:translateY(calc(5 * var(--u)))}
.cr-btn[disabled]{background:linear-gradient(#E9C6BC,#DDB3A8);box-shadow:0 calc(7 * var(--u)) 0 #C19A90;color:#FFF7F0;text-shadow:none;cursor:default}
.cr-btn[disabled] svg{opacity:.7}
.cr-footer{margin-top:auto}
/* parchment board */
.cr-panel{position:relative;margin:calc(46 * var(--u)) calc(18 * var(--u)) 0;padding:calc(64 * var(--u)) calc(26 * var(--u)) calc(30 * var(--u));
  background:var(--cr-cream);border:3px solid var(--cr-line);border-radius:calc(44 * var(--u));box-shadow:0 6px 14px -8px rgba(90,60,20,.35)}
.cr-panel-cont{margin-top:0;border-top:0;border-radius:0 0 calc(44 * var(--u)) calc(44 * var(--u));padding-top:calc(16 * var(--u));background:#FDF0D6}
.cr-badge{position:absolute;left:50%;top:0;transform:translate(-50%,-62%);padding:calc(8 * var(--u)) calc(44 * var(--u));border-radius:999px;
  background:linear-gradient(#C08250,#9A5E33);border:3px solid #E8C08E;color:#FFF6E6;white-space:nowrap;
  font-family:var(--font-display);font-weight:700;font-size:max(18px, calc(58 * var(--u)));line-height:1.25;text-shadow:0 2px 0 rgba(80,40,10,.4);box-shadow:0 4px 0 #7A4724}
.cr-h{margin:0;text-align:center;font-family:var(--font-display);font-weight:700;font-size:max(20px, calc(60 * var(--u)));line-height:1.25;color:#5A321C}
.cr-h:focus{outline:none}
.cr-inst{margin:calc(6 * var(--u)) 0 calc(22 * var(--u));text-align:center;font-family:var(--font-display);font-weight:600;font-size:max(13px, calc(31 * var(--u)));line-height:1.4;color:var(--cr-ink)}
.cr-inst-art{position:absolute;margin:0;display:flex;align-items:center;justify-content:center;text-wrap:balance;font-size:max(10.5px, calc(30 * var(--u)));line-height:1.3}
.cr-think{position:absolute;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;text-wrap:balance;
  font-family:var(--font-display);font-weight:700;font-size:max(12.5px, calc(32 * var(--u)));line-height:1.3;color:var(--cr-ink)}
/* cards */
.cr-pool{display:grid;grid-template-columns:repeat(3, 1fr);gap:calc(18 * var(--u));margin-bottom:calc(24 * var(--u))}
.cr-pool:empty{display:none}
.cr-card{--bg:#FDF3D3;--bd:#E6CF96;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:max(56px, calc(132 * var(--u)));
  padding:calc(14 * var(--u)) calc(12 * var(--u));border-radius:calc(22 * var(--u));background:var(--bg);border:2px solid var(--bd);box-shadow:0 calc(6 * var(--u)) 0 var(--bd);
  font-family:var(--font-display);font-weight:600;font-size:max(13px, calc(31 * var(--u)));line-height:1.3;color:var(--cr-ink);text-align:center;text-wrap:balance;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab;transition:transform .14s var(--ease), opacity .15s, box-shadow .15s}
.cr-card[data-tone="yellow"]{--bg:#FCF0B9;--bd:#E2C873}
.cr-card[data-tone="pink"]{--bg:#FBDDE0;--bd:#E5ABB2}
.cr-card[data-tone="cream"]{--bg:#FDF3D4;--bd:#E3CC93}
.cr-card[data-tone="lavender"]{--bg:#ECDDFB;--bd:#C3A9E4}
.cr-card:hover{transform:translateY(-2px)}
.cr-card[aria-pressed="true"]{box-shadow:0 0 0 3px #F2A93B, 0 calc(6 * var(--u)) 0 var(--bd);transform:translateY(-3px)}
.cr-card.is-lifted{opacity:.3;transform:none}
.cr-card.is-ev{--bg:#FBF1DC;--bd:#E2CC9E;justify-content:flex-start;padding-top:calc(8 * var(--u))}
.cr-card.is-ev img{width:100%;height:auto;aspect-ratio:266/110;object-fit:cover;border-radius:calc(14 * var(--u));pointer-events:none}
.cr-card.is-ev span{font-size:max(12px, calc(27 * var(--u)));line-height:1.3}
.cr-card.is-chip{min-height:0;width:100%;padding:6px 8px;font-size:max(12px, calc(27 * var(--u)));box-shadow:0 3px 0 var(--bd)}
.cr-card.is-chip.is-ev{flex-direction:row;gap:6px;justify-content:flex-start;text-align:left;padding:4px 6px}
.cr-chip-img{flex:none;width:max(30px, calc(70 * var(--u)));height:max(22px, calc(48 * var(--u)));object-fit:cover;border-radius:6px;pointer-events:none}
.cr-card.is-chip.is-ev span{font-size:max(11px, calc(24 * var(--u)))}
.cr-card.is-new{animation:cr-pop .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes cr-pop{0%{transform:scale(.86);opacity:.4}100%{transform:scale(1);opacity:1}}
.cr-card.is-off{border-style:dashed}
.cr-again{display:inline-block;margin-top:2px;padding:0 8px;border-radius:999px;background:#FFE7C2;color:#8A4B12;font-style:normal;font-size:max(10.5px, calc(22 * var(--u)));font-weight:600}
.cr-ghost{position:fixed;z-index:9999;margin:0;pointer-events:none;will-change:transform;box-shadow:0 14px 24px -8px rgba(70,40,10,.45) !important;opacity:.97}
.cr-ghost .cr-again{display:none}
/* drop zones */
.cr-zones{display:grid;gap:calc(22 * var(--u));margin-bottom:calc(22 * var(--u))}
.cr-zones-2{grid-template-columns:1fr 1fr}
.cr-zones-3{grid-template-columns:repeat(3, 1fr);gap:calc(14 * var(--u))}
.cr-zone{--zb:#D2E9FB;--zh:#BCDDF7;--zl:#7FB0DB;display:flex;flex-direction:column;border-radius:calc(30 * var(--u));background:var(--zb);border:3px solid var(--zl);
  box-shadow:0 5px 0 color-mix(in srgb, var(--zl) 70%, #000 0%);overflow:hidden;transition:transform .15s var(--ease), box-shadow .15s}
.cr-zone[data-tone="lavender"]{--zb:#EEE2FC;--zh:#DFCDF8;--zl:#B79BE0}
.cr-zone[data-tone="green"]{--zb:#E6F8D2;--zh:#D3F0B3;--zl:#93CB6A}
.cr-zone[data-tone="rose"]{--zb:#FDE4E3;--zh:#FAD1D0;--zl:#E89C9A}
.cr-zone[data-tone="grey"]{--zb:#EEEEF0;--zh:#E0E0E4;--zl:#ABABB4}
.cr-zone-hit{display:flex;align-items:center;gap:calc(12 * var(--u));padding:calc(14 * var(--u)) calc(14 * var(--u)) calc(8 * var(--u));text-align:left;background:var(--zh);-webkit-tap-highlight-color:transparent}
.cr-zones-3 .cr-zone-hit{flex-direction:column;text-align:center;gap:2px}
.cr-zone-icon{flex:none;width:max(30px, calc(80 * var(--u)));height:auto;pointer-events:none}
.cr-zones-3 .cr-zone-icon{width:max(26px, calc(62 * var(--u)))}
.cr-zone-t{display:flex;flex-direction:column;min-width:0}
.cr-zone-t b{font-family:var(--font-display);font-weight:700;font-size:max(15px, calc(46 * var(--u)));line-height:1.2;color:#3D2C4E}
.cr-zones-3 .cr-zone-t b{font-size:max(12.5px, calc(32 * var(--u)))}
.cr-zone-t small{font-family:var(--font-display);font-weight:600;font-size:max(11px, calc(24 * var(--u)));line-height:1.3;color:#5D4B5E}
.cr-zones-3 .cr-zone-t small{font-size:max(10px, calc(21 * var(--u)))}
.cr-drop{display:flex;flex-direction:column;gap:6px;min-height:max(70px, calc(150 * var(--u)));margin:calc(10 * var(--u)) calc(14 * var(--u)) calc(16 * var(--u));padding:6px;
  border:2px dashed color-mix(in srgb, var(--zl) 80%, #fff);border-radius:calc(22 * var(--u));background:rgba(255,255,255,.5);transition:background .15s}
.cr-zones-3 .cr-drop{margin:6px 6px 8px;padding:4px}
.cr-zone.is-over, .cr-zone:has(.is-over), .cr-panel.has-selection .cr-zone{box-shadow:0 0 0 3px #F4B940, 0 5px 0 var(--zl)}
.cr-zone.is-over{transform:scale(1.02);background:color-mix(in srgb, var(--zb) 70%, #fff)}
.cr-zone.is-over .cr-drop{background:rgba(255,255,255,.85)}
.cr-card.is-shake{animation:cr-shake .45s ease-in-out}
@keyframes cr-shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}
@media (prefers-reduced-motion: reduce){.cr-card.is-shake{animation:none}}
.cr-zone{cursor:default}.cr-panel.has-selection .cr-zone{cursor:pointer}
.cr-zone:has(.is-over) .cr-drop{background:rgba(255,255,255,.85)}
.cr-sort.is-dragging, .cr-panel.is-dragging{cursor:grabbing}
/* progress + guide */
.cr-progress{display:flex;align-items:center;justify-content:center;gap:10px;width:fit-content;margin:0 auto calc(16 * var(--u));padding:calc(8 * var(--u)) calc(30 * var(--u));
  border-radius:999px;background:#FFF8EA;border:2px solid #E8D1A4;font-family:var(--font-display);font-weight:600;font-size:max(13px, calc(31 * var(--u)));color:var(--cr-ink)}
.cr-progress b{padding:0 calc(16 * var(--u));border-radius:999px;background:#FBE07A;font-variant-numeric:tabular-nums}
.cr-guide{display:flex;align-items:center;gap:calc(10 * var(--u))}
.cr-guide img{flex:none;width:20%;height:auto;pointer-events:none}
.cr-feedback{flex:1;position:relative;margin:0;min-height:max(52px, calc(120 * var(--u)));display:flex;flex-direction:column;justify-content:center;padding:calc(14 * var(--u)) calc(24 * var(--u));
  border-radius:calc(40 * var(--u));background:#FFF9EE;border:2px solid #E9D5B2;font-family:var(--font-display);font-weight:600;font-size:max(12.5px, calc(28 * var(--u)));line-height:1.45;color:var(--cr-ink);text-align:center;text-wrap:pretty}
.cr-feedback::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;margin-top:-7px;background:#FFF9EE;border-left:2px solid #E9D5B2;border-bottom:2px solid #E9D5B2;transform:rotate(45deg)}
.cr-feedback small{font-size:.92em;color:#6A5644}
.cr-feedback b{color:#4E7B2C}
.cr-guide-2 img{width:22%}
.cr-progress-box{flex-direction:column;gap:2px;margin:0;padding:calc(8 * var(--u)) calc(20 * var(--u));border-radius:calc(28 * var(--u))}
/* main thought stays visible in step 2 */
.cr-sticky{position:sticky;top:0;z-index:20;height:0;overflow:visible;display:flex;justify-content:center;pointer-events:none}
.cr-sticky span{margin-top:6px;padding:6px 16px;border-radius:999px;background:#FFFFFFF2;border:2px solid #CFC7E6;box-shadow:0 4px 10px -4px rgba(60,40,80,.35);
  font-family:var(--font-display);font-weight:700;font-size:.9rem;color:var(--cr-ink);opacity:0;transform:translateY(-8px);transition:opacity .2s, transform .2s;white-space:nowrap}
.cr-sticky.is-on span{opacity:1;transform:none}
/* sheets (evidence inspector, settings) */
.cr-sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(50,35,20,.45);animation:cr-fade .2s ease}
@keyframes cr-fade{from{opacity:0}}
.cr-sheet-card{position:relative;width:min(100%, 460px);max-height:92%;overflow:auto;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:#FDF2DA;
  box-shadow:0 -8px 24px rgba(60,40,20,.3);animation:cr-up .28s var(--ease)}
@keyframes cr-up{from{transform:translateY(30px);opacity:.4}}
.cr-x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:#F5E3C3;color:#6B4A2E;display:grid;place-items:center}
.cr-x svg{width:20px;height:20px}
.cr-sheet-img{display:block;width:86%;margin:8px auto 6px;border-radius:16px}
.cr-sheet-text{margin:0 0 6px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--cr-ink)}
.cr-sheet-note{margin:0 0 12px;text-align:center;font-family:var(--font-display);font-weight:500;font-size:.92rem;line-height:1.5;color:#6A5644}
.cr-sheet-opts{display:flex;flex-direction:column;gap:8px}
.cr-opt{--zh:#E0E0E4;--zl:#ABABB4;display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 14px;border-radius:16px;background:var(--zh);border:2px solid var(--zl);
  font-family:var(--font-display);font-weight:700;font-size:1rem;color:#3D2C4E;text-align:left}
.cr-opt img{width:32px;height:auto}
.cr-opt[data-tone="green"]{--zh:#E3F6CF;--zl:#93CB6A}.cr-opt[data-tone="rose"]{--zh:#FDE2E1;--zl:#E89C9A}
.cr-opt[aria-pressed="true"]{box-shadow:0 0 0 3px #F4B940}
.cr-set-h{margin:4px 0 14px;text-align:center;font-family:var(--font-display);font-size:1.2rem;color:var(--cr-ink)}
.cr-set-btn{display:block;width:100%;min-height:50px;margin-bottom:8px;border-radius:16px;background:#FFF8EA;border:2px solid #E8D1A4;font-family:var(--font-display);font-weight:700;font-size:1rem;color:var(--cr-ink)}
.cr-set-btn.is-danger{background:#FDE2DC;border-color:#E39A8B;color:#8A2E1E}
.cr-set-note{margin:-2px 0 12px;text-align:center;font-size:.8rem;color:#7A6552}
.cr-sheet [hidden], .cr [hidden]{display:none !important}
/* Step 3 — Perspective Mirror (surface laid inside the painted golden frame) */
.cr-mirror{position:absolute;overflow:hidden;border-radius:calc(170 * var(--u)) / calc(150 * var(--u));
  background:linear-gradient(160deg,#BDE6FD 0%,#A6DCFB 40%,#CBEEFE 62%,#A9DDFA 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.6), inset 0 6px 20px rgba(40,110,170,.25);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cr-mirror::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.45) 24%,transparent 30%,transparent 60%,rgba(255,255,255,.35) 64%,transparent 68%);pointer-events:none}
.cr-tabs{position:relative;z-index:2;display:flex;justify-content:center;gap:calc(12 * var(--u));padding:calc(20 * var(--u)) calc(78 * var(--u)) 0}

/* ===== Reflective Journaling ===== */
.jr{--jr-cream:#FFF5DF;--jr-peach:#F5D8B5;--jr-orange:#F59A49;--jr-coral:#F27C60;--jr-sage:#A8C79A;--jr-ink:#65442F;--jr-paper:#FFFCF4;
  background:radial-gradient(120% 40% at 0% 0%, #CFE3A6 0, transparent 60%), radial-gradient(120% 40% at 100% 0%, #C9E09C 0, transparent 60%),
             radial-gradient(90% 30% at 50% 100%, #D7E8B4 0, transparent 70%), var(--jr-cream)}
.jr [hidden]{display:none !important}
.jr button{touch-action:manipulation}   /* no double-tap-zoom delay on tool buttons */
.jr :focus-visible{outline:3px solid var(--jr-coral);outline-offset:3px}
.jr-screen{position:relative;min-height:100%;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.jr-head{position:relative}
.jr-head > img{display:block;width:100%;height:auto}
.jr-hit{position:absolute;border-radius:50%;-webkit-tap-highlight-color:transparent;transition:transform .12s, background .12s}
.jr-hit:hover{background:rgba(255,255,255,.18)}.jr-hit:active{transform:scale(.92)}
.jr-dots{display:flex;justify-content:center;gap:7px;margin:8px 0 0;padding:0;list-style:none}
.jr-dots li{width:9px;height:9px;border-radius:50%;border:1.5px solid #D8B48A;background:#FFFCF4}
.jr-dots li.is-done{background:#F5C99A}.jr-dots li.is-now{background:var(--jr-orange);border-color:#D67A2C;width:22px;border-radius:999px}
.jr-body{display:flex;flex-direction:column;gap:12px;padding:10px 16px 0}
.jr-badge{display:flex;align-items:center;gap:10px;align-self:center;margin:2px 0 0;padding:5px 22px 5px 6px;border-radius:999px;background:#F9E6C6;border:2px solid #E8C99A;
  font-family:var(--font-display);font-weight:700;font-size:1.35rem;color:var(--jr-ink);box-shadow:0 3px 0 #E2C190}
.jr-badge:focus{outline:none}
.jr-no{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#9A6A45;color:#FFF5E6;font-size:1.15rem}
.jr-inst{margin:0;text-align:center;font-family:var(--font-display);font-weight:600;font-size:.98rem;line-height:1.5;color:var(--jr-ink);text-wrap:balance}
.jr-card{padding:14px 16px;border-radius:20px;background:var(--jr-paper);border:2px solid #EBD3AE;box-shadow:0 4px 10px -6px rgba(101,68,47,.35)}
.jr-lead{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:.98rem;line-height:1.55;color:var(--jr-ink);text-align:center}
.jr-lead:last-child{margin:0}
.jr-h2{margin:0 0 8px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:1.1rem;color:var(--jr-ink)}
.jr-keys{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.jr-keys li{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--jr-ink)}
.jr-keys svg{flex:none;width:22px;height:22px}
.jr-privacy{margin:0;padding:10px 14px;border-radius:14px;background:#EEF5E4;border:1.5px dashed #A8C79A;font-size:.85rem;line-height:1.55;color:#4C5E3A;text-align:center}
.jr-disclaimer{background:#FFF0E2;border-color:#E9B58A;color:#7A4A28}
/* buttons */
.jr-actions{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:2px}
.jr-actions.jr-row{flex-direction:row;justify-content:center}
.jr-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:230px;min-height:54px;padding:8px 26px;border-radius:999px;
  background:linear-gradient(#F9AE62,var(--jr-orange) 55%,#EC8235);border:3px solid #FFF3E2;color:#FFF;font-family:var(--font-display);font-weight:700;font-size:1.18rem;
  text-shadow:0 1px 0 rgba(160,80,20,.35);box-shadow:0 4px 0 #C9692A, 0 10px 18px -8px rgba(150,80,30,.5);transition:transform .12s;-webkit-tap-highlight-color:transparent}
.jr-row .jr-btn{min-width:0;flex:1.25}
.jr-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C9692A}
.jr-btn svg{width:22px;height:22px}
.jr-btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:6px 20px;border-radius:999px;background:var(--jr-paper);border:2px solid #D9B791;
  color:var(--jr-ink);font-family:var(--font-display);font-weight:700;font-size:1rem;box-shadow:0 3px 0 #E2C59E;-webkit-tap-highlight-color:transparent}
.jr-row .jr-btn2{flex:1;white-space:nowrap;padding:6px 12px;font-size:.95rem}
.jr-btn2 svg{width:20px;height:20px}
.jr-btn2:active{transform:translateY(2px)}
.jr button[disabled]{opacity:.45;cursor:default}
/* intro */
.jr-intro-h{margin:0;display:flex;flex-direction:column;align-items:center}
.jr-intro-h:focus{outline:none}
.jr-intro-h img{width:min(78%, 320px);height:auto}
.jr-intro-h span{margin-top:-6px;font-family:var(--font-display);font-weight:600;font-size:.95rem;color:#8A6A4E}
.jr-scene{position:relative;display:flex;flex-direction:column;align-items:center}
.jr-scene-img{display:block;width:min(86%, 340px);height:auto;animation:jr-float 4s ease-in-out infinite}
@keyframes jr-float{50%{transform:translateY(-3px)}}
.jr-say{position:relative;margin:0 0 -6px;z-index:1;max-width:92%;padding:12px 18px;border-radius:26px;background:#FFFDF7;border:2px solid #E3CBA6;box-shadow:0 4px 10px -6px rgba(101,68,47,.4);
  font-family:var(--font-display);font-weight:600;font-size:.98rem;line-height:1.55;color:var(--jr-ink);text-align:center;text-wrap:balance}
.jr-say::after{content:"";position:absolute;bottom:-9px;right:24%;width:16px;height:16px;background:#FFFDF7;border-right:2px solid #E3CBA6;border-bottom:2px solid #E3CBA6;transform:rotate(45deg)}
/* writing editor */
.jr-paper{position:relative;padding:12px 12px 26px;border-radius:18px;background:var(--jr-paper);border:2px dashed #D9B791;box-shadow:0 4px 10px -6px rgba(101,68,47,.35)}
.jr-paper::before{content:"";position:absolute;right:18px;top:-10px;width:34px;height:22px;background:#F3C76D;opacity:.85;transform:rotate(8deg);border-radius:3px}
.jr-chosen{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 6px 6px 10px;border-radius:12px;background:#FFF1DC;border:1.5px solid #EBC99A;
  font-family:var(--font-display);font-weight:700;font-size:.98rem;color:var(--jr-ink)}
.jr-chosen-ic svg{display:block;width:24px;height:24px}
.jr-chosen-t{flex:1}
.jr-x{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#F5E3C3;color:#7A5638}
.jr-x svg{width:16px;height:16px}
#jr-text{display:block;width:100%;min-height:210px;max-height:46vh;resize:vertical;padding:6px 8px;border:0;border-radius:10px;
  background:repeating-linear-gradient(transparent 0 31px, #EADCC6 31px 32px);background-attachment:local;line-height:32px;
  font-family:"IBM Plex Sans Thai Looped","Noto Sans Thai","Sarabun",sans-serif;font-size:1rem;color:#3E2A1C;outline:none}
#jr-text:focus-visible{box-shadow:0 0 0 3px #F6C08A}
#jr-text::placeholder{color:#B49A80}
.jr-count{position:absolute;right:14px;bottom:6px;font-size:.8rem;font-variant-numeric:tabular-nums;color:#9A7B5E}
.jr-plead{display:flex;align-items:center;gap:6px;margin:2px 0 0;font-family:var(--font-display);font-weight:600;font-size:.88rem;color:#6E5440}
.jr-plead svg{flex:none;width:24px;height:24px}
.jr-prompts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jr-prompt{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 10px;border-radius:16px;background:var(--jr-paper);border:2px solid #EBD3AE;text-align:left;
  font-family:var(--font-display);font-weight:600;font-size:.88rem;line-height:1.3;color:var(--jr-ink);box-shadow:0 3px 0 #EAD6B6}
.jr-prompt svg{flex:none;width:26px;height:26px}
.jr-prompt[aria-pressed="true"]{background:#FFF0D8;border-color:var(--jr-orange);box-shadow:0 0 0 2px #F9C58C, 0 3px 0 #E7B67E}
/* drawing */
.jr-canvas-wrap{padding:8px;border-radius:18px;background:#F7EBD5;border:2px solid #E3CBA6;box-shadow:0 4px 10px -6px rgba(101,68,47,.35)}
.jr-canvas{display:block;width:100%;aspect-ratio:1000/1100;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--jr-paper);touch-action:none;cursor:crosshair;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.jr-tools{display:grid;grid-template-columns:repeat(4, 1fr);gap:8px}
.jr-tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:14px;background:var(--jr-paper);border:2px solid #E3CBA6;
  font-family:var(--font-display);font-weight:600;font-size:.78rem;color:var(--jr-ink)}
.jr-tool svg{width:24px;height:24px}
.jr-tool[aria-pressed="true"]{background:#FDE9B7;border-color:#E6B34A;box-shadow:0 0 0 2px #F6D27F}
.jr-colors{display:flex;justify-content:space-between;gap:4px;padding:8px 10px;border-radius:999px;background:var(--jr-paper);border:2px solid #EBD3AE}
.jr-color{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid #FFF;box-shadow:0 0 0 1.5px rgba(101,68,47,.25)}
.jr-color[aria-checked="true"]{box-shadow:0 0 0 3px var(--jr-ink);transform:scale(1.08)}
.jr-sizes{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--jr-paper);border:2px solid #EBD3AE;font-family:var(--font-display);font-weight:600;font-size:.85rem;color:var(--jr-ink)}
.jr-sizes span{margin-right:auto}
.jr-size{display:grid;place-items:center;width:46px;height:40px;border-radius:12px}
.jr-size i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:#5B3A29}
.jr-size[aria-checked="true"]{background:#E5F1D5;box-shadow:inset 0 0 0 2px #8DBA6A}
/* notebook */
.jr-book{position:relative;box-sizing:border-box;margin:4px auto 0;width:min(100%, 380px);padding:14px 14px 14px 30px;border-radius:12px 18px 18px 12px;
  background:linear-gradient(90deg,#C98B5E,#B97A4F);box-shadow:0 8px 18px -8px rgba(80,45,20,.55)}
.jr-rings{position:absolute;left:8px;top:22px;bottom:22px;width:22px;z-index:3;
  background:radial-gradient(circle at 50% 50%, #FFF8EA 0 4px, #8C5A36 4.5px 6px, transparent 6.5px) 0 0/22px 30px repeat-y}
.jr-pages{position:relative;aspect-ratio:3/4;max-height:62vh;perspective:1400px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.jr-page{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 16px 12px 18px;border-radius:4px 10px 10px 4px;background:var(--jr-paper);
  box-shadow:inset 8px 0 10px -8px rgba(101,68,47,.35), 0 1px 0 #E9D9BE;transform-origin:0 50%;backface-visibility:hidden;overflow:hidden}
.jr-probe{visibility:hidden;pointer-events:none}
.jr-phead{flex:none;display:inline-flex;align-self:flex-start;margin-bottom:6px;padding:2px 12px;border-radius:999px;background:#FDE6EA;border:1.5px solid #EDB3BD;
  font-family:var(--font-display);font-weight:700;font-size:.9rem;color:#8A3F4E}
.jr-page[data-kind^="draw"] .jr-phead{background:#E5F1D5;border-color:#A8C79A;color:#3F6328}
.jr-ptext{flex:1 1 0;min-height:0;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;line-break:auto;
  background:repeating-linear-gradient(transparent 0 29px, #EADCC6 29px 30px);line-height:30px;
  font-family:"IBM Plex Sans Thai Looped","Noto Sans Thai","Sarabun",sans-serif;font-size:1rem;color:#3E2A1C}
.jr-pfoot{flex:none;align-self:flex-end;font-size:.75rem;color:#A08568}
.jr-pdraw{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#FFFEFA;border:1.5px solid #EFE2CC}
.jr-pdraw img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.jr-pempty{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:var(--font-display);font-weight:600;font-size:.95rem;line-height:1.6;color:#B0957A;
  background:repeating-linear-gradient(transparent 0 29px, #F1E6D4 29px 30px)}
.jr-page.is-turning-out{animation:jr-turn-out .5s cubic-bezier(.45,.05,.4,1) forwards;z-index:2}
.jr-page.is-turning-in{animation:jr-turn-in .5s cubic-bezier(.45,.05,.4,1) both;z-index:2}
@keyframes jr-turn-out{0%{transform:rotateY(0);box-shadow:0 0 0 rgba(0,0,0,0)}100%{transform:rotateY(-100deg);box-shadow:-20px 0 30px rgba(80,45,20,.25)}}
@keyframes jr-turn-in{0%{transform:rotateY(-100deg)}100%{transform:rotateY(0)}}
.jr-deco{position:absolute;z-index:4;pointer-events:none}
.jr-deco-tape{right:28px;top:4px;width:40px;height:20px;background:#F3C76D;opacity:.8;transform:rotate(-8deg);border-radius:3px}
.jr-deco-flower{right:6px;bottom:2px;font-size:28px;color:#F49AA8;text-shadow:0 1px 0 #C76C7C}
.jr-book-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px}
.jr-arrow{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--jr-paper);border:2px solid #D9B791;color:var(--jr-ink);box-shadow:0 3px 0 #E2C59E}
.jr-arrow svg{width:22px;height:22px}
.jr-pageno{min-width:56px;text-align:center;font-family:var(--font-display);font-weight:700;color:var(--jr-ink);font-variant-numeric:tabular-nums}
/* reflection */
.jr-reflect{display:flex;flex-direction:column;gap:6px}
.jr-qbtn{width:100%;min-height:46px;padding:6px 12px;border-radius:14px;background:#FFF8EC;border:1.5px solid #EBD3AE;text-align:left;font-family:var(--font-display);font-weight:600;font-size:.93rem;color:var(--jr-ink)}
.jr-qbtn::before{content:"🔍 ";}
.jr-qbtn[aria-expanded="true"]{background:#FFF0D8;border-color:var(--jr-orange)}
.jr-qhint{margin:4px 6px 2px;font-size:.85rem;color:#7A6552}
.jr-spirit-row{display:flex;align-items:center;gap:6px}
.jr-say-left{flex:1;margin:0}
.jr-say-left::after{right:-9px;bottom:auto;top:50%;margin-top:-8px;transform:rotate(-45deg)}
.jr-spirit{flex:none;width:26%;max-width:110px;height:auto;animation:jr-float 3.4s ease-in-out infinite}
.jr-scene-done .jr-scene-img{width:min(80%, 320px)}
@media (prefers-reduced-motion: reduce){.jr-scene-img,.jr-spirit{animation:none}.jr-page.is-turning-out,.jr-page.is-turning-in{animation:none}}

/* ===== Reflective Journaling · Final (Brain Dump + Rabbit Journal) — builds on the .jr base styles ===== */
.jw .jw-badge{padding:5px 24px}
.jw-intro-h{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.jw-intro-h:focus{outline:none}
.jw-sign{padding:8px 26px;border-radius:18px;background:linear-gradient(#FBEBCB,#F3D7A6);border:3px solid #D9AE76;box-shadow:0 4px 0 #C99A5E;
  font-family:var(--font-display);font-weight:700;font-size:1.6rem;line-height:1.25;color:#6B3A22;text-align:center}
.jw-sub{font-family:var(--font-display);font-weight:600;font-size:.92rem;color:#8A6A4E}
.jw-scene{display:block;width:min(100%, 380px);height:auto;aspect-ratio:906/408;object-fit:contain;margin:0 auto;animation:jr-float 4s ease-in-out infinite}   /* rabbit (Card_6) fits the old scene box */
.jw-say{position:relative;margin:0;padding:12px 16px;border-radius:24px;background:#FFFDF7;border:2px solid #E3CBA6;box-shadow:0 4px 10px -6px rgba(101,68,47,.4);
  font-family:var(--font-display);font-weight:600;font-size:.96rem;line-height:1.55;color:var(--jr-ink);text-align:center;text-wrap:balance}
.jw-say-rabbit::after{content:"";position:absolute;top:-9px;left:30%;width:16px;height:16px;background:#FFFDF7;border-left:2px solid #E3CBA6;border-top:2px solid #E3CBA6;transform:rotate(45deg)}
.jw-spirit-row{display:flex;align-items:center;gap:6px}
.jw-spirit{flex:none;width:22%;max-width:90px;height:auto;animation:jr-float 3.4s ease-in-out infinite}
.jw-say-spirit{flex:1}
.jw-intro-lead{text-align:left;text-wrap:pretty;line-height:1.6}   /* one intro paragraph, no speech tail; wraps to the phone width */
.jw-intro-lead::after{display:none}
.jw-say-spirit::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;width:16px;height:16px;background:#FFFDF7;border-left:2px solid #E3CBA6;border-bottom:2px solid #E3CBA6;transform:rotate(45deg)}
.jw-say-left::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-8px;width:16px;height:16px;background:#FFFDF7;border-right:2px solid #E3CBA6;border-top:2px solid #E3CBA6;transform:rotate(45deg)}
.jw-paper{background:#F4E4C6}
.jw-bullets{margin:4px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px;font-family:var(--font-display);font-weight:600;font-size:.93rem;line-height:1.5;color:var(--jr-ink)}
/* desk screens (rabbit writes / reads): the supplied notebook picture fills the screen behind the bars */
.jr-screen.jw-desk-screen{height:100%;min-height:0;padding:0}
.jw-desk{position:relative;height:100%;overflow:hidden;background:#F8F3E8}   /* plain warm cream page */
.jw-bg{position:absolute;max-width:none;z-index:0;user-select:none;-webkit-user-drag:none}
.jw-map{position:absolute;z-index:1;touch-action:pan-y}
.jw-top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:8px;
  background:linear-gradient(rgba(255,245,223,.0) 60%, rgba(255,245,223,0))}
.jw-top .jr-head{align-self:stretch}
.jw-lead{margin:0 14px;padding:6px 14px;border-radius:14px;background:rgba(255,250,238,.9);font-family:var(--font-display);font-weight:600;font-size:.86rem;line-height:1.45;color:var(--jr-ink);text-align:center;text-wrap:balance}
.jw-bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(248,243,232,0), rgba(248,243,232,.94) 26px)}
.jw-bottom .jr-actions{margin:0}
.jw-plainbar{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px, env(safe-area-inset-right,0px)) 0 max(14px, env(safe-area-inset-left,0px))}
.jw-plainbar .jr-dots{margin:0}
.jw{background:#F8F3E8}                                  /* plain warm cream behind every Journaling screen */
.jw .jr-screen > .jw-plainbar{padding-bottom:4px}
.jw-progress{--pmr-dot:#F1D9B4;--pmr-dot-done:#F59A49;flex:1;min-width:0;margin-left:10px;background:#FFFCF4;box-shadow:inset 0 0 0 1.5px #EAD5B5, 0 2px 6px rgba(90,60,30,.1)}
.jw-progress .pp-dot.is-now{box-shadow:0 0 0 3px rgba(245,154,73,.28)}
.jw-progress .pp-num{color:#9A5A26}
.jw-icon{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;background:#FFFCF4;color:#6B4A2E;box-shadow:inset 0 0 0 2px #E2C8A2, 0 2px 5px rgba(90,60,30,.16);transition:transform .12s}
.jw-icon svg{width:23px;height:23px}
.jw-icon:active{transform:scale(.92)}
.jw-bottom .jr-row .jr-btn{min-width:0;font-size:.98rem;padding:6px 12px;white-space:nowrap}
.jw-bottom .jr-row .jr-btn2{font-size:.9rem;padding:6px 10px;white-space:nowrap}
@media (max-width: 374px){.jw-bottom .jr-row .jr-btn{font-size:.86rem;padding:6px 8px}.jw-bottom .jr-row .jr-btn2{font-size:.8rem;padding:6px 8px}.jw-bottom .jr-row .jr-btn2 svg{display:none}}
/* notebook text: real HTML on the picture's page regions */
.jw-spread{position:absolute;inset:0;visibility:hidden}
.jw-spread.is-current{visibility:visible}
.jw-page{position:absolute;overflow:hidden;font-family:var(--font-display);font-size:var(--fs);line-height:1.5;color:#65442F;overflow-wrap:anywhere}
.jw-entry{margin:0 0 .5em}
.jw-eh{margin:0;font-size:1.06em;font-weight:700;line-height:1.35;color:#A0482A}
.jw-et{margin:0;font-weight:500}
.is-write .g{visibility:hidden}
.is-write .g.on{visibility:visible}
.jw-spread:not(.is-current) .g{visibility:hidden !important}
/* ONE right paw + pencil, moved together as one group whose origin is the pencil tip */
.jw-hand{position:absolute;left:0;top:0;z-index:4;pointer-events:none;will-change:transform;filter:drop-shadow(2px 5px 4px rgba(90,55,25,.28))}
.jw-hand img{position:absolute;max-width:none;height:auto;user-select:none}
.jw-hand .jw-paw{transform-origin:20% 15%;transition:transform .2s}
.jw-hand.is-writing .jw-paw{transform:rotate(-1.5deg)}
.jw-ctrl{display:flex;justify-content:center;gap:8px}

/* =========================================================
   2. PROGRESS STORE  (localStorage, versioned, no personal answers stored)
   ========================================================= */
// v2 = 6 activities + stickers. v1 (7 activities incl. I-Statement) is migrated once, keeping the player's progress.
const STORE_KEY = "onceUponAFeeling.progress.v2";
const LEGACY_KEYS = ["onceUponAFeeling.progress.v1"];
const STORY_STATES = ["not_started", "in_progress", "skipped", "completed"];
const ACT_STATES = ["locked", "available", "in_progress", "completed"];

function defaults() {
  const activities = {};
  ACTIVITY_ORDER.forEach(id => activities[id] = "available");
  const tarot = {};
  ACTIVITY_ORDER.forEach(id => tarot[id] = { unlocked: false, unlockedAt: null });
  return { version: 2, storyStatus: "not_started", activities, completedAt: {}, tarot, finalCelebrationSeen: false };
}
// Keeps only the 6 current activities; anything else (e.g. iStatement from v1) is dropped.
function normalize(raw) {
  const d = defaults();
  if (STORY_STATES.includes(raw.storyStatus)) d.storyStatus = raw.storyStatus;
  ACTIVITY_ORDER.forEach(id => {
    const s = raw.activities?.[id];
    const v = typeof s === "object" && s ? s.status : s;      // accept {status} objects too
    if (ACT_STATES.includes(v)) d.activities[id] = v;
    if (d.activities[id] === "completed" && raw.completedAt?.[id]) d.completedAt[id] = raw.completedAt[id];
    // A tarot card is owned once unlocked; activities completed before cards existed get theirs too.
    const t = raw.tarot?.[id];
    if (t?.unlocked === true || d.activities[id] === "completed")
      d.tarot[id] = { unlocked: true, unlockedAt: t?.unlockedAt || d.completedAt[id] || null };
  });
  d.finalCelebrationSeen = raw.finalCelebrationSeen === true;
  return d;
}
const Store = {
  state: defaults(),
  load() {
    try {
      let raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null"), migrated = false;
      if (!raw) for (const k of LEGACY_KEYS) {
        raw = JSON.parse(localStorage.getItem(k) || "null");
        if (raw) { migrated = true; break; }
      }
      if (raw && typeof raw === "object") {
        this.state = normalize(raw);
        if (migrated) this.save();   // legacy key is left untouched as a backup
      }
    } catch (e) { /* storage unavailable: keep in-memory defaults */ }
  },
  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.state)); } catch (e) {} },
  setStory(s) {
    // never downgrade a finished story back to skipped/in-progress
    if (this.state.storyStatus === "completed" && s !== "completed") return;
    this.state.storyStatus = s; this.save();
  },
  // Access state (sequential progression, derived — the saved completion data stays the only source of truth):
  //   completed → "completed" (always kept, even if earned out of order under the old free-selection rules)
  //   first activity, or previous one completed → its saved "available" / "in_progress"
  //   otherwise → "locked"
  activity(id) {
    const s = this.state.activities[id];
    if (s === "completed") return "completed";
    const i = ACTIVITY_ORDER.indexOf(id);
    if (i > 0 && this.state.activities[ACTIVITY_ORDER[i - 1]] !== "completed") return "locked";
    return s === "locked" ? "available" : s;
  },
  setActivity(id, s) {
    if (this.state.activities[id] === "completed" && s !== "completed") return; // completion is permanent
    this.state.activities[id] = s;
    if (s === "completed") {
      const now = new Date().toISOString();
      this.state.completedAt[id] = this.state.completedAt[id] || now;
      // completion is the ONLY place a tarot card is unlocked (never on preview / Play / opening an activity)
      if (!this.state.tarot[id].unlocked) this.state.tarot[id] = { unlocked: true, unlockedAt: now };
    }
    this.save();
  },
  tarotUnlocked(id) { return !!this.state.tarot[id]?.unlocked; },
  tarotCount() { return ACTIVITY_ORDER.filter(id => this.state.tarot[id]?.unlocked).length; },
  completedCount() { return ACTIVITY_ORDER.filter(id => this.state.activities[id] === "completed").length; },  // = collected stickers
  // all six completed AND all six tarot cards unlocked (any order)
  allCompleted() { return ACTIVITY_ORDER.every(id => this.state.activities[id] === "completed" && this.state.tarot[id]?.unlocked === true); },
  markFinalCelebrationSeen() { this.state.finalCelebrationSeen = true; this.save(); },
  reset() { this.state = defaults(); this.save(); },
};

// Smooth dashed route through the sticker centres (Catmull-Rom → cubic Bézier), ending at the finish flag.
function mapPath() {
  const p = [...ACTIVITIES.map(a => a.slot), MAP_FINISH];
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2, t = 6;
    d += ` C${(p1.x + (p2.x - p0.x) / t).toFixed(1)},${(p1.y + (p2.y - p0.y) / t).toFixed(1)} ${(p2.x - (p3.x - p1.x) / t).toFixed(1)},${(p2.y - (p3.y - p1.y) / t).toFixed(1)} ${p2.x},${p2.y}`;
  }
  return d;
}

  map() {
    const done = Store.completedCount();

      // completed: "ผ่านกิจกรรมนี้แล้ว" popup (ดูสรุป → tarot summary, เล่นอีกครั้ง → straight back into the activity; rewards kept)
      if (status === "completed") return CompletedActivityPopup.open(id, { opener: b, scrollHost: el, onReplay: () => Router.go("activity-" + ACTIVITIES.find(x => x.id === id).slug) });

      StickerEntryPopup.open(id, { opener: b, scrollHost: el });

    let toastTimer = 0;
    const showToast = (msg) => {
      const t = $(".map-toast", el); t.textContent = msg; t.classList.add("is-on");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("is-on"), 2200);
    };
    let rewardTimer = 0;
    return {
      el, nav: "map",
      onShow() {
        // the journey starts at the top; a just-completed sticker is brought into view
        const vm = $(".vmap", el), n1 = $(".vnode", el);

        const freshSlot = fresh && $(`.slot[data-id="${fresh}"]`, el);

        // Just completed an activity → after the sticker animation, present its newly unlocked tarot card.

        const celebrate = () => {
          if (!document.contains(el) || TarotLayer.isOpen || !Store.allCompleted() || Store.state.finalCelebrationSeen) return;
          FinalCelebration.open({ opener: $(".map-tarot-ico", el), scrollHost: el, first: true });
        };
        if (fresh && Store.tarotUnlocked(fresh)) {
          const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
          rewardTimer = setTimeout(() => TarotLayer.openCard(fresh, { isNew: true, opener: $(`.slot[data-id="${fresh}"]`, el), scrollHost: el, onClosed: celebrate }), reduce ? 150 : 1100);
        } else if (Store.allCompleted() && !Store.state.finalCelebrationSeen) {
          rewardTimer = setTimeout(celebrate, 600);   // e.g. the page was closed while the last card was showing
        }
      },
      onHide() { clearTimeout(rewardTimer); clearTimeout(toastTimer); },
    };
  },

    el.addEventListener("click", (e) => {

/* =========================================================
   5b. ACTIVITY PREVIEW MODAL  — reusable, data-driven (ACTIVITY_PREVIEWS)
       update({ activityId, isOpen, onClose, onStart, opener, scrollHost, restoreFocus })
       Opening/closing never touches progress; only onStart navigates.
   ========================================================= */
const ActivityPreviewModal = {
  root: null, props: {}, isOpen: false, timer: 0,
  update(next) {
    const props = Object.assign({}, this.props, next);
    this.props = props;
    if (props.isOpen && !this.isOpen) this._open(props);
    else if (!props.isOpen && this.isOpen) this._close(props.restoreFocus !== false);
    this.props.restoreFocus = undefined;
  },
  _content(id) {
    const a = ACTIVITIES.find(x => x.id === id);
    const p = ACTIVITY_PREVIEWS[id];
    const title = (p && p.title) || a.name;
    const playIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5v11l9-5.5z" fill="#fff"/></svg>';
    if (p && p.image) {
      const hit = p.play
        ? `<button class="play-hit" data-start style="left:${p.play.x}%;top:${p.play.y}%;width:${p.play.d}%" aria-label="เริ่มกิจกรรม ${esc(title)}"></button>`
        : `<button class="play-btn" data-start aria-label="เริ่มกิจกรรม ${esc(title)}">${playIcon}</button>`;
      return { title, framed: !!p.framed, html: `
        <div class="preview-art"><img src="${p.image}" width="${p.w}" height="${p.h}" style="aspect-ratio:${p.w}/${p.h}"
          alt="การ์ตูนแนะนำเทคนิค ${esc(title)}: กระต่ายและผู้ช่วยเรืองแสงอธิบายวิธีรับมือกับความโกรธ">${hit}</div>` };
    }
    // No comic supplied for this activity: placeholder + real Play button
    return { title, framed: false, html: `
      <div class="preview-pending"><strong>${esc(title)}</strong><span>รอภาพ Comic Preview ของกิจกรรมนี้</span>
        <button class="play-btn" data-start aria-label="เริ่มกิจกรรม ${esc(title)}">${playIcon}</button></div>` };
  },
  _open(props) {
    clearTimeout(this.timer);
    const c = this._content(props.activityId);
    this.root.innerHTML = `
      <div class="preview-scrim" data-dismiss></div>
      <div class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title" tabindex="-1">
        <h2 class="sr-only" id="preview-title">ตัวอย่างกิจกรรม ${esc(c.title)}</h2>
        <div class="preview-body ${c.framed ? "is-framed" : ""}">${c.html}</div>
        <button class="preview-close" data-dismiss aria-label="ปิดหน้าต่างตัวอย่างกิจกรรม">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
      </div>`;
    this.isOpen = true;
    this.root.hidden = false;
    $("#stage").inert = true; $("#nav").inert = true;          // focus can't leave the dialog
    if (props.scrollHost) props.scrollHost.classList.add("is-locked"); // keeps scrollTop, blocks scrolling
    requestAnimationFrame(() => requestAnimationFrame(() => this.root.classList.add("is-open")));
    $(".preview-dialog", this.root).focus({ preventScroll: true });
  },
  _close(restoreFocus) {
    const { opener, scrollHost } = this.props;
    this.isOpen = false;
    this.root.classList.remove("is-open");
    $("#stage").inert = false; $("#nav").inert = false;
    if (scrollHost) scrollHost.classList.remove("is-locked");
    if (restoreFocus && opener && document.contains(opener)) opener.focus({ preventScroll: true });
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.timer = setTimeout(() => { this.root.hidden = true; this.root.innerHTML = ""; }, reduce ? 0 : 220);
  },
  init() {
    this.root = $("#preview");
    this.root.addEventListener("click", (e) => {
      if (e.target.closest("[data-start]")) { const b = e.target.closest("[data-start]"); b.classList.add("is-pressed"); return this.props.onStart && this.props.onStart(this.props.activityId); }
      if (e.target.closest("[data-dismiss]")) return this.props.onClose && this.props.onClose();
    });
    document.addEventListener("keydown", (e) => {
      if (!this.isOpen) return;
      if (e.key === "Escape") { e.preventDefault(); this.props.onClose && this.props.onClose(); return; }
      if (e.key === "Tab") { // focus trap (backup for browsers without inert)
        const f = [...this.root.querySelectorAll("button")];
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
      }
    });
  },
};

/* =========================================================
   5c. TAROT CARDS
   TarotCard(cardId)          → a two-sided card with side-dependent corner controls (flip / close)
   TarotLayer.openCard(id)    → TarotRewardModal: one card, front first; isNew = just unlocked
   TarotLayer.openCollection()→ all 6 slots; locked ones show only "???" (no card art, no back)
   Flip state is view-only: every opening starts on the Front side.
   ========================================================= */
// Controls follow the visible side:
//   Front → top-right: Flip ("พลิกไพ่เพื่อดูคำอธิบาย") only — no close button on the front.
//   Back  → top-left: Flip back ("พลิกกลับไปด้านหน้า"), top-right: X ("ปิดไพ่").
// Flip direction: Front → Back turns left-to-right (rotateY 0 → 180deg); Back → Front visibly reverses it,
// right-to-left (180deg → 0). Controls swap at the half-way point; re-flips are locked mid-animation.
const FLIP_MS = 600;
const TAROT_COLLECTION_TEXT = {
  title: "คอลเลกชันไพ่ทาโรต์",
  subtitle: "ไพ่ที่ได้รับจากการเรียนรู้ทั้ง 6 เทคนิค",
  reset: "ล้างข้อมูล",
  confirmTitle: "แน่ใจหรือไม่ว่าต้องการล้างข้อมูล?",
  confirmText: "ข้อมูลการเล่นทั้งหมดที่ผ่านมา รวมถึงความคืบหน้าของกิจกรรม สติก\u2060เกอร์ และไพ่ทาโรต์ที่สะสมไว้จะถูกลบ และไม่สามารถกู้คืน\u2060ได้",   // \u2060 = keeps the word together when the line wraps
  cancel: "ยกเลิก",
  confirm: "ล้างข้อมูล",
};
function TarotCard(cardId, { onFlip, onClose } = {}) {
  const c = TAROT_CARDS[cardId];
  const el = h(`
    <div class="tarot-viewer" data-side="front">
      <div class="tarot-card" style="aspect-ratio:${c.front.w}/${c.front.h}" aria-describedby="tarot-side-${cardId}">
        <div class="tarot-inner">
          <div class="tarot-face tarot-front"><img src="${c.front.src}" width="${c.front.w}" height="${c.front.h}" alt="${esc(c.front.alt)}"></div>
          <div class="tarot-face tarot-back${c.back.html ? " has-text" : ""}"><img src="${c.back.src}" width="${c.back.w}" height="${c.back.h}" alt="${esc(c.back.alt)}">${c.back.html ? `<div class="tb-text" lang="th" style="--tb-top:${c.back.top || 19.6}%">${c.back.html}</div>` : ""}</div>
        </div>
        <span class="tarot-glow" aria-hidden="true"></span>
      </div>
      <div class="tarot-ctrls"></div>
    </div>`);
  const card = $(".tarot-card", el), inner = $(".tarot-inner", el), ctrls = $(".tarot-ctrls", el);
  const front = $(".tarot-front", el), back = $(".tarot-back", el);
  let flipped = false, busy = false;
  const renderControls = () => {
    ctrls.innerHTML = flipped
      ? `<button class="tarot-ctl tarot-flip-left" data-ctl="flip" aria-label="พลิกกลับไปด้านหน้า"><img src="assets/ui/flip-green-round.webp" width="160" height="160" alt="" draggable="false"></button>
         <button class="tarot-ctl tarot-close-right" data-ctl="close" aria-label="ปิดไพ่"><img src="assets/ui/close-red-round.webp" width="160" height="160" alt="" draggable="false"></button>`
      : `<button class="tarot-ctl tarot-flip-right" data-ctl="flip" aria-label="พลิกไพ่เพื่อดูคำอธิบาย"><img src="assets/ui/flip-green-round.webp" width="160" height="160" alt="" draggable="false"></button>`;
  };
  const setFaces = () => {   // only the visible side is exposed to assistive tech
    front.setAttribute("aria-hidden", String(flipped)); back.setAttribute("aria-hidden", String(!flipped));
    el.dataset.side = flipped ? "back" : "front";
  };
  const flip = () => {
    if (busy) return;                                  // ignore rapid repeat taps mid-flip
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    busy = true; flipped = !flipped;
    inner.style.transform = flipped ? "rotateY(180deg)" : "rotateY(0deg)";    // open: 0 → 180 (L→R) · return: 180 → 0 (R→L)
    card.classList.remove("is-flipping", "to-back", "to-front"); void card.offsetWidth;
    card.classList.add("is-flipping", flipped ? "to-back" : "to-front");
    ctrls.classList.add("is-swapping");
    const hadFocus = el.contains(document.activeElement);
    setTimeout(() => {                                 // half-way: card is edge-on, swap the controls
      setFaces(); renderControls(); ctrls.classList.remove("is-swapping");
      if (hadFocus) $("[data-ctl=flip]", ctrls).focus({ preventScroll: true });   // never land on X by accident
      if (flipped && tbText) fitText();
      onFlip && onFlip(flipped);
    }, reduce ? 0 : FLIP_MS / 2);
    setTimeout(() => { busy = false; }, reduce ? 0 : FLIP_MS);
  };
  ctrls.addEventListener("click", (e) => {
    const b = e.target.closest("[data-ctl]"); if (!b) return;
    if (b.dataset.ctl === "flip") flip();
    if (b.dataset.ctl === "close" && !busy) onClose && onClose();
  });
  card.addEventListener("click", (e) => {             // tapping the artwork flips too (pointer convenience) —
    if (e.target.closest(".tb-text")) return;         // …but never while reading / selecting the HTML summary text
    const sel = window.getSelection && String(window.getSelection()); if (sel) return;
    flip();
  });
  // HTML back text: shrink the font step by step until all 4 sections fit inside the frame (no scrolling inside the card)
  const tbText = $(".tb-text", el);
  const fitText = () => {
    if (!tbText || !tbText.clientHeight) return;
    const w = card.offsetWidth;                       // layout width (ignores the dialog's scale-in transform)
    if (!w) return;
    let fs = Math.max(8.5, Math.min(15, w * 0.042));  // start ≈ 4.2% of the card width (8.5–15px)
    tbText.style.fontSize = fs + "px";
    while (tbText.scrollHeight > tbText.clientHeight + 1 && fs > 8.5) { fs -= 0.25; tbText.style.fontSize = fs + "px"; }
  };
  if (tbText) {
    const ro = new ResizeObserver(fitText); ro.observe(card);
    document.fonts && document.fonts.ready.then(fitText);
  }
  setFaces(); renderControls();                       // every viewer opens on the Front
  return el;
}

const TarotLayer = {
  root: null, stack: [], timer: 0,
  get isOpen() { return this.stack.length > 0; },
  init() {
    this.root = $("#tarot");
    this.root.addEventListener("click", (e) => {
      if (e.target.closest("[data-tarot-close]")) return this.close();
      if (e.target.closest("[data-fc-credits]")) {                    // final celebration → existing Credits page
        while (this.isOpen) this.close({ restoreFocus: false });
        return Router.go("credits");
      }
      if (e.target.closest("[data-fc-done]")) {                       // celebration → back to the map (closes any stacked dialogs)
        const o = this.stack[0] && this.stack[0].opener;
        while (this.isOpen) this.close({ restoreFocus: false });
        if (o && document.contains(o)) o.focus({ preventScroll: true });
        return;
      }
      if (e.target.closest("[data-fc-replay]")) return FinalCelebration.open({ opener: e.target.closest("[data-fc-replay]") });
      if (e.target.closest("[data-tarot-reset]")) return this.openResetConfirm({ opener: e.target.closest("[data-tarot-reset]") });
      if (e.target.closest("[data-reset-confirm]")) return this.resetProgress();
      const tile = e.target.closest("[data-tarot-open]");
      if (tile) return this.openCard(tile.dataset.tarotOpen, { opener: tile });
    });
    document.addEventListener("keydown", (e) => {
      if (!this.isOpen) return;
      if (e.key === "Escape") { e.preventDefault(); this.close(); return; }
      if (e.key === "Tab") {             // focus trap within the top-most dialog
        const top = this.stack[this.stack.length - 1].el;
        const f = [...top.querySelectorAll("button:not([disabled])")];
        if (!f.length) return;
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
      }
    });
  },
  _push(el, opts) {
    clearTimeout(this.timer);
    if (!this.isOpen) {
      this.root.hidden = false;
      $("#stage").inert = true; $("#nav").inert = true; $("#preview").inert = true;
      if (opts.scrollHost) opts.scrollHost.classList.add("is-locked");
      requestAnimationFrame(() => requestAnimationFrame(() => this.root.classList.add("is-open")));
    } else {
      this.stack[this.stack.length - 1].el.inert = true;
    }
    const noNav = !!(opts.noNav || (this.stack[0] && this.stack[0].noNav));   // screens without the bottom bar (Welcome) use the full height
    if (noNav) el.classList.add("no-nav");
    this.root.appendChild(el);
    this.stack.push({ el, opener: opts.opener, scrollHost: opts.scrollHost || (this.stack[0] && this.stack[0].scrollHost), onClosed: opts.onClosed, noNav });
    requestAnimationFrame(() => el.classList.add("is-in"));
    const first = el.querySelector("[data-autofocus]") || el.querySelector(".tarot-ctl") || el.querySelector(".tarot-tile[data-tarot-open]") || el.querySelector("button[data-tarot-close]");
    (first || el).focus({ preventScroll: true });
  },
  openCard(cardId, opts = {}) {
    if (!TAROT_CARDS[cardId] || !Store.tarotUnlocked(cardId)) return;   // locked cards can never be viewed
    const c = TAROT_CARDS[cardId];
    const hint = (flipped) => flipped ? "ด้านหลัง: คำอธิบายเทคนิค" : "ด้านหน้า · กดปุ่มพลิกเพื่อดูคำอธิบาย";
    const el = h(`
      <div class="tarot-dialog ${opts.isNew ? "is-new" : ""}" role="dialog" aria-modal="true" aria-label="ไพ่ทาโรต์ ${esc(c.roman)} ${esc(c.title)}">
        <div class="tarot-scrim" data-tarot-close></div>
        <div class="tarot-stage">
          <div class="tarot-holder"></div>
          <p class="tarot-hint" id="tarot-side-${cardId}">${opts.isNew ? '<b>ได้รับไพ่ใหม่!</b> ' : ""}<span>${hint(false)}</span></p>
        </div>
      </div>`);
    const card = TarotCard(cardId, { onFlip: (f) => { $(".tarot-hint span", el).textContent = hint(f); }, onClose: () => this.close() });
    $(".tarot-holder", el).append(card);
    this._push(el, opts);
    if (opts.isNew) $("#announcer").textContent = `ได้รับไพ่ทาโรต์ ${c.roman} ${c.title} แล้ว กดปุ่มพลิกเพื่อดูคำอธิบาย`;
  },
  openCollection(opts = {}) {
    const tiles = ACTIVITY_ORDER.map(id => {
      const c = TAROT_CARDS[id], a = ACTIVITIES.find(x => x.id === id);
      return Store.tarotUnlocked(id)
        ? `<button class="tarot-tile" data-tarot-open="${id}" aria-label="ดูไพ่ ${c.roman} ${esc(c.title)}"><img src="${c.front.src}" width="${c.front.w}" height="${c.front.h}" alt=""></button>`
        : `<div class="tarot-tile is-locked" role="img" aria-label="ไพ่ ${c.roman} ยังไม่ปลดล็อก — ทำกิจกรรม ${esc(a.name)} ให้สำเร็จเพื่อรับไพ่">
             <span class="tl-roman">${c.roman}</span>${ICON.lock}<span class="tl-q">???</span></div>`;
    }).join("");
    const n = Store.tarotCount();
    const el = h(`
      <div class="tarot-dialog" role="dialog" aria-modal="true" aria-labelledby="tarot-col-title">
        <div class="tarot-scrim" data-tarot-close></div>
        <div class="tarot-stage">
          <section class="tarot-collection">
            <header class="tc-head">
              <h2 id="tarot-col-title">${esc(TAROT_COLLECTION_TEXT.title)}</h2>
              <button class="icon-btn tc-close" data-tarot-close aria-label="ปิดคอลเลกชันไพ่ทาโรต์">${ICON.close}</button>
            </header>
            <p class="tc-sub">${esc(TAROT_COLLECTION_TEXT.subtitle)}</p>
            <p class="tc-progress">สะสมแล้ว ${n} / ${TOTAL_STICKERS} ใบ</p>
            <p class="tc-tap">${n ? "แตะไพ่เพื่อเปิดดูและพลิกอ่านสรุปเทคนิค" : "ทำกิจกรรมบนแผนที่ให้สำเร็จเพื่อรับไพ่ใบแรก"}</p>
            <div class="tc-grid">${tiles}</div>
            ${Store.allCompleted() ? `<button class="fc-replay" data-fc-replay>✨ ${esc(FINAL_CELEBRATION.replay)}</button>` : ""}
            <button class="tc-reset" data-tarot-reset aria-haspopup="dialog">${esc(TAROT_COLLECTION_TEXT.reset)}</button>
          </section>
        </div>
      </div>`);
    this._push(el, { noNav: $("#nav").hidden, ...opts });
  },
  // Reset Progress (moved here from the old hamburger menu): needs an explicit confirmation, then reuses Store.reset()
  openResetConfirm(opts = {}) {
    const T = TAROT_COLLECTION_TEXT;
    const el = h(`
      <div class="tarot-dialog" role="alertdialog" aria-modal="true" aria-labelledby="tcr-title" aria-describedby="tcr-desc">
        <div class="tarot-scrim" data-tarot-close></div>
        <div class="tarot-stage">
          <section class="tcr-box">
            <h2 id="tcr-title">${esc(T.confirmTitle)}</h2>
            <p id="tcr-desc">${esc(T.confirmText)}</p>
            <div class="confirm-row tcr-row"><button type="button" class="tcr-cancel" data-tarot-close data-autofocus>${esc(T.cancel)}</button><button type="button" class="tcr-ok" data-reset-confirm>${esc(T.confirm)}</button></div>
          </section>
        </div>
      </div>`);
    this._push(el, opts);
  },
  resetProgress() {
    if (this._resetting) return;                          // ignore repeated clicks while the reset is running
    this._resetting = true;
    this.root.querySelectorAll("[data-reset-confirm]").forEach(b => b.disabled = true);
    // Store.reset() = activities, stickers, tarot cards, story status and final-celebration flag back to defaults.
    // The Welcome first-visit flag (VISIT_KEY) and other settings in browser storage are left alone.
    Store.reset();
    this.closeAll();
    Router.go("map");                                     // back to the Activity Map in its initial state (re-rendered if already there)
    $("#announcer").textContent = "ล้างข้อมูลแล้ว";
    setTimeout(() => { this._resetting = false; const b = Router.current && $(".tarot-btn", Router.current.el); b && b.focus({ preventScroll: true }); }, 450);
  },
  close({ restoreFocus = true } = {}) {
    const top = this.stack.pop(); if (!top) return;
    top.el.classList.remove("is-in");
    const done = () => top.el.remove();
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (this.stack.length) {
      setTimeout(done, reduce ? 0 : 220);
      const under = this.stack[this.stack.length - 1].el; under.inert = false;
    } else {
      this.root.classList.remove("is-open");
      $("#stage").inert = false; $("#nav").inert = false; $("#preview").inert = false;
      if (top.scrollHost) top.scrollHost.classList.remove("is-locked");
      this.timer = setTimeout(() => { done(); this.root.hidden = true; }, reduce ? 0 : 240);
    }
    if (restoreFocus && top.opener && document.contains(top.opener)) top.opener.focus({ preventScroll: true });
    if (top.onClosed) setTimeout(top.onClosed, reduce ? 0 : 280);
  },
  closeAll() {
    if (!this.isOpen) return;
    this.stack.forEach(s => s.el.remove()); const host = this.stack[0].scrollHost; this.stack = [];
    this.root.classList.remove("is-open"); this.root.hidden = true;
    $("#stage").inert = false; $("#nav").inert = false; $("#preview").inert = false;
    if (host) host.classList.remove("is-locked");
  },
};

      if (!el.isConnected) return;
      el.classList.add("is-transformed", "is-ready"); play.disabled = false;
      if (el.contains(document.activeElement)) play.focus({ preventScroll: true });
    };
    if (!reduce) {
      this.timers.push(setTimeout(() => el.isConnected && el.classList.add("is-shake"), T.shake));
      this.timers.push(setTimeout(() => el.isConnected && el.classList.add("is-transformed"), T.transform));
      this.timers.push(setTimeout(ready, T.ready));
    }
    play.addEventListener("click", () => {
      if (play.disabled) return;
      play.disabled = true; play.classList.add("is-pressed");
      this.clear();
      Router.go("activity-" + a.slug);   // the activity screen marks in_progress (never completed); Router closes this popup

/* =========================================================
   7. ROUTER  (hash-based so refresh / back button work)
   ========================================================= */
const Router = {
  current: null, busy: false, flash: {},
  resolve(name) {
    if (name.startsWith("activity-")) {
      const a = ACTIVITIES.find(x => "activity-" + x.slug === name);
      return a ? () => Screens.activity(a) : null;
    }
    return Screens[name] && name !== "activity" ? Screens[name] : null;
  },
  go(name) {
    if ((location.hash.slice(1) || "welcome") === name) { this.show(name); return; }
    location.hash = name; // hashchange → show()
  },
  show(name) {
    const make = this.resolve(name) || Screens.welcome;
    if (this.busy) return;
    if (ActivityPreviewModal.isOpen) ActivityPreviewModal.update({ isOpen: false, restoreFocus: false });
    TarotLayer.closeAll();
    this.busy = true;
    const stage = $("#stage"), old = this.current;
    const next = make();
    next.el.classList.add("is-entering");
    stage.appendChild(next.el);
    Nav.set(next.nav);
    if (old) { old.el.classList.add("is-leaving"); old.onHide && old.onHide(); }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      next.el.classList.remove("is-entering");
      next.onShow && next.onShow();
      const h1 = next.el.querySelector("h1"); h1 && h1.setAttribute("tabindex", "-1");
    }));
    setTimeout(() => { old && old.el.remove(); this.busy = false; }, old ? 340 : 0);
    this.current = next;
  },
  init() {
    window.addEventListener("hashchange", () => this.show(location.hash.slice(1) || "welcome"));
  },
};

const Nav = {
  el: null,
  set(active) {
    this.el.hidden = !active;
    this.el.querySelectorAll(".nav-btn").forEach(b => b.dataset.go === active ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  },
  init() {
    this.el = $("#nav");
    this.el.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b && b.getAttribute("aria-current") !== "page") Router.go(b.dataset.go); });
  },
};

/* =========================================================
   8. BOOT  — splash + 7 s rabbit-and-turtle loading bar, then one fade to the first screen
   ========================================================= */
function preload(srcs) {
  return Promise.all(srcs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; i.decode && i.decode().then(res, res); })));
}
// Loading duration. window.__ANGER_SPLASH_MS is a testing hook only (set before the page script runs).
const SPLASH_MS = typeof window.__ANGER_SPLASH_MS === "number" ? window.__ANGER_SPLASH_MS : 7000;   // 7 s
const SPLASH_MAX_EXTRA_WAIT_MS = 3000;    // after 100%: wait briefly for critical art (normally already loaded), never hang on a slow/dead request
const CRITICAL_ASSETS = ["assets/story2/scroll-arrow.webp", "assets/story2/story-01.webp", "assets/ui/close-coral.webp", "assets/ui/play-gold.webp", "assets/welcome2/title-v3.webp", "assets/cover2/rabbit-run-v3.webp", "assets/cover2/turtle-run-v3.webp", "assets/welcome2/title.webp", "assets/welcome2/rabbit-v3.webp", "assets/welcome2/turtle-v3.webp", "assets/map-bg.webp", "assets/icon-book.webp", "assets/icon-map.webp", "assets/icon-chest.webp"];

const SplashLoader = {
  raf: 0, t0: 0, last: -1, done: null,
  // Linear progress driven by elapsed time (not by frame count), so re-renders, tab throttling or
  // repeated calls can never add another 7 s. Resolves exactly once when progress reaches 100%.
  start() {
    if (this.done) return this.done;            // already running: reuse the same timeline
    const bar = $(".loader"), runners = $(".loader-runners"), trail = $(".loader-trail"), track = $(".loader-track");
    this.t0 = performance.now();
    this.done = new Promise((resolve) => {
      const tick = (now) => {
        const p = Math.min(1, (now - this.t0) / SPLASH_MS);
        const travel = Math.max(0, track.clientWidth - runners.offsetWidth);
        runners.style.transform = `translateX(${(p * travel).toFixed(1)}px)`;
        trail.style.width = `calc(${(p * 100).toFixed(2)}% - ${(p * 6).toFixed(2)}px)`;   // solid fill, 0 → 100% of the track
        const pct = Math.floor(p * 100);
        if (pct !== this.last) { this.last = pct; bar.setAttribute("aria-valuenow", pct); }
        if (p < 1) this.raf = requestAnimationFrame(tick); else { this.raf = 0; resolve(); }
      };
      this.raf = requestAnimationFrame(tick);
    });
    return this.done;
  },
  stop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; },   // cleanup when the splash goes away
};

let booted = false, leftSplash = false;
async function boot() {
  if (booted) return; booted = true;
  // Reset only the startup navigation state: drop any saved #route so a refresh can't skip Welcome. Progress is untouched.
  if (location.hash && location.hash !== "#welcome") { try { history.replaceState(null, "", location.pathname + location.search + "#welcome"); } catch (e) {} }
  Store.load(); Menu.init(); Nav.init(); ActivityPreviewModal.init(); TarotLayer.init(); Router.init();
  const splash = $("#splash");
  const assetsReady = preload(CRITICAL_ASSETS);   // starts loading now, in parallel with the 7 s bar
  await SplashLoader.start();                       // 0 → 100% over SPLASH_MS (linear)
  await Promise.race([assetsReady, new Promise(r => setTimeout(r, SPLASH_MAX_EXTRA_WAIT_MS))]);
  if (leftSplash) return; leftSplash = true;        // navigate exactly once
  SplashLoader.stop();
  Router.show("welcome");                           // every launch/refresh starts at Welcome (never resume the last page)
  splash.classList.add("is-done");                  // fade (0.6 s) into the first screen
  setTimeout(() => splash.remove(), 700);
}

            <span class="pp-track"><span class="pp-fill" style="width:${stepIdx / (n - 1) * 100}%"></span>${dots}</span>

  const setupFit = () => {
    const stage = $(".pmr-stage", root), fig = $(".pmr-fig", root), s = PMR_STEPS[stepIdx];
