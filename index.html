<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Once Upon a Feeling</title>
<meta name="description" content="กาลครั้งหนึ่งของความรู้สึก — นิทานแบบมีปฏิสัมพันธ์เพื่อเรียนรู้การรับมือกับความโกรธ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: one centred mobile "page" (max 430px) holding screens that fade in/out; desktop shows it as a preview card.
   Single deliberate storybook look (light only) — every colour is explicit. */
:root{
  color-scheme: light;
  --cream:#FEF6E1;        /* bottom nav, welcome card */
  --card:#FEF0DC;         /* credits cards */
  --paper:#FFFDF8;        /* story reading surface */
  --ink:#6E3B24;          /* storybook title brown */
  --ink-soft:#8B533F;     /* body text brown */
  --coral:#E36D59;        /* primary action */
  --coral-deep:#C9564A;
  --peach:#F6D6B4;        /* heading pill */
  --pink:#F7D2D0;         /* active nav / name pill */
  --leaf:#7E9F4C;
  --leaf-soft:#E5DE9C;    /* "6 เทคนิค" highlight */
  --sun:#F2B93B;          /* sparkle marks */
  --sky:#E6F3FC;
  --backdrop:#E9E2CF;     /* desktop surround */
  --font-display:"Mali", "IBM Plex Sans Thai Looped", "Noto Sans Thai", "Sarabun", "Leelawadee UI", "Thonburi", "Tahoma", sans-serif;
  --font-body:"IBM Plex Sans Thai Looped", "Noto Sans Thai", "Sarabun", "Leelawadee UI", "Thonburi", "Tahoma", sans-serif;
  --nav-h:84px;
  --ease: cubic-bezier(.4,.1,.2,1);
}
html,body{height:100%}
body{background:var(--backdrop);color:var(--ink-soft);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:12px}
img{display:block;max-width:100%}

/* ---------- App shell ---------- */
/* Design reference: 1080 × 1920 (9:16 portrait). Phones use their full dynamic height; nothing is forced to that pixel size. */
.app{position:relative;width:100%;max-width:430px;height:100%;height:100dvh;margin:0 auto;overflow:hidden;overflow:clip;background:var(--paper);isolation:isolate}
@media (min-width:600px){
  body{display:grid;place-items:center;background:
    radial-gradient(circle at 20% 15%, #F3E7C9 0, transparent 45%),
    radial-gradient(circle at 85% 80%, #DCE6C4 0, transparent 40%), var(--backdrop)}
  /* tablets / desktop: show the app in a 9:16 frame that always fits the window */
  .app{width:min(430px, calc((100dvh - 48px) * 9 / 16));height:auto;aspect-ratio:9/16;max-height:calc(100dvh - 48px);border-radius:32px;box-shadow:0 30px 60px -20px rgba(110,59,36,.35), 0 0 0 10px #FFFDF8, 0 0 0 11px rgba(110,59,36,.12)}
}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;opacity:1;transition:opacity .32s var(--ease)}
.view.is-leaving,.view.is-entering{opacity:0}
.view.with-nav{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}

/* ---------- Splash ---------- */
.splash{position:absolute;inset:0;z-index:50;background:#FFF6E8;transition:opacity .6s var(--ease)}   /* one solid cream = the loading track's base colour */
/* loading bar: smooth solid track; a coral "liquid" fill grows 0 → 100% over 7 s (SPLASH_MS) while the running rabbit & walking turtle move along it */
.loader{position:absolute;left:50%;top:50%;width:min(78%, 320px);height:66px;transform:translate(-50%,-50%)}
.loader-track{position:absolute;left:0;right:0;bottom:0;height:20px;border-radius:999px;background:#FFF6E8;
  box-shadow:inset 0 0 0 2px #F3BFB6, inset 0 2px 3px rgba(110,59,36,.08);overflow:hidden}
.loader-trail{position:absolute;left:3px;top:3px;bottom:3px;width:0;border-radius:999px;background:#EE8E7E;overflow:hidden}
.loader-trail::after{content:"";position:absolute;inset:0;border-radius:inherit;   /* gentle flowing sheen inside the solid fill */
  background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.28) 18%, rgba(255,255,255,0) 36%) 0 0/120px 100% repeat-x;
  animation:liquid-flow 1.6s linear infinite}
@keyframes liquid-flow{to{background-position:120px 0}}
.loader-runners{position:absolute;left:0;bottom:16px;display:flex;align-items:flex-end;gap:2px;will-change:transform}
.runner{display:block;height:auto;filter:drop-shadow(0 2px 2px rgba(110,59,36,.25))}
.runner-rabbit{width:62px;transform-origin:60% 100%;animation:rabbit-hop .46s ease-in-out infinite}            /* running rabbit: light bounding stride */
.runner-turtle{width:52px;margin-left:2px;margin-bottom:1px;transform-origin:50% 100%;animation:turtle-waddle .62s ease-in-out infinite}   /* walking turtle: slow sway */
@keyframes rabbit-hop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes turtle-waddle{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-1.5px)}}
@media (prefers-reduced-motion: reduce){.loader-trail::after,.runner-rabbit,.runner-turtle{animation:none}}
.splash.is-done{opacity:0;pointer-events:none}

/* ---------- Shared bits ---------- */
.btn-primary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:58px;padding:10px 28px;border-radius:999px;
  background:linear-gradient(#EA7A66,var(--coral) 55%,var(--coral-deep));color:#FFF8F0;font-family:var(--font-display);font-weight:700;font-size:1.3rem;letter-spacing:.01em;
  box-shadow:0 5px 0 #B9493E, 0 10px 18px -6px rgba(185,73,62,.55), inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s var(--ease), box-shadow .12s var(--ease)}
.btn-primary:active,.btn-primary.is-pressed{transform:translateY(4px);box-shadow:0 1px 0 #B9493E, 0 4px 10px -6px rgba(185,73,62,.55), inset 0 2px 0 rgba(255,255,255,.35)}
.btn-primary[disabled]{opacity:.7;cursor:default}
.btn-primary svg{width:20px;height:20px;flex:none}
.sparks{position:relative}
.sparks::before,.sparks::after{content:"";position:absolute;top:-14px;width:22px;height:16px;background:
  linear-gradient(var(--sun),var(--sun)) 50% 0/3px 9px no-repeat,
  linear-gradient(var(--sun),var(--sun)) 0 70%/3px 8px no-repeat,
  linear-gradient(var(--sun),var(--sun)) 100% 70%/3px 8px no-repeat;border-radius:2px}
.sparks::before{left:-4px;transform:rotate(-30deg)}
.sparks::after{right:-4px;transform:rotate(30deg)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Welcome ---------- */
.welcome{background:var(--cream)}
.welcome-hero{position:relative;background:#EAD9E8}
.welcome-hero img{width:100%;height:auto;aspect-ratio:329/391}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(254,246,225,.92);box-shadow:0 2px 6px rgba(110,59,36,.18);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.welcome .menu-btn{position:absolute;top:max(10px, env(safe-area-inset-top,0px));right:max(12px, env(safe-area-inset-right,0px));z-index:2}
.welcome-card{position:relative;margin-top:-34px;padding:30px max(22px, env(safe-area-inset-right,0px)) 8px max(22px, env(safe-area-inset-left,0px));
  background:var(--cream);border-radius:50% 50% 0 0 / 34px 34px 0 0;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.welcome-heading{position:relative;margin:0;padding:10px 22px;border-radius:26px;background:radial-gradient(ellipse at 50% 40%,#FBE3C3,var(--peach) 80%);
  font-family:var(--font-display);font-weight:700;font-size:1.22rem;line-height:1.45;color:var(--ink);text-wrap:balance}
.welcome-heading::before,.welcome-heading::after{content:"";position:absolute;top:50%;width:18px;height:22px;transform:translateY(-50%);background:
  linear-gradient(var(--sun),var(--sun)) 0 0/12px 3px no-repeat,linear-gradient(var(--sun),var(--sun)) 0 50%/16px 3px no-repeat,linear-gradient(var(--sun),var(--sun)) 0 100%/12px 3px no-repeat}
.welcome-heading::before{left:-24px;transform:translateY(-50%) scaleX(-1)}
.welcome-heading::after{right:-24px}
.welcome-text{margin:0;max-width:34ch;font-size:.98rem;line-height:1.75;color:var(--ink-soft)}
.hl{display:inline-block;padding:0 8px;border-radius:999px;background:var(--leaf-soft);color:var(--ink);font-weight:600}
.welcome .sparks{width:min(100%, 300px);margin-top:10px}
.grass{width:100%;height:auto;aspect-ratio:323/35;margin-top:4px}

/* ---------- Menu drawer ---------- */
.menu{position:absolute;inset:0;z-index:40;visibility:hidden}
.menu.is-open{visibility:visible}
.menu-scrim{position:absolute;inset:0;background:rgba(80,45,30,.32);opacity:0;transition:opacity .25s var(--ease)}
.menu.is-open .menu-scrim{opacity:1}
.menu-panel{position:absolute;top:0;right:0;bottom:0;width:min(82%, 320px);background:var(--cream);border-radius:28px 0 0 28px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateX(100%);transition:transform .3s var(--ease);display:flex;flex-direction:column;gap:6px;box-shadow:-10px 0 30px -10px rgba(110,59,36,.35);overflow-y:auto}
.menu.is-open .menu-panel{transform:none}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.menu-title{font-family:var(--font-display);font-weight:700;font-size:1.25rem;color:var(--ink)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 12px;border-radius:16px;text-align:left;font-family:var(--font-display);font-weight:600;font-size:1.05rem;color:var(--ink);transition:background .15s}
.menu-item:hover,.menu-item:active{background:var(--pink)}
.menu-item img{width:40px;height:auto}
.menu-item[aria-disabled="true"]{opacity:.45;cursor:not-allowed;background:none}
.menu-item small{display:block;font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--ink-soft)}
.menu-progress{margin:14px 4px 4px;padding:12px 14px;border-radius:16px;background:#FFF9EC;border:1.5px dashed #E8CBA6;font-size:.9rem}
.menu-progress strong{font-family:var(--font-display);color:var(--ink)}
.menu-reset{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px}
.link-btn{align-self:flex-start;padding:8px 6px;font-size:.88rem;color:var(--coral-deep);text-decoration:underline;text-underline-offset:3px}
.confirm{padding:12px;border-radius:14px;background:#FCE6E1;font-size:.88rem;display:flex;flex-direction:column;gap:10px}
.confirm-row{display:flex;gap:8px}
.chip-btn{flex:1;min-height:42px;border-radius:999px;font-family:var(--font-display);font-weight:600;background:#FFF8F0;color:var(--ink);box-shadow:inset 0 0 0 1.5px #E8CBA6}
.chip-btn.danger{background:var(--coral);color:#FFF8F0;box-shadow:none}

/* ---------- Story ---------- */
.story{background:#FFFFFF}
.story.is-revisit{background:#FDF7E7}
.story-top{position:sticky;top:0;z-index:3;height:0}
.skip-btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px, env(safe-area-inset-right,0px));min-width:84px;min-height:46px;padding:6px 20px;border-radius:999px;
  background:var(--coral);color:#fff;font-family:var(--font-display);font-weight:700;font-size:1.15rem;box-shadow:0 4px 12px -4px rgba(185,73,62,.6);transition:transform .12s}
.skip-btn:active{transform:scale(.94)}
.story-foliage{width:100%;height:auto;aspect-ratio:294/47}
.panels{display:flex;flex-direction:column;gap:clamp(28px, 9vw, 44px);width:min(100% - 16px, 520px);margin:0 auto;padding-top:clamp(24px, 7vw, 36px)}   /* clear, even breathing space between comic pages */
.story.is-revisit .panels{padding-top:6px}
/* full PDF page images; multiply lets their white paper melt into the white/ivory reader background */
.panel{display:block;width:100%;height:auto;mix-blend-mode:multiply}
.story-cover{display:block;width:100%;height:auto}   /* (previous single-image cover; no longer rendered) */
/* Story cover v2: supplied logo + running rabbit & turtle on the Map/Welcome gradient, live-text Thai title */
.cover2{position:relative;box-sizing:border-box;height:100%;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px, 2.2cqh, 24px);
  padding:calc(min(70px, 11cqh) + env(safe-area-inset-top,0px)) clamp(16px, 5vw, 36px) calc(clamp(16px, 4cqh, 48px) + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg, #ECA59A 0%, #F5C4AE 45%, #FFF7E8 100%);overflow:hidden}   /* muted coral pink → peach → cream (cover only) */
.cover2 img{display:block;max-width:100%;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
.cv2-logo{margin:0 0 clamp(4px, 1.4cqh, 14px);width:min(80cqw, 400px, 30cqh * 1.634)}   /* logo ≈ 80% of the content width */   /* ≈ +12% */   /* sized from the screen height too, so the whole cover fits one screen */
.cv2-logo img{width:100%}
.cv2-pair{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px, 3vw, 18px);width:min(100%, 460px, 34.5cqh / .653)}   /* rabbit/turtle ≈ +12%, turtle stays ½ of rabbit */
.cv2-rabbit{width:42%;transform-origin:50% 90%;animation:cv2-rabbit .8s ease-in-out infinite}
.cv2-turtle{width:30.4%;margin-bottom:0;transform-origin:50% 95%;animation:cv2-turtle 1.35s ease-in-out infinite}
@keyframes cv2-rabbit{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes cv2-turtle{0%,100%{transform:translateY(0) rotate(1.5deg)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
.cover2.is-paused .cv2-rabbit,.cover2.is-paused .cv2-turtle{animation-play-state:paused}
.cv2-title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.34rem, 6.4vw, 1.9rem);line-height:1.3;color:#6B3A22;text-align:center;
  text-shadow:0 2px 0 rgba(255,250,240,.9)}
/* scroll-down hint: supplied double arrow, gentle downward bob; tapping it smooth-scrolls to page 1 */
.cv2-hint{display:flex;flex-direction:column;align-items:center;gap:clamp(12px, 2.4cqh, 20px);margin-top:clamp(0px, 1cqh, 10px);padding:4px 16px 2px;background:none;border:0;border-radius:16px;-webkit-tap-highlight-color:transparent}
.cv2-hint img{width:auto;height:clamp(30px, 6.2cqh, 50px);animation:cv2-arrow 1.5s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(150,80,50,.18))}
.cv2-hint span{font-family:var(--font-display);font-weight:600;font-size:clamp(.82rem, 3.6vw, .95rem);color:#8A5A3C;letter-spacing:.01em}
.cv2-hint:focus-visible{outline:2px solid rgba(138,90,60,.55);outline-offset:2px}
@keyframes cv2-arrow{0%,100%{transform:translateY(-2px);opacity:.75}50%{transform:translateY(7px);opacity:1}}
.cover2.is-paused .cv2-hint img{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.cv2-rabbit,.cv2-turtle,.cv2-hint img{animation:none}}
.story-end{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 24px 30px;text-align:center;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .5s var(--ease),transform .5s var(--ease),visibility 0s .5s}
.story-end.is-shown{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.story-end p{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.1rem;color:var(--ink)}
.story-end .sparks{width:min(100%, 300px)}
.story-flowers{width:100%;height:auto;aspect-ratio:294/43}

/* ---------- Map ---------- */
.map{background:linear-gradient(var(--sky), #EAF3EA 60%, #DCE6B5)}
.map-wrap{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-top:44px}
.map-scene{position:relative;width:100%;aspect-ratio:294/507;max-width:100%;background:url("assets/map-bg.webp") center/100% 100% no-repeat}
.map-path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.map-path path{fill:none;stroke:#4A3427;stroke-width:3.2;stroke-dasharray:8.5 6.5;stroke-linecap:round;opacity:.92}
/* Stickers: centred on their slot; width from STICKER_W, height from the art */
.slot{position:absolute;display:block;transform:translate(-50%,-50%);border-radius:50%;transition:transform .15s var(--ease);-webkit-tap-highlight-color:transparent}
.slot:active{transform:translate(-50%,-50%) scale(.95)}
.slot:focus-visible{outline-offset:2px;border-radius:50%}
.sticker-img{width:100%;height:auto;filter:drop-shadow(0 3px 4px rgba(90,60,30,.28));pointer-events:none}
.slot[aria-disabled="true"]{cursor:not-allowed}
.slot-tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;padding:1px 9px;border-radius:999px;background:var(--coral);color:#fff;font-family:var(--font-display);font-size:.68rem;font-weight:600;box-shadow:0 2px 5px rgba(185,73,62,.4)}
.is-new .sticker-img{animation:sticker-in .8s var(--ease) both}
@keyframes sticker-in{0%{opacity:0;transform:scale(.6)}65%{opacity:1;transform:scale(1.06)}100%{transform:none}}
.glint{position:absolute;inset:-14%;pointer-events:none;border-radius:50%;background:radial-gradient(circle, rgba(255,236,170,.75), transparent 62%);animation:glint 1.6s ease-out both}
@keyframes glint{0%{opacity:0;transform:scale(.5)}35%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.map-count{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:2;padding:4px 14px;border-radius:999px;background:rgba(254,246,225,.92);
  font-family:var(--font-display);font-weight:600;font-size:.86rem;color:var(--ink);box-shadow:0 2px 6px rgba(110,59,36,.15);white-space:nowrap}

/* ---------- Activity Preview Popup (wireframe: 358px frame, 6px pastel-yellow border, ivory inside) ---------- */
.view.is-locked{overflow:hidden}
.preview{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  padding:16px 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);opacity:0;transition:opacity .24s var(--ease)}
.preview[hidden]{display:none}
.preview.is-open{opacity:1}
/* light veil over the map only; the bottom nav stays clear (tapping anywhere outside closes) */
.preview-scrim{position:absolute;inset:0;background:linear-gradient(to top, transparent calc(var(--nav-h) + env(safe-area-inset-bottom,0px)), rgba(255,251,240,.16) 0)}
.preview-dialog{--frame:#FFEDA5;--ivory:#F7F8F6;position:relative;width:min(90%, 400px);max-height:100%;display:flex;
  transform:scale(.96);transition:transform .24s var(--ease);outline:none}
.preview.is-open .preview-dialog{transform:none}
.preview-body{flex:1;min-width:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--ivory);
  border:6px solid var(--frame);border-radius:16px;padding:5.5% 5.5% 6%;box-shadow:0 10px 24px -10px rgba(110,59,36,.35), 0 2px 6px rgba(110,59,36,.12)}
.preview-body.is-framed{padding:0}
.preview-art{position:relative}
.preview-art img{width:100%;height:auto;object-fit:contain;border-radius:8px}
.play-hit{position:absolute;aspect-ratio:1;min-width:44px;transform:translate(-50%,-50%);border-radius:50%;transition:transform .12s var(--ease), background .12s}
.play-hit:hover{background:rgba(255,255,255,.14)}
.play-hit:active,.play-hit.is-pressed{transform:translate(-50%,-50%) scale(.92);background:rgba(120,70,0,.16)}
.play-hit:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:50%}
.play-btn{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 35%, #FFD84A, #F7B500);
  box-shadow:0 0 0 4px #FFF3C4, 0 4px 10px -2px rgba(190,120,0,.5);transition:transform .12s var(--ease)}
.play-btn svg{width:30px;height:30px;margin-left:3px}
.play-btn:active,.play-btn.is-pressed{transform:scale(.92)}
.preview-pending{display:grid;place-items:center;gap:10px;min-height:280px;padding:20px;border-radius:12px;border:2px dashed #E9D58E;text-align:center;font-size:.92rem;color:var(--ink-soft)}
.preview-pending strong{font-family:var(--font-display);font-size:1.15rem;color:var(--ink)}
.preview-close{position:absolute;top:0;right:3.8%;width:max(44px, 13.1%);aspect-ratio:1;transform:translate(50%,-28%);border-radius:50%;
  background:var(--frame);color:#E57E66;display:grid;place-items:center;box-shadow:0 2px 6px rgba(110,59,36,.18);transition:transform .12s var(--ease)}
.preview-close svg{width:58%;height:58%}
.preview-close:active{transform:translate(50%,-28%) scale(.92)}

/* ---------- Map HUD (sticker count + tarot collection) ---------- */
.map-hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:2;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding-inline:12px;pointer-events:none}
.map-hud > *{pointer-events:auto}
.map-hud .map-count{position:static;transform:none;margin:0}
.map-tarot-btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:3px 14px 3px 8px;border-radius:999px;background:rgba(254,246,225,.95);
  box-shadow:0 2px 6px rgba(110,59,36,.15), inset 0 0 0 1.5px #EBC98A;font-family:var(--font-display);font-weight:600;font-size:.86rem;color:var(--ink);white-space:nowrap;transition:transform .12s}
.map-tarot-btn svg{width:22px;height:22px;color:#B07A3C}
.map-tarot-btn:active{transform:scale(.95)}

/* ---------- Tarot cards: reward modal + collection (light veil, map stays visible like the wireframe) ---------- */
.tarot-layer{position:absolute;inset:0;z-index:32;opacity:0;transition:opacity .24s var(--ease)}
.tarot-layer[hidden]{display:none}
.tarot-layer.is-open{opacity:1}
.tarot-dialog{position:absolute;inset:0;outline:none}
.tarot-scrim{position:absolute;inset:0;background:linear-gradient(to top, transparent calc(var(--nav-h) + env(safe-area-inset-bottom,0px)), rgba(255,250,238,.22) 0)}
.tarot-dialog + .tarot-dialog .tarot-scrim{background:linear-gradient(to top, transparent calc(var(--nav-h) + env(safe-area-inset-bottom,0px)), rgba(255,250,238,.55) 0)}
.tarot-stage{position:absolute;inset:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px)) 0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;pointer-events:none}
.tarot-stage > *{pointer-events:auto}
.tarot-holder{position:relative;width:min(86cqw, 400px, calc((100cqh - 74px) * .677));transform:scale(.94);opacity:0;transition:transform .3s var(--ease), opacity .3s var(--ease)}
.tarot-dialog.is-in .tarot-holder{transform:none;opacity:1}
.tarot-dialog.is-new.is-in .tarot-holder{animation:tarot-arrive .75s var(--ease) both}
@keyframes tarot-arrive{0%{opacity:0;transform:translateY(18px) scale(.82)}60%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{transform:none}}
/* the card: 3D flip */
.tarot-viewer{position:relative;width:100%}
.tarot-card{position:relative;display:block;width:100%;border-radius:12%/8%;perspective:1400px;perspective-origin:50% 45%;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* flip: Front → Back rotateY(0 → 180deg) left-to-right; Back → Front back to 0 (right-to-left) */
.tarot-inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform-origin:50% 50%;transition:transform .6s ease-in-out}
.tarot-card.to-back{animation:tarot-sweep-left .6s ease-in-out}
.tarot-card.to-front{animation:tarot-sweep-right .6s ease-in-out}
@keyframes tarot-sweep-left{0%{transform:none}50%{transform:translateX(3%) scale(.97)}100%{transform:none}}
@keyframes tarot-sweep-right{0%{transform:none}50%{transform:translateX(-3%) scale(.97)}100%{transform:none}}
/* corner controls (sit on the card's top corners; never over the numeral or title banner) */
.tarot-ctrls{position:absolute;inset:0;pointer-events:none;transition:opacity .12s}
.tarot-ctrls.is-swapping{opacity:0}
.tarot-ctl{position:absolute;top:0;z-index:2;width:44px;height:44px;border-radius:50%;background:#FFEDA5;color:#E57E66;display:grid;place-items:center;pointer-events:auto;
  box-shadow:0 2px 6px rgba(110,59,36,.22);transition:transform .12s var(--ease)}
.tarot-ctl svg{width:24px;height:24px}
/* supplied round icons are the whole button face (green flip arrow / red X): no yellow disc behind them */
.tarot-ctl{background:none;box-shadow:none;padding:0}
.tarot-ctl img{display:block;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(110,59,36,.25))}
.tarot-flip-right,.tarot-close-right{right:0;transform:translate(30%,-30%)}
.tarot-flip-left{left:0;transform:translate(-30%,-30%)}
.tarot-flip-right:active,.tarot-close-right:active{transform:translate(30%,-30%) scale(.92)}
.tarot-flip-left:active{transform:translate(-30%,-30%) scale(.92)}
.tarot-ctl:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.tarot-face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tarot-face img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(110,59,36,.28)) drop-shadow(0 2px 3px rgba(110,59,36,.18));pointer-events:none}
.tarot-back{transform:rotateY(180deg)}
/* back with live HTML text (Time Out): blank frame image + text inside its white panel, under the “การขอเวลานอก” title */
.tarot-back.has-text .tb-text{position:absolute;left:12%;right:12%;top:var(--tb-top, 19.6%);bottom:14.2%;overflow:hidden;text-align:left;color:#3B2414;
  font-family:var(--font-body);line-height:1.42;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;cursor:text}
.tb-text section + section{margin-top:.62em}
.tb-text h3{margin:0 0 .12em;font-size:1.08em;font-weight:700;color:#8A3E26;line-height:1.3}
.tb-text p{margin:0}
.tb-text ol{margin:0;padding-left:1.35em}
.tb-text li{margin:.08em 0;padding-left:.1em}
.tb-text li::marker{font-weight:700;color:#8A3E26}
.tb-text ul{margin:0;padding-left:1.25em}
.tb-text ul.tb-stars{list-style:none;padding-left:1.3em}
.tb-text ul.tb-stars li::before{content:"★";position:absolute;margin-left:-1.25em;color:#E8B23A}
.tb-text ul.tb-dots{list-style:disc}
.tb-text ul.tb-dots li::marker{color:#8A3E26}
/* Box Breathing back: the shared bbCycleHTML() diagram, static, on the Box Breathing activity's yellow background; sized in em so it scales with the fitted card text */
.tb-cycle-wrap{isolation:isolate;margin:.3em 0 .1em;padding:.35em 0;border-radius:.9em;background:transparent;display:flex;justify-content:center}   /* card only: transparent, the card's white shows through */
.tb-cycle-wrap .bb-cycle{--cyc:17.5em;width:var(--cyc);max-width:100%}
.tb-cycle-wrap .bb-cy{font-size:calc(var(--cyc) / 21.6);padding:.405em .81em;border-radius:1.08em}   /* same label : diagram ratio as the activity (14.8px labels on a 320px diagram) */
.tb-text b{font-weight:700}
.tb-text .tb-tag{margin:0 13% .75em;text-align:center;font-weight:600;font-size:1.06em;line-height:1.35;color:#2E1C0F}   /* Journaling tagline: sits between the ribbon tails */
.tb-text .nw{white-space:nowrap}   /* keep short Thai phrases from leaving a one-word orphan line */
.tarot-glow{position:absolute;inset:-6%;border-radius:14%;pointer-events:none;opacity:0;background:radial-gradient(closest-side, rgba(255,228,150,.55), rgba(255,228,150,0))}
.tarot-card.is-flipping .tarot-glow{animation:tarot-glow .6s ease-out}
@keyframes tarot-glow{0%{opacity:0}45%{opacity:1}100%{opacity:0}}
.tarot-dialog.is-new .tarot-holder::after{content:"";position:absolute;inset:-12%;pointer-events:none;border-radius:50%;background:radial-gradient(circle, rgba(255,236,170,.7), transparent 62%);animation:glint 1.6s .2s ease-out both}
.tarot-hint{margin:0;max-width:92cqw;padding:5px 14px;border-radius:999px;background:rgba(254,246,225,.95);box-shadow:0 2px 6px rgba(110,59,36,.15);font-size:.82rem;color:var(--ink);text-align:center;
  opacity:0;transition:opacity .3s .15s}
.tarot-dialog.is-in .tarot-hint{opacity:1}
.tarot-hint b{font-family:var(--font-display);color:var(--coral-deep)}
/* collection */
.tarot-collection{box-sizing:border-box;width:min(calc(100% - clamp(20px, 6cqw, 32px)), 440px);max-height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:18px clamp(20px, 6.5cqw, 30px) 20px;border-radius:24px;background:var(--cream);
  box-shadow:0 12px 28px -10px rgba(110,59,36,.4), inset 0 0 0 1.5px #EED7AE;transform:translateY(10px);opacity:0;transition:transform .26s var(--ease), opacity .26s var(--ease)}
.tarot-dialog.is-in .tarot-collection{transform:none;opacity:1}
.tc-head{display:flex;align-items:center;gap:8px}
.tc-head h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--ink)}
.tc-count{padding:0 10px;border-radius:999px;background:var(--leaf-soft);font-family:var(--font-display);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tc-close{margin-left:auto;width:40px;height:40px}
.tc-sub{margin:4px 0 12px;font-size:.88rem;color:var(--ink-soft)}
.tc-grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:10px}
.tarot-tile{position:relative;display:block;width:100%;aspect-ratio:600/950;padding:0;border-radius:10%/7%;transition:transform .15s var(--ease)}
.tarot-tile img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(110,59,36,.25))}
button.tarot-tile:active{transform:scale(.95)}
.tarot-tile.is-locked{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:repeating-linear-gradient(135deg,#F1E6D3 0 8px,#EDE0CA 8px 16px);
  box-shadow:inset 0 0 0 2px #E2CFAE, inset 0 0 0 6px #F7EFE1, inset 0 0 0 7px #E2CFAE;color:#A99272}
.tarot-tile.is-locked svg{width:22px;height:22px}
.tl-roman{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.tl-q{font-family:var(--font-display);font-weight:700;letter-spacing:.12em}
/* Sticker entry popup v2 — no cream panel: sticker, names and Play float on a soft veil with white glows.
   Gray "?" fades in → gentle shake → crossfades into the activity's colour sticker → roman / EN / TH + Play */
.sep-scrim{background:rgba(255,248,236,.62) !important;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
/* close: the supplied coral X artwork only (no extra background); 48px tap area around a 40px icon */
.sep-close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px, env(safe-area-inset-right,0px));z-index:2;display:grid;place-items:center;width:48px;height:48px;
  padding:0;background:none;border:0;border-radius:12px;pointer-events:auto;opacity:0;transition:opacity .3s ease, transform .12s ease;-webkit-tap-highlight-color:transparent}
.tarot-dialog.is-in .sep-close{opacity:1}
.sep-close img{display:block;width:40px;height:40px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(101,68,47,.22))}
.sep-close:active{transform:scale(.9)}
.sep-close:focus-visible{outline:2px solid rgba(201,110,90,.6);outline-offset:2px}
.sep-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(8px, 1.6cqh, 16px);width:min(calc(100% - 40px), 360px);
  opacity:0;transform:scale(.94);transition:transform .4s var(--ease), opacity .4s var(--ease)}
.tarot-dialog.is-in .sep-box{transform:none;opacity:1}
.sep-sticker{position:relative;width:min(64cqw, 34cqh, 250px);aspect-ratio:465/480}
.sep-sticker img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.95)) drop-shadow(0 0 26px rgba(255,255,255,.8)) drop-shadow(0 6px 10px rgba(90,60,30,.18))}
.sep-color{opacity:0;transform:scale(.86)}
.sep.is-shake .sep-gray{animation:sep-shake .6s ease-in-out both}
@keyframes sep-shake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-3px) rotate(-5deg)}35%{transform:translateX(3px) rotate(5deg)}55%{transform:translateX(-2px) rotate(-3.5deg)}75%{transform:translateX(2px) rotate(2.5deg)}90%{transform:translateX(-1px) rotate(-1deg)}}
.sep.is-transformed .sep-gray{animation:none;opacity:0;transform:scale(1.08);transition:opacity .6s ease, transform .6s var(--ease)}
.sep.is-transformed .sep-color{opacity:1;transform:none;transition:opacity .6s ease, transform .6s cubic-bezier(.3,1.5,.5,1)}
.sep-glow{position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle, rgba(255,250,235,.95), rgba(255,236,180,.45) 45%, rgba(255,236,180,0) 68%);opacity:0;transform:scale(.6)}
.sep.is-transformed .sep-glow{animation:sep-glow 1.1s ease-out both}
@keyframes sep-glow{0%{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1)}100%{opacity:.6;transform:scale(1.04)}}
.sep-spark{position:absolute;font-size:1.3rem;color:#E9B23A;opacity:0;pointer-events:none;text-shadow:0 0 8px #fff}
.sep-spark.s1{top:2%;left:2%}.sep-spark.s2{top:10%;right:-2%;font-size:1rem}.sep-spark.s3{bottom:6%;right:6%;font-size:.95rem}
.sep.is-transformed .sep-spark{animation:sep-spark 1.2s ease-out both}
.sep.is-transformed .sep-spark.s2{animation-delay:.12s}.sep.is-transformed .sep-spark.s3{animation-delay:.24s}
@keyframes sep-spark{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(.9) translateY(-6px)}}
.sep-name{margin:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--font-display);text-align:center;
  text-shadow:0 0 6px #fff, 0 0 14px rgba(255,255,255,.95), 0 0 26px rgba(255,255,255,.85);opacity:0;transform:translateY(6px);transition:opacity .35s ease, transform .35s ease}
.sep-roman{font-weight:700;font-size:1rem;letter-spacing:.06em;color:#8A5A3C}
.sep-en{font-weight:700;font-size:clamp(1.45rem, 7vw, 1.9rem);line-height:1.2;color:#5B321E}
.sep-th{font-weight:600;font-size:clamp(1rem, 4.6vw, 1.18rem);line-height:1.35;color:#6B4A36;text-wrap:balance}
.sep-play{display:block;width:clamp(78px, 24cqw, 104px);aspect-ratio:1;padding:0;border-radius:50%;background:none;opacity:0;transform:translateY(8px) scale(.9);visibility:hidden;
  filter:drop-shadow(0 0 12px rgba(255,255,255,.95)) drop-shadow(0 0 26px rgba(255,255,255,.75));transition:opacity .3s ease, transform .3s var(--ease), visibility 0s .3s;-webkit-tap-highlight-color:transparent}
.sep-play img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.sep.is-ready .sep-name{opacity:1;transform:none}
.sep.is-ready .sep-play{opacity:1;transform:none;visibility:visible;transition-delay:0s}
@media (hover:hover){.sep.is-ready .sep-play:hover{transform:scale(1.05)}}
.sep.is-ready .sep-play:active,.sep-play.is-pressed{transform:scale(.93) !important}
.sep-play:focus-visible{outline:2px solid rgba(201,154,62,.55);outline-offset:5px}
.sep.is-static .sep-gray{display:none}
.sep.is-static *{transition:none !important;animation:none !important}
@media (prefers-reduced-motion: reduce){.sep *{transition:none !important;animation:none !important}}
/* map: short notice when a locked activity is tapped */
.map-toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:6;margin:0;max-width:calc(100% - 40px);padding:8px 16px;border-radius:999px;
  background:rgba(107,58,34,.92);color:#FFF8F0;font-family:var(--font-display);font-weight:600;font-size:.9rem;text-align:center;white-space:nowrap;
  opacity:0;transform:translate(-50%, 8px);transition:opacity .25s, transform .25s;pointer-events:none}
.map-toast:empty{display:none}
.map-toast.is-on{opacity:1;transform:translate(-50%, 0)}
.vrow[data-state="locked"] .slot{cursor:not-allowed}
/* Tarot Collection shortcut (replaces the hamburger) — icon built from the supplied tarot card art */
.tarot-btn{width:48px;height:48px;border-radius:16px;background:rgba(254,246,225,.95);box-shadow:0 2px 6px rgba(110,59,36,.18), inset 0 0 0 1.5px #EBC98A;transition:transform .12s}
.tarot-btn:active{transform:scale(.92)}
.tarot-ico{position:relative;display:block;width:34px;height:34px;pointer-events:none}
.tarot-ico img{position:absolute;top:1px;width:21px;height:31px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(110,59,36,.35))}
.tarot-ico img:first-child{left:0;transform:rotate(-13deg)}
.tarot-ico img:last-child{right:0;transform:rotate(11deg)}
.map-hud .map-tarot-ico{position:absolute;top:0;right:max(12px, env(safe-area-inset-right,0px))}
@media (max-width:360px){.map-hud .map-tarot-ico{width:44px;height:44px}}   /* stays clear of the logo on narrow phones */
.tarot-dialog.no-nav .tarot-stage{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tarot-dialog.no-nav .tarot-scrim{background:rgba(255,250,238,.22)}
.tarot-dialog + .tarot-dialog.no-nav .tarot-scrim{background:rgba(255,250,238,.55)}
.tc-progress{display:inline-block;margin:0 0 6px;padding:2px 12px;border-radius:999px;background:var(--leaf-soft);font-family:var(--font-display);font-weight:600;font-size:.9rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tc-tap{margin:0 0 12px;font-size:.82rem;color:var(--ink-soft)}
.tarot-collection .tc-grid{grid-template-columns:repeat(2, minmax(0,1fr));gap:clamp(12px, 4cqw, 18px) clamp(14px, 4.5cqw, 20px)}
.tarot-collection .tarot-tile.is-locked{background:repeating-linear-gradient(135deg,#EDEDED 0 8px,#E5E5E5 8px 16px);box-shadow:inset 0 0 0 2px #CFCFCF, inset 0 0 0 6px #F4F4F4, inset 0 0 0 7px #CFCFCF, 0 3px 6px -3px rgba(80,80,80,.25);color:#8E8E8E}
.tc-reset{display:block;margin:16px auto 2px;min-height:42px;padding:6px 18px;border-radius:999px;background:transparent;border:1.5px solid #D9B791;font-family:var(--font-display);font-weight:600;font-size:.88rem;color:#8A6A4E}
.tc-reset:active{transform:scale(.96)}
.tcr-box{box-sizing:border-box;width:min(calc(100% - 36px), 360px);padding:18px 18px 16px;border-radius:22px;background:var(--cream);box-shadow:0 12px 28px -10px rgba(110,59,36,.45), inset 0 0 0 1.5px #EED7AE;
  transform:translateY(10px);opacity:0;transition:transform .22s var(--ease), opacity .22s var(--ease)}
.tarot-dialog.is-in .tcr-box{transform:none;opacity:1}
.tcr-box h2{margin:0 0 8px;font-family:var(--font-display);font-weight:700;font-size:1.12rem;line-height:1.4;color:#5B3A29;text-align:center;text-wrap:balance}
.tcr-row{gap:10px}
.tcr-cancel,.tcr-ok{flex:1;min-height:46px;border-radius:999px;font-family:var(--font-display);font-weight:700;font-size:.98rem;transition:transform .12s}
.tcr-cancel{background:#E4EDD7;color:#4F5E3A;box-shadow:inset 0 0 0 1.5px #BFD0A6, 0 3px 0 #C9D8B4}
.tcr-ok{background:#D9775F;color:#FFF8F0;box-shadow:0 3px 0 #B95C47}
.tcr-cancel:active,.tcr-ok:active{transform:translateY(2px) scale(.98)}
.tcr-ok:disabled{opacity:.6}
.tcr-cancel:focus-visible,.tcr-ok:focus-visible{outline:3px solid #8A6A4E;outline-offset:3px}
.tcr-box p{margin:0 0 14px;font-size:.9rem;line-height:1.55;color:var(--ink-soft);text-align:center;text-wrap:balance}
.menu-ico{display:grid;place-items:center;width:40px;color:#B07A3C}
.menu-ico svg{width:30px;height:30px}

/* ---------- Completed Activity Popup (wireframe: sage frame, ivory box, header tab, two stacked buttons) ---------- */
.cap{--cap-sage:#DFDEB6;--cap-ivory:#FAF3E9;--cap-gold:#FCEEAE;--cap-ink:#4A2C18}
.cap .tarot-stage{perspective:1300px}
.cap-turn{display:flex;flex-direction:column;align-items:center;gap:10px;max-height:100%;transition:transform .23s cubic-bezier(.4,.1,.6,1), opacity .23s;transform-origin:50% 50%}
.cap-turn.is-out{transform:rotateY(90deg);opacity:.35}
.cap-turn.is-pre{transform:rotateY(-90deg);opacity:.35;transition:none}
.cap-frame{position:relative;width:min(82cqw, 340px);margin-top:20px;transform:translateY(10px) scale(.97);opacity:0;transition:transform .26s var(--ease), opacity .26s var(--ease)}
.tarot-dialog.is-in .cap-frame{transform:none;opacity:1}
.cap-box{max-height:calc(100cqh - 52px);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:42px 18px 24px;background:var(--cap-ivory);border:8px solid var(--cap-sage);border-radius:30px;box-shadow:0 12px 26px -12px rgba(90,70,30,.45)}
.cap-head{position:absolute;z-index:1;top:-20px;left:50%;transform:translateX(-50%);margin:0;padding:7px 24px 9px;border-radius:999px;background:var(--cap-sage);
  font-family:var(--font-display);font-weight:700;font-size:1.2rem;line-height:1.3;color:#3C1A0A;white-space:nowrap}
.cap-close{position:absolute;z-index:2;top:-16px;right:-10px;width:48px;height:48px;border-radius:50%;background:var(--cap-gold);color:#D7836C;display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(110,59,36,.2);transition:transform .12s var(--ease)}
.cap-close svg{width:26px;height:26px}
.cap-close:active{transform:scale(.92)}
.cap-sticker{width:min(100%, calc(100cqh - 260px), 280px);height:auto;filter:drop-shadow(0 4px 6px rgba(90,60,30,.25))}
/* Completed popup v2 — floating like the sticker entry popup: no panel / border / title tab; soft white glows */

  box-shadow:inset 0 0 0 3px #F8E8C8, 0 10px 20px -12px rgba(150,80,50,.45)}
.toi-q{margin:0 0 clamp(10px, 1.8cqh, 16px);display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:clamp(1.05rem, 3cqh, 1.5rem);line-height:1.3;color:#5B321E;text-align:center;text-wrap:balance}

  box-shadow:inset 0 0 0 2.5px #CFE0B2, 0 4px 10px -6px rgba(110,90,40,.35);text-align:center;transition:transform .12s var(--ease), box-shadow .12s;-webkit-tap-highlight-color:transparent}

/* Time Out activity choice v2 — real HTML 2×2 grid on the same gradient as the location screen; no progress tube */
.to-choose{overflow-y:auto;gap:clamp(10px, 2cqh, 20px)}
.toc-head{box-sizing:border-box;width:100%;margin:calc(44px + clamp(4px, 1cqh, 10px)) 0 0;padding:clamp(10px, 1.8cqh, 16px) 18px;border-radius:999px;background:#FDF3DF;
  box-shadow:inset 0 0 0 3px #F7E3BF, 0 4px 0 #F0D5A8, 0 10px 18px -10px rgba(150,80,50,.45);
  font-family:var(--font-display);font-weight:700;font-size:clamp(1.05rem, min(3.2cqh, 5.6cqw), 1.6rem);line-height:1.3;color:#5B321E;text-align:center;text-wrap:balance}
.toc-grid{flex:1 1 auto;min-height:0;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(10px, 3.4cqw, 18px)}
.toc-card{display:flex;flex-direction:column;gap:clamp(6px, 1.2cqh, 10px);min-height:0;padding:clamp(7px, 1.2cqh, 10px);border-radius:24px;background:#FDF5E4;
  box-shadow:inset 0 0 0 2.5px #F2DDB5, 0 6px 14px -8px rgba(150,80,50,.45);text-align:center;transition:transform .12s var(--ease);-webkit-tap-highlight-color:transparent}
.toc-card .toi-slot{flex:1 1 0;min-height:clamp(64px, 11cqh, 160px);width:100%;border-radius:18px;box-shadow:inset 0 0 0 2px rgba(255,250,238,.9)}
.toc-card .toi-slot::after{outline-offset:-8px}
.toc-card .toi-slot img{width:100%;height:100%;object-fit:contain}
/* filled picture slots (original PNG art, centred, proportions + transparency kept) */
.toi-slot.has-img{position:relative;display:grid;place-items:center;overflow:hidden;min-width:0}
.toi-slot.has-img::after{display:none}
.toi-slot.has-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.toi-rabbit.has-img{background:none;box-shadow:none;border-radius:0;overflow:visible}   /* no frame: the PNG sits on the page gradient */
.toi-rabbit.has-img img{inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(150,80,50,.18))}   /* ≈ +16% vs the framed version */
.toi-slot.is-scene img{object-fit:cover}                 /* square scenes fill their rounded frame */
.toc-card .toi-slot.is-icon{background:#FFF8EA}
.toc-card .toi-slot.is-icon img{inset:12%;width:76%;height:76%}   /* trimmed icons get the same breathing room → equal visual weight */
.toc-card .toi-slot[data-slot="quiet"] img{inset:5%;width:90%;height:90%}   /* wide rabbit reads smaller → a little more room */
.toc-card .toi-slot[data-slot="water"] img{inset:16%;width:68%;height:68%}   /* tall solid cup reads heavier → a little less */
.toc-label{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:clamp(52px, 8.6cqh, 76px);padding:4px 6px;border-radius:16px;background:#FFFBF2;box-shadow:inset 0 0 0 2px #EFDDBB;

.toc-card:hover{transform:translateY(-2px)}
.toc-card:active{transform:scale(.97)}
.toc-card[aria-pressed="true"]{box-shadow:inset 0 0 0 3px #E8A35E, 0 6px 14px -8px rgba(150,80,50,.45)}
.toc-card:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
/* Grounding intro v2 — real HTML on a sage → cream gradient (same card language as the Time Out / PMR intros) */
.gri{position:relative;box-sizing:border-box;height:100%;min-height:0;container-type:size;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(8px, 1.8cqh, 18px);
  padding:calc(clamp(52px, 8.6cqh, 72px) + env(safe-area-inset-top,0px)) clamp(18px, 6cqw, 34px) calc(clamp(16px, 3cqh, 30px) + env(safe-area-inset-bottom,0px));

.gri-title{margin:0;padding:clamp(10px, 1.8cqh, 16px) 16px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--font-display);font-weight:700;color:#4A2C18}

.gri-pic{flex:1 1 0;min-height:clamp(90px, 18cqh, 999px);width:100%;display:grid;place-items:center;container-type:size;margin:0}

  filter:drop-shadow(0 8px 10px rgba(90,80,40,.18))}   /* Sit02 cut-out: no photo frame */
.gri-start{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:min(78%, 340px);flex:none;min-height:clamp(46px, 7.6cqh, 62px);border-radius:999px;
  background:linear-gradient(#86B856, #6A9A3E);color:#fff;font-family:var(--font-display);font-weight:700;font-size:clamp(1.15rem, min(3.3cqh, 6cqw), 1.6rem);
  box-shadow:0 4px 0 #4D7A2A, 0 10px 18px -10px rgba(60,90,30,.6);transition:transform .12s}

.gri-start:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.to-scene{position:relative;height:100%;min-height:100%;overflow:hidden;isolation:isolate}

.to-char{position:absolute;z-index:1;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(86%, 380px, 50vh);transform:translateX(-50%);
  filter:drop-shadow(0 6px 8px rgba(60,50,20,.25))}

/* quiet: real horizontal sway of the rabbit layer only — centre → left → centre → right → centre */

.to-ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}

.to-top-flow{align-self:stretch;flex:none;margin:0}
.toc-head{margin-top:0 !important}
/* intro v3: slimmer description card → bigger rabbit that sways gently */

/* ---------- Activity II — Box Breathing (spec palette: cream / dusty pink / muted brown / sage / peach) ---------- */
.bb{--bb-bg:#FFF8F2;--bb-pink:#D8A7A0;--bb-brown:#92746A;--bb-sage:#BFCBB1;--bb-peach:#F5D6C8;--bb-ink:#59443C;--bb-btn:#A58378;
  background:#FEF6E9;container-type:inline-size;color:var(--bb-ink)}
.bb *,.bb *::before,.bb *::after{box-sizing:border-box}
/* all six screens: muted dusty blue → light blue-gray → warm off-white (replaces the old pink/peach wash) */
.bb-screen{position:relative;min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg, #FDEAAC 0%, #FEF1CA 45%, #FEF6E9 100%);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}

  background:radial-gradient(60% 90% at 15% 100%, rgba(191,203,177,.45), transparent 70%),radial-gradient(55% 80% at 90% 100%, rgba(253,234,172,.35), transparent 70%)}

.bb-h2{margin:0;padding:8px 28px;border-radius:999px;background:#F3E2DA;font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem, 6.4cqw, 1.55rem);line-height:1.3;color:var(--bb-ink)}
.bb-p{margin:0;max-width:30ch;font-size:clamp(.95rem, 4.3cqw, 1.06rem);line-height:1.65;color:var(--bb-ink)}
.bb-pill{padding:3px 18px;border-radius:999px;background:#EBD3C9;font-family:var(--font-display);font-weight:600;color:var(--bb-brown)}
.bb-rabbit{display:block;height:auto}

  transition:transform .12s, box-shadow .12s}

/* screen 2 */
.bb-cycle{position:relative;width:min(84cqw, 320px);aspect-ratio:200/160}

.bb-tube{position:relative;width:min(22cqw, 84px);height:100%;max-height:min(46vh, 420px);border-radius:999px;cursor:grab;touch-action:none;
  background:linear-gradient(90deg,#F9EDE8,#FDF7F4 45%,#F1DFD8);box-shadow:inset 0 0 0 3px #C9AFA6, inset 0 8px 14px rgba(146,116,106,.14), 0 6px 14px -8px rgba(110,70,60,.35)}
.bb-fill{position:absolute;left:6px;right:6px;bottom:6px;border-radius:999px;background:linear-gradient(#F5D6C8,#EBB9AE);opacity:.75}
.bb-zone{position:absolute;left:6px;right:6px;height:22%;border-radius:999px;opacity:0;transition:opacity .3s;background:rgba(191,203,177,.55)}
.bb-zone-top{top:6px}.bb-zone-bottom{bottom:6px}
.bb-tube[data-zone="top"] .bb-zone-top,.bb-tube[data-zone="bottom"] .bb-zone-bottom{opacity:1;background:conic-gradient(rgba(191,203,177,.85) calc(var(--hold,0) * 360deg), rgba(191,203,177,.35) 0)}
.bb-knob{position:absolute;left:50%;bottom:6px;width:calc(100% + 22px);aspect-ratio:1;margin-left:calc(-50% - 11px);border-radius:50%;touch-action:none;cursor:grab;will-change:transform}
.bb-knob-img{width:100%;height:100%;display:block;border-radius:50%;filter:drop-shadow(0 4px 6px rgba(110,70,60,.35));pointer-events:none}

.bb-knob.is-done .bb-knob-ring{animation:bb-done .7s ease-out}
@keyframes bb-done{0%{border-color:rgba(191,203,177,.9);transform:scale(.9)}100%{border-color:rgba(191,203,177,0);transform:scale(1.35)}}
.bb-knob:focus-visible{outline:3px solid var(--coral);outline-offset:6px}
.bb-dir{position:absolute;left:calc(50% + min(11cqw, 42px) + 14px);top:30%;width:26px;color:#D9938A}
.bb-play[data-phase="EXHALE"] .bb-dir{top:auto;bottom:22%}
.bb-count{position:absolute;right:2%;top:24%;width:min(23cqw, 92px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#F3E1DA;font-family:var(--font-display);color:#4A332B;transition:box-shadow .3s}

.bb-count span{font-size:.85rem}
.bb-count.is-running{box-shadow:0 0 0 4px rgba(191,203,177,.8)}
.bb-rabbit-sit{position:absolute;left:0;bottom:0;width:min(28cqw, 112px);transform-origin:50% 100%;pointer-events:none}
.bb-safe-play{font-size:.76rem;padding:4px 12px}
.bb-play.is-paused .bb-arena,.bb-play.is-paused .bb-square{filter:saturate(.6) opacity(.6)}
/* ===== Box Breathing v2: new rabbit art, Pin.png knob, light-green tube, coloured text boxes ===== */
:root{--bb-blue:#E3EEF3;--bb-blue-bd:#AFC8D3;--bb-cream:#FFF8EC;--bb-cream-bd:#E6D3B5;--bb-green:#EAF2DF;--bb-green-bd:#B7CC9C}
.bb-rabbit-intro{width:min(62cqw, 250px)}
.bb-rabbit-explain{width:min(30cqw, 124px, 15vh)}
.bb-rabbit-tut{width:min(28cqw, 108px, 14vh);flex:none}
@media (max-height:700px){.bb-explain,.bb-tutorial{gap:9px}.bb-explain .bb-cycle{width:min(76cqw, 290px)}}   /* short phones: keep the 3 intro pages on one screen */
.bb-say-tut{align-items:center;gap:6px}
.bb-say-tut .bb-bubble{flex:0 1 auto;min-height:0;font-size:.88rem;color:#4F6A3A}
/* text boxes — blue = guidance, cream = explanation, green = invitation / safety note */
.bb-pill{background:var(--bb-blue);box-shadow:inset 0 0 0 1.5px var(--bb-blue-bd);color:#3E5864}
.bb-h2,.bb-phase{background:var(--bb-blue);box-shadow:inset 0 0 0 2px var(--bb-blue-bd)}
.bb-cy{background:var(--bb-cream);box-shadow:inset 0 0 0 1.5px var(--bb-cream-bd)}
.bb-bubble{background:var(--bb-green);box-shadow:inset 0 0 0 2px var(--bb-green-bd)}
.bb-legend li.is-now{background:var(--bb-blue);box-shadow:inset 0 0 0 2px var(--bb-blue-bd)}
.bb-safe{background:var(--bb-green);box-shadow:inset 0 0 0 1.5px var(--bb-green-bd);color:#4C5B3C}
.bb-card{background:var(--bb-cream);box-shadow:inset 0 0 0 2px var(--bb-cream-bd), 0 6px 14px -8px rgba(110,70,60,.35)}
.bb-count{background:var(--bb-cream);box-shadow:inset 0 0 0 2px var(--bb-cream-bd)}
.bb-count.is-running{box-shadow:inset 0 0 0 2px var(--bb-cream-bd), 0 0 0 4px rgba(183,204,156,.85)}
/* breathing tube: light green gradient + a slightly deeper sage rail edge */
.bb-tube,.bb-tut-legacy{background:linear-gradient(90deg,#E4EDD6,#EFF4E6 45%,#CAD9B8);box-shadow:inset 0 0 0 3px #A9BE8E, inset 0 8px 14px rgba(90,110,60,.14), 0 6px 14px -8px rgba(70,90,40,.35)}
.bb-fill{background:linear-gradient(#D8E6C4,#BDD0A2);opacity:.8}
.bb-zone{background:rgba(150,180,120,.5)}
.bb-tube[data-zone="top"] .bb-zone-top,.bb-tube[data-zone="bottom"] .bb-zone-bottom{background:conic-gradient(rgba(130,165,100,.85) calc(var(--hold,0) * 360deg), rgba(150,180,120,.3) 0)}
.bb-knob-img{filter:drop-shadow(0 4px 6px rgba(60,80,40,.35))}
.bb-knob.is-grabbed .bb-knob-ring{border-color:rgba(130,165,100,.8)}
.bb-tut-up,.bb-tut-down,.bb-dir{color:#7FA06A}
.bb-sq-side.is-now{stroke:#7FA862;stroke-width:12}
.bb-sq-dot{r:7}
.bb-tube{width:min(15cqw, 58px)}                                   /* slimmer rail; same length */
.bb-knob{width:max(64px, calc(100% + 22px));margin-left:calc(max(64px, calc(100% + 22px)) / -2)}
.bb-knob::before{content:"";position:absolute;inset:-10px;border-radius:50%}   /* extra invisible touch area (≥ 84 × 84 px) */
.bb-tut-wrap{width:46px}
.bb-dir{left:calc(50% + 46px)}
/* ===== Box Breathing v3: bright rounded boxes (pastel blue / warm cream / light green) + warm-yellow buttons ===== */
:root{--bb-ink-blue:#34505C;--bb-ink-green:#38522B;--bb-yel:#F6D568;--bb-yel-hi:#FBE08A;--bb-yel-bd:#D9AE3C;--bb-yel-sh:#C99A2E;--bb-yel-ink:#4A3A12}
.bb-btn{background:var(--bb-yel);color:var(--bb-yel-ink);box-shadow:inset 0 0 0 2px var(--bb-yel-bd), 0 4px 0 var(--bb-yel-sh), 0 10px 18px -8px rgba(150,110,20,.45)}
.bb-btn:hover{background:var(--bb-yel-hi)}
.bb-btn:active{transform:translateY(3px);background:#EFC94F;box-shadow:inset 0 0 0 2px var(--bb-yel-bd), 0 1px 0 var(--bb-yel-sh)}
.bb-btn:focus-visible{outline:3px solid var(--bb-ink-blue);outline-offset:3px}
.bb-ghost{background:#FFFBEE;color:var(--bb-yel-ink);box-shadow:inset 0 0 0 2px var(--bb-yel-bd), 0 3px 0 rgba(201,154,46,.45)}
.bb-ghost:hover{background:#FFF4CC}
.bb-ghost:active{box-shadow:inset 0 0 0 2px var(--bb-yel-bd), 0 1px 0 rgba(201,154,46,.45)}
.bb-back,.bb-pause{color:var(--bb-ink-blue);box-shadow:inset 0 0 0 2px var(--bb-blue-bd)}
.bb-pause:focus-visible,.bb-back:focus-visible,.bb-link:focus-visible{outline:3px solid var(--bb-ink-blue)}
/* blue boxes → dark blue-gray text; cream boxes → dark blue-gray text; green boxes → dark green text; all softly rounded with a light border */
.bb-pill{color:var(--bb-ink-blue);box-shadow:inset 0 0 0 2px var(--bb-blue-bd)}
.bb-h2,.bb-phase{color:var(--bb-ink-blue);border-radius:24px}
.bb-phase-ico{color:var(--bb-ink-blue)}
.bb-cy{border-radius:16px;color:var(--bb-ink-blue);box-shadow:inset 0 0 0 2px var(--bb-cream-bd)}
.bb-bubble,.bb-say-tut .bb-bubble{border-radius:22px;color:var(--bb-ink-green)}
.bb-safe{border-radius:16px;color:var(--bb-ink-green);box-shadow:inset 0 0 0 2px var(--bb-green-bd)}
.bb-legend li.is-now{color:var(--bb-ink-blue)}
.bb-li-ico{background:#7E9DAA}
.bb-dots i{background:#D3DFE3}.bb-dots i.on{background:#7E9DAA}
.bb-card{border-radius:24px;color:var(--bb-ink-blue);box-shadow:inset 0 0 0 2px var(--bb-cream-bd), 0 6px 14px -8px rgba(80,90,60,.3)}
.bb-final-card,.bb-done .bb-card.is-green{background:var(--bb-green);color:var(--bb-ink-green);box-shadow:inset 0 0 0 2px var(--bb-green-bd), 0 6px 14px -8px rgba(80,90,60,.3)}
.bb-count{color:var(--bb-ink-blue)}
/* title sign: rounded pastel-blue plaque (Time Out style) instead of the brown ribbon */
.bb-ribbon{padding:10px 30px;border-radius:24px;background:var(--bb-blue);color:var(--bb-ink-blue);transform:rotate(-2deg);box-shadow:inset 0 0 0 2px var(--bb-blue-bd), 0 4px 0 #C9DAE1}
.bb-ribbon::before,.bb-ribbon::after{display:none}
.bb-rabbit-sit{width:min(calc(50% - 46px), 140px);left:0;bottom:6px}   /* clears the knob (≥ 8 px) and the note below */
.bb-rabbit-paint2{width:min(58cqw, 230px, 27vh);height:auto;margin:4px 0 2px}
.bb-rabbit-paint{width:min(64cqw, 250px, 28vh);height:auto;margin:2px 0 -4px}
.bb-menu-card{background:var(--bb-cream);box-shadow:inset 0 0 0 2px var(--bb-cream-bd), 0 14px 30px -12px rgba(60,40,30,.45);color:var(--bb-ink-blue)}
.bb-check input{accent-color:#7E9DAA}
.bb-link{color:var(--bb-ink-blue)}

.bb-menu{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(89,68,60,.28)}
.bb-menu[hidden]{display:none}
.bb-menu-card{width:min(100%, 330px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 18px;border-radius:24px;background:var(--bb-bg);box-shadow:0 14px 30px -12px rgba(60,40,30,.5);text-align:center}
.bb-menu-card h2{margin:0;font-family:var(--font-display);font-size:1.35rem}
.bb-menu-card p{margin:0;font-size:.9rem;line-height:1.55}
.bb-check{display:flex;align-items:center;gap:8px;font-size:.85rem;min-height:36px}
.bb-check input{width:20px;height:20px;accent-color:var(--bb-brown)}
.bb-link{min-height:40px;padding:4px 10px;font-size:.88rem;color:#9A6458;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){.bb-knob-ring{transition:none}}
@media (max-height: 740px){
  .bb-play{gap:3px}
  .bb-hd{min-height:40px}
  .bb-phase{font-size:1.2rem;padding:3px 18px;margin-top:0}
  .bb-instr{min-height:0;font-size:.9rem;line-height:1.4}
  .bb-fb{font-size:.82rem}
  .bb-square{width:min(86cqw, 300px)}
  .bb-arena{min-height:130px}
  .bb-safe-play{font-size:.7rem;line-height:1.35}
  .bb-screen[data-screen="play"]{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
}

/* ---------- Activity IV — Grounding 5-4-3-2-1 ---------- */
.gr{--pmr-ink:#4A2C18;--pmr-cream:#FBF1D6;--pmr-line:#C9A46A;--gr-ink:#4A2C18;--gr-cream:#FFF8E6;--gr-green:#6A9A3E;background:#E7EFC6;container-type:inline-size}
.gr *,.gr *::before,.gr *::after{box-sizing:border-box}
.gr-intro{position:relative}
.gr-intro img{display:block;width:100%;height:auto}
.gr-hit{position:absolute;border-radius:999px;transition:transform .12s, background .12s}
.gr-hit:hover{background:rgba(255,255,255,.12)}
.gr-hit:active{transform:scale(.97);background:rgba(40,70,10,.14)}
.gr-hit:focus-visible,.gr-spot:focus-visible,.gr-chip:focus-visible,.gr-next:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.gr-step{position:relative;isolation:isolate;height:100%;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(10px, env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-left,0px))}
.gr-step::before{content:"";position:absolute;inset:-40px;z-index:-1;background:var(--gr-bg) center/cover;filter:blur(24px) saturate(1.05) brightness(1.05)}
.gr-top{display:flex;align-items:center;gap:8px}
.gr-stepbar{--pmr-dot:#F1CF7A;--pmr-dot-done:#4E8FE0}   /* same colours as the PMR step bar */
.gr-top + .gr-titlebox{flex:none;margin:0}
.gr-titlebox{flex:1;min-width:0;margin-right:52px;padding:5px 12px;border-radius:18px;background:rgba(255,248,230,.94);box-shadow:inset 0 0 0 2px #E2CC9A, 0 2px 6px rgba(80,60,20,.14);text-align:center}
.gr-title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.05rem, 5cqw, 1.25rem);line-height:1.25;color:var(--gr-ink)}
.gr-eye{margin-right:4px}
.gr-hint{margin:0;align-self:center;padding:3px 12px;border-radius:999px;background:rgba(255,248,230,.85);font-size:.85rem;color:#6A5644;text-align:center}
@media (max-height:700px){.gr-hint{display:none}}
.gr-count{display:inline-block;margin-top:2px;padding:1px 10px;border-radius:999px;background:#E3EEF9;
  font-family:var(--font-display);font-weight:700;font-size:.85rem;color:#2E5E9C;font-variant-numeric:tabular-nums;line-height:1.35}
.gr-count.is-done{background:#E4EFCB;color:#4F6B25}
.gr-stage{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.gr-scene{position:relative;border-radius:18px;box-shadow:0 6px 18px -6px rgba(60,50,20,.35);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.gr-bg{display:block;width:100%;height:100%;border-radius:18px;object-fit:fill;user-select:none;-webkit-user-drag:none}
.gr-spot{position:absolute;border-radius:50%;pointer-events:none;z-index:1}
.gr-lens{position:absolute;border-radius:50%;background-image:var(--gr-bg);background-repeat:no-repeat;opacity:0;transform:scale(1);
  transition:opacity .2s, transform .35s cubic-bezier(.3,1.4,.5,1), box-shadow .3s}
.gr-tag{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%) scale(.8);opacity:0;white-space:nowrap;padding:3px 10px;border-radius:999px;
  background:#FFF8E6;color:var(--gr-ink);font-family:var(--font-display);font-weight:700;font-size:.82rem;box-shadow:0 2px 6px rgba(60,40,20,.25);transition:opacity .2s, transform .3s cubic-bezier(.3,1.4,.5,1)}
.gr-spot.is-picked{z-index:3}
.gr-spot.is-picked .gr-lens{opacity:1;transform:translateY(-4px) scale(1.18);box-shadow:0 0 0 3px #fff, 0 0 0 6px rgba(244,201,96,.85), 0 10px 18px rgba(60,40,20,.35)}
.gr-spot.is-picked .gr-tag{opacity:1;transform:translate(-50%,-100%) translateY(-6px) scale(1)}
.gr-spot[data-edge="left"] .gr-tag{left:0;transform:translate(0,-100%) scale(.8)}
.gr-spot[data-edge="left"].is-picked .gr-tag{transform:translate(0,-100%) translateY(-6px) scale(1)}
.gr-spot[data-edge="right"] .gr-tag{left:auto;right:0;transform:translate(0,-100%) scale(.8)}
.gr-spot[data-edge="right"].is-picked .gr-tag{transform:translate(0,-100%) translateY(-6px) scale(1)}
.gr-spot[data-vedge="top"] .gr-tag{top:auto;bottom:-6px;transform:translate(-50%,100%) scale(.8)}
.gr-spot[data-vedge="top"].is-picked .gr-tag{transform:translate(-50%,100%) translateY(6px) scale(1)}
.gr-spot.is-pop .gr-lens{animation:gr-pop .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes gr-pop{0%{transform:scale(1)}55%{transform:translateY(-10px) scale(1.3)}100%{transform:translateY(-4px) scale(1.18)}}
.gr-spot.is-again .gr-lens{animation:gr-again .4s ease}
@keyframes gr-again{25%{transform:translateY(-4px) scale(1.18) rotate(-6deg)}75%{transform:translateY(-4px) scale(1.18) rotate(6deg)}}
.gr-toast{position:absolute;left:50%;bottom:10px;z-index:20;width:max-content;max-width:min(320px, 92vw);margin:0;padding:6px 14px;border-radius:999px;background:rgba(74,44,24,.85);color:#FFF8E6;
  font-size:.85rem;text-align:center;transform:translate(-50%,8px);opacity:0;transition:opacity .2s, transform .2s;pointer-events:none}
.gr-toast.is-on{opacity:1;transform:translate(-50%,0)}
.gr-bottom{display:flex;flex-direction:column;align-items:center;gap:8px}
.gr-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px}

.gr-hear{position:relative;min-height:100%;display:flex;flex-direction:column;gap:8px;background:linear-gradient(#EAF2D3,#F6F0D8);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.gr-hstage{position:relative;flex:1 0 auto;height:clamp(260px, 40vh, 420px);border-radius:20px;background-size:cover;background-position:50% 62%;overflow:hidden;

.gr-bubble.c1::after{left:auto;right:22px}
.gr-bubble::before{content:"✦";position:absolute;top:-9px;right:10px;font-size:.8rem;color:#E8B93E}

.gr-btext{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.gr-bact{display:flex;gap:2px;flex:none}
.gr-bact button{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#8A6A4C;font-size:1.15rem;line-height:1;background:rgba(255,255,255,.6)}
.gr-bact svg{width:15px;height:15px}
/* bubbles stack on top, the rabbit takes the remaining height below them: they can never overlap its ears */
.gr-listen{position:relative;z-index:1;flex:1 1 0;min-height:80px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:4px;filter:drop-shadow(0 4px 6px rgba(60,50,20,.25))}
.gr-listen .tf-anim{height:100%;max-height:230px;width:auto;max-width:90%}
.gr-hstage .gr-toast{z-index:5}
.gr-player{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:#FFF8E6;box-shadow:inset 0 0 0 2px #E2CC9A, 0 2px 6px rgba(80,60,20,.12)}
.gr-play,.gr-mute{position:relative;flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:#6B4A2E;transition:transform .12s}
.gr-play{background:#FBE7A5;box-shadow:0 3px 0 #D9B860}

.gr-mute{width:44px;height:44px;background:#F3EAD2}

.gr-wave{position:absolute;right:-2px;top:-2px;display:none;gap:2px;align-items:flex-end;height:14px;padding:2px 3px;border-radius:6px;background:#fff}
.gr-wave i{width:3px;border-radius:2px;background:#6A9A3E;animation:gr-wave .8s ease-in-out infinite}
.gr-wave i:nth-child(2){animation-delay:.15s}.gr-wave i:nth-child(3){animation-delay:.3s}
@keyframes gr-wave{0%,100%{height:3px}50%{height:10px}}
.gr-play.is-playing .gr-wave{display:flex}
.gr-vol{flex:1;min-width:0;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:pan-y}

.gr-vol::-moz-range-progress{height:10px;border-radius:999px;background:#A9CC86}
.gr-vol::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #6A9A3E;box-shadow:0 2px 4px rgba(60,50,20,.3)}

.gr-volpct{flex:none;min-width:3.6em;text-align:right;font-family:var(--font-display);font-weight:700;font-size:.85rem;color:#6B4A2E;font-variant-numeric:tabular-nums}
.gr-astatus{margin:-2px 0 0;min-height:1.2em;text-align:center;font-size:.8rem;color:#7A6A50}
.gr-input{display:flex;gap:8px;padding:5px 5px 5px 16px;border-radius:999px;background:#FFF8E6;box-shadow:inset 0 0 0 2px #E2CC9A}
.gr-input input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font-body);font-size:1rem;color:var(--gr-ink);outline:none}
.gr-input input::placeholder{color:#A8957A}
.gr-input:focus-within{box-shadow:inset 0 0 0 2px #6A9A3E}
.gr-add{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(#7FB04E,#6A9A3E);color:#fff}
.gr-add svg{width:22px;height:22px}

.gr-hear .gr-next{align-self:center}
.gr-play:focus-visible,.gr-mute:focus-visible,.gr-add:focus-visible,.gr-bact button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.gr-bubble.is-pop,.gr-wave i{animation:none}}
/* smell step */
.gr-smell{position:relative;height:100%;display:flex;flex-direction:column;gap:8px;background:linear-gradient(#EAF2D3,#F6F0D8);overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.gr-sstage{position:relative;flex:1 1 0;min-height:240px;border-radius:20px;background-size:cover;background-position:50% 62%;overflow:hidden;
  box-shadow:inset 0 0 0 2px rgba(255,248,230,.7), 0 6px 16px -8px rgba(60,50,20,.4);display:flex;flex-direction:column}
/* popup slot sits above the rabbit with a reserved height: no overlap, no layout shift */
.sm-spacer{flex:none;height:78px}   /* keeps the rabbit exactly where it was; the popup itself floats */
.sm-slot{position:absolute;left:0;right:0;top:var(--pop-y,78px);z-index:3;display:flex;justify-content:center;padding:0 12px;transform:translateY(-100%);pointer-events:none}

.sm-card{position:relative;display:flex;align-items:center;gap:10px;max-width:94%;margin:0;padding:10px 18px 10px 12px;border-radius:22px;background:#FFF8E6;border:2px solid #C9A27A;
  box-shadow:0 5px 12px -5px rgba(80,60,30,.4);font-family:var(--font-display);font-weight:700;font-size:clamp(1rem, 4.6cqw, 1.15rem);line-height:1.35;color:var(--gr-ink)}
.sm-card svg{flex:none;width:34px;height:34px}
.sm-card::after{content:"";position:absolute;bottom:-8px;left:50%;width:14px;height:14px;margin-left:-7px;background:#FFF8E6;border-right:2px solid #C9A27A;border-bottom:2px solid #C9A27A;transform:rotate(45deg)}
.sm-card.is-in{animation:sm-card-in .42s cubic-bezier(.3,1.35,.5,1) both}
@keyframes sm-card-in{0%{opacity:0;transform:scale(.9)}70%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
.sm-rabbit-wrap{position:relative;z-index:1;flex:1 1 0;min-height:110px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:6px;filter:drop-shadow(0 4px 6px rgba(60,50,20,.25))}
.sm-rabbit{position:relative;height:100%;max-height:310px;max-width:94%;transform-origin:50% 100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sm-rabbit img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.sm-rabbit img[hidden]{display:none}
.sm-rabbit.is-sniffing{animation:sm-breathe 1.3s ease-in-out infinite}
@keyframes sm-breathe{50%{transform:scale(1.025)}}
.sm-rabbit.is-thinking{animation:sm-tilt 1.2s ease-in-out}
@keyframes sm-tilt{30%{transform:rotate(-2deg)}70%{transform:rotate(1.5deg)}}
.sm-rabbit.is-found{animation:sm-found .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes sm-found{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.sm-controls{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;height:112px;flex:none}
.sm-controls [hidden]{display:none!important}
.sm-hold{position:relative;overflow:hidden;width:min(100%, 340px);min-height:66px;padding:8px 20px;border-radius:999px;background:linear-gradient(#FCEBB2,#F4D27A);
  box-shadow:0 5px 0 #D2AE55, 0 10px 16px -8px rgba(80,60,20,.45);color:#6B4A2E;font-family:var(--font-display);font-weight:700;font-size:1.15rem;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .1s, box-shadow .1s}
.sm-fill{position:absolute;inset:0;background:linear-gradient(90deg,#BFDC9E,#93C26A);transform:scaleX(var(--p,0));transform-origin:left center;opacity:.75}
.sm-label{position:relative}
.sm-hold.is-pressed{transform:translateY(4px);box-shadow:0 1px 0 #D2AE55, 0 4px 8px -6px rgba(80,60,20,.4)}
.sm-hold.is-ready{box-shadow:0 1px 0 #D2AE55, 0 0 0 4px rgba(127,176,78,.45)}
.sm-hold[disabled]{opacity:.75;cursor:default}
.sm-tap{min-height:36px;font-size:.85rem}
.sm-tap[disabled]{opacity:.5;cursor:default}
.sm-again{min-width:200px;min-height:50px;padding:6px 26px;border-radius:999px;background:#FFF8E6;color:var(--gr-ink);font-family:var(--font-display);font-weight:700;font-size:1.1rem;
  box-shadow:inset 0 0 0 2px #E2CC9A, 0 4px 0 #D9C59A;animation:pmr-in .35s var(--ease)}
.sm-again:active{transform:translateY(3px)}
.gr-smell .gr-next{align-self:center}
.gr-smell .gr-astatus{flex:none;height:1.5em;line-height:1.5;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
